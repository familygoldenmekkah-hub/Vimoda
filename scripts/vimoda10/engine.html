<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
/*__FONTS__*/
*{box-sizing:border-box}
body{margin:0;background:#120C08;font-family:'Poppins','Noto Sans',sans-serif;-webkit-font-smoothing:antialiased}
#stage{position:relative;overflow:hidden}
#world{position:absolute;inset:0}
#flash{position:absolute;inset:0;background:#FFFFFF;opacity:0;pointer-events:none}
#fade{position:absolute;inset:0;background:#120C08;opacity:0;pointer-events:none}
.center{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.mono{font-family:'JetBrains Mono','DejaVu Sans Mono',monospace}
/* DAPOER POSYA: studio dapur roti bulat - dinding ubin mint dengan nat,
   lantai kotak-kotak terrakota-krim, balok kayu di plafon, panci tembaga
   gantung, jam dinding yang angka 12-nya diganti pi, meja kayu dengan
   kue bulat yang dibagi dua lalu dibagi empat.
   Latar BERBEDA TOTAL dari Menara Livo, Rumah Bulina, dan Kota Bilangan
   (aturan 26). Karakter: HANYA bola emas mentor, bulat sejati, tanpa mata
   (aturan 23). Subjudul zona aman maksimal dua baris (aturan 27);
   watermark AKIOMIDA di tepi paling bawah (aturan 24); penutup bersih
   (aturan 28). */
#tilewall{position:absolute;left:0;top:0;width:100%;
  background:repeating-linear-gradient(0deg,rgba(120,160,130,.28) 0 3px,transparent 3px 112px),
  repeating-linear-gradient(90deg,rgba(120,160,130,.28) 0 3px,transparent 3px 118px),
  linear-gradient(180deg,#EAF2E6 0%,#DFEBDA 100%)}
#tilesun{position:absolute;inset:0;background:rgba(58,38,26,0);will-change:background}
#ceiling{position:absolute;left:0;top:0;width:100%}
#ceiling .beam{position:absolute;background:linear-gradient(180deg,#8A6142,#6E4A30);border-radius:0 0 8px 8px;box-shadow:0 4px 10px rgba(20,10,4,.25)}
#ceiling .cord{position:absolute;width:4px;background:#4A3426}
#pan{position:absolute;will-change:opacity,transform}
#pan .panbody{position:absolute;border-radius:50%;background:radial-gradient(circle at 36% 30%,#D98F4A,#A85F28 62%,#7C451C 100%);box-shadow:0 8px 18px rgba(30,16,6,.3)}
#pan .panhole{position:absolute;border-radius:50%;background:linear-gradient(180deg,#EAF2E6,#DFEBDA)}
#clock{position:absolute;will-change:opacity}
#clock .face{position:absolute;border-radius:50%;background:radial-gradient(circle at 40% 32%,#FFF8EA,#F2E2C4 70%);border:7px solid #7C451C;box-shadow:0 8px 18px rgba(30,16,6,.25)}
#clock .pi{position:absolute;font-family:'JetBrains Mono','DejaVu Sans Mono',monospace;font-weight:800;color:#7C451C}
#clock .hand{position:absolute;width:5px;background:#4A3426;border-radius:3px}
#floorplank{position:absolute;left:0;width:100%;
  background:repeating-conic-gradient(#9C6248 0% 25%,#EFE3CF 0% 50%);background-size:180px 180px}
#floorshade{position:absolute;left:0;width:100%;background:linear-gradient(180deg,rgba(20,10,4,.22),rgba(20,10,4,.06) 40%,rgba(20,10,4,.28))}
#baseboard{position:absolute;left:0;width:100%;background:#5C3F2E}
#tableT{position:absolute;will-change:opacity}
#tableT .slab{position:absolute;background:linear-gradient(180deg,#A26E45,#8A5A3A);border-radius:10px;box-shadow:0 10px 22px rgba(30,16,6,.35)}
#tableT .leg{position:absolute;background:#6E4A30;border-radius:4px;width:26px}
#pizzaC{position:absolute;border-radius:50%;overflow:hidden;will-change:opacity,transform}
#pizzaC .dough{position:absolute;background:radial-gradient(circle at 35% 30%,#F4CB7A 0%,#E8B25C 58%,#C98A3B 100%);border-radius:50%}
#pizzaC .pdot{position:absolute;border-radius:50%;background:#C4472E;box-shadow:inset 0 -3px 5px rgba(120,30,10,.45)}
#pizzaC .cutline{position:absolute;background:repeating-linear-gradient(90deg,#7C451C 0 10px,transparent 10px 20px);opacity:0}
#pizzaC .cutlineH{position:absolute;background:repeating-linear-gradient(0deg,#7C451C 0 10px,transparent 10px 20px);opacity:0}
#pizzaC .wedge{position:absolute;background:rgba(242,178,74,0);will-change:background}
.halfp{position:absolute;will-change:opacity,transform}
.halfp .hdough{position:absolute;background:radial-gradient(circle at 50% 0%,#F4CB7A 0%,#E8B25C 58%,#C98A3B 100%)}
.plateE{position:absolute;border-radius:50%;background:radial-gradient(circle at 45% 30%,#FFFDF6,#EDE4D2 70%);border:4px solid #C9BBA2;box-shadow:0 6px 14px rgba(30,16,6,.25);will-change:transform,opacity}
.panelN{position:absolute;background:linear-gradient(180deg,#2E4638,#1F3226);border-radius:16px;box-shadow:0 16px 38px rgba(20,10,4,.5);will-change:transform,opacity}
.menuP{position:absolute;background:linear-gradient(180deg,#2E4638,#1F3226);border-radius:14px;border:6px solid #7C451C;box-shadow:0 16px 38px rgba(20,10,4,.5);will-change:transform,opacity}
.tapeC{position:absolute;background:rgba(242,178,74,.5);border-radius:3px;box-shadow:0 2px 5px rgba(20,10,4,.25)}
.pHd{font-weight:800;color:#FFF6E6;letter-spacing:.10em;text-align:center}
.pRow{display:flex;align-items:center;opacity:0}
.pDot{border-radius:50%;flex:none}
.pName{font-weight:800;color:#FFF6E6;flex:none}
.pEx{font-family:'JetBrains Mono','DejaVu Sans Mono',monospace;font-weight:800;color:#F2E2C4}
.pNote{display:flex;align-items:center;justify-content:center;background:rgba(242,178,74,.22);border:2px solid rgba(242,178,74,.55);border-radius:10px;color:#F6CE7E;font-weight:800;letter-spacing:.05em;text-align:center;opacity:0;will-change:opacity}
.menuRow{font-family:'JetBrains Mono','DejaVu Sans Mono',monospace;font-weight:800;color:#F6F1E2;opacity:0;display:flex;justify-content:space-between}
.pill2{display:flex;align-items:center;justify-content:center;border-radius:10px;font-weight:800;letter-spacing:.04em;opacity:0;will-change:opacity}
.ckmark{position:absolute}
.ckmark .a{position:absolute;background:#7FBF8E;border-radius:2px}
.ckmark .b{position:absolute;background:#7FBF8E;border-radius:2px}
.xxmark{position:absolute}
.xxmark .a{position:absolute;background:#D96A5A;border-radius:2px}
.xxmark .b{position:absolute;background:#D96A5A;border-radius:2px}
.hookChip{position:absolute;display:flex;align-items:center;justify-content:center;border-radius:14px;font-family:'JetBrains Mono','DejaVu Sans Mono',monospace;font-weight:800;color:#FFF6E6;box-shadow:0 10px 24px rgba(20,10,4,.45);will-change:transform,opacity}
.stamp{position:absolute;display:flex;align-items:center;justify-content:center;border-radius:999px;background:linear-gradient(92deg,#7FBF8E 0%,#E58BA5 52%,#F2C230 100%);color:#22160C;font-weight:800;letter-spacing:.06em;box-shadow:0 12px 26px rgba(20,10,4,.45);will-change:transform,opacity}
.ujiCard{position:absolute;display:flex;align-items:center;justify-content:center;border-radius:12px;background:linear-gradient(180deg,#FFFDF6,#EFE3CF);border:3px solid #C9BBA2;font-family:'JetBrains Mono','DejaVu Sans Mono',monospace;font-weight:800;color:#4A3426;box-shadow:0 10px 22px rgba(20,10,4,.4);will-change:transform,opacity}
.qmark{position:absolute;color:#F2C230;font-weight:800;text-shadow:0 5px 0 rgba(0,0,0,.25);will-change:transform,opacity}
.title{position:absolute;left:0;width:100%;text-align:center;font-weight:800;color:#4A3426;letter-spacing:.04em;text-shadow:0 5px 0 rgba(255,255,255,.42),0 12px 26px rgba(60,30,10,.22);will-change:transform,opacity}
#pil{position:absolute;border-radius:999px;background:linear-gradient(92deg,#7FBF8E 0%,#E58BA5 52%,#F2C230 100%);color:#22160C;font-weight:800;display:flex;align-items:center;justify-content:center;will-change:transform,opacity;box-shadow:0 10px 24px rgba(20,10,4,.4)}
#endcard{position:absolute;left:0;width:100%;opacity:0;will-change:transform,opacity}
#fplate{background:rgba(26,16,10,.62);border-radius:28px;padding:14px 44px;width:max-content;margin:0 auto;box-shadow:0 14px 34px rgba(20,10,4,.4)}
#f_url{font-weight:800;text-align:center}
#f_bar{height:7px;border-radius:4px;background:linear-gradient(90deg,#7FBF8E,#E58BA5,#F2C230)}
#subbar{position:absolute;left:50%;transform:translateX(-50%);background:rgba(26,16,10,.86);border-radius:20px;padding:18px 32px;text-align:center;box-shadow:0 14px 34px rgba(20,10,4,.5);will-change:transform,opacity}
#sub_id{font-weight:800;color:#FFFFFF;line-height:1.26}
#sub_en{color:#D9C8B4;font-weight:600}
#wm{position:absolute;font-weight:800;letter-spacing:.34em;color:#F6EFE2;font-family:'JetBrains Mono','DejaVu Sans Mono',monospace;border:1.5px solid rgba(246,239,226,.42);will-change:transform}
.bchar{position:absolute;will-change:transform,opacity}
.bchar .core{position:absolute;border-radius:100%}
.bchar .shine{position:absolute;border-radius:50%;background:rgba(255,255,255,.72);filter:blur(2px)}
.bsh{position:absolute;border-radius:50%;background:rgba(20,10,4,.4);filter:blur(2px)}
.spark{position:absolute;width:34px;height:34px;opacity:0}
.spark .sa{position:absolute;background:#FFE9A8;border-radius:3px}
</style>
</head>
<body>
<div id="stage">
  <div id="world">
    <div id="tilewall"></div>
    <div id="tilesun"></div>
    <div id="ceiling"></div>
    <div id="pan"><div class="panbody"></div><div class="panhole"></div></div>
    <div id="clock"><div class="face"></div><div class="pi">π</div><div class="hand"></div><div class="hand"></div></div>
    <div id="floorplank"></div>
    <div id="floorshade"></div>
    <div id="baseboard"></div>
    <div id="tableT"><div class="slab"></div><div class="leg"></div><div class="leg"></div></div>
    <div id="pizzaC"><div class="dough"></div><div class="cutline"></div><div class="cutlineH"></div><div class="wedge"></div><div class="wedge"></div><div class="wedge"></div><div class="wedge"></div></div>
    <div class="halfp"><div class="hdough"></div></div>
    <div class="halfp"><div class="hdough"></div></div>
    <div class="plateE"></div>
    <div class="plateE"></div>
    <div id="props"></div>
    <div id="chars"></div>
  </div>
  <div id="flash"></div>
  <div id="fade"></div>
  <div id="qchip" class="hookChip">1/2</div>
  <div id="pil">PERIKSA DI KOMEN</div>
  <div id="endcard">
    <div id="fplate"><div id="f_url">AKIOMIDA.COM</div></div>
    <div id="f_bar"></div>
  </div>
  <div class="title" id="t0">SETENGAH ITU APA?</div>
  <div class="title" id="t1">BILANGAN RASIONAL</div>
  <div class="title" id="t2">PEMBILANG &amp; PENYEBUT</div>
  <div class="title" id="t3">BENTUK DESIMAL</div>
  <div class="title" id="t4">MANA YANG BUKAN?</div>
  <div class="title" id="t5">PERIKSA SATU-SATU</div>
  <div id="subbar"><div id="sub_id"></div><div id="sub_en"></div></div>
  <div id="wm">AKIOMIDA</div>
</div>
<script>
const Q=new URLSearchParams(location.search);
const ORIENT=Q.get('o')||'landscape';
const W=ORIENT==='portrait'?1080:1920;
const H=ORIENT==='portrait'?1920:1080;

/* v10 "Juanila" - DUNIA BARU: DAPOER POSYA, studio dapur roti bulat:
   dinding ubin mint bernat, lantai kotak-kotak terrakota-krim, balok kayu
   plafon dengan panci tembaga gantung, jam dinding berlambang pi, meja kayu
   dengan kue bulat yang dibagi dua (hook) lalu dibagi empat (pembilang dan
   penyebut), papan menu kapur untuk konversi desimal, kartu uji yang dibalik
   satu per satu. Latar BERBEDA TOTAL dari Menara Livo dan episode lain
   (aturan 26). Karakter: HANYA bola emas mentor, bulat sejati, tanpa mata
   (aturan 23). Subjudul zona aman dua baris (aturan 27); watermark AKIOMIDA
   di tepi paling bawah (aturan 24); penutup bersih (aturan 28). */
const P = ORIENT==='portrait' ? {
  floorY:1080, bbY:1064, ceilH:110,
  tableX:50, tableW:330, slabY:830, slabH:52, legBot:1080,
  pizzaD:300, pizzaCX:215, pizzaCY:680,
  plate1X:120, plate2X:310, plateY:812, plateW:130, plateH:36,
  chipX:400, chipY:700, chipW:300, chipH:64, chipFS:34,
  panelX:400, panelY:470, panelW:610, panelH:360,
  stampX:470, stampY:620, stampW:470, stampH:60, stampFS:26,
  cardX0:380, cardSp:124, cardY:590, cardW:112, cardH:120, cardFS:30,
  pilX:325, pilY:760, pilW:430, pilH:70, pilFS:30,
  ecY:830, barW:420,
  titleY:300, titleS0:80, titleSN:74, titleS2:62,
  subTop:1170, subId:40, subEn:22, subMax:880,
  ballD:110, groundY:1120, wmY:1800, wmFS:20,
  pansX:[300,540,780], pansY:[178,150,164], pansD:[70,56,64],
  clockC:[75,478], clockD:88
} : {
  floorY:508, bbY:494, ceilH:70,
  tableX:140, tableW:360, slabY:540, slabH:40, legBot:700,
  pizzaD:260, pizzaCX:320, pizzaCY:410,
  plate1X:210, plate2X:430, plateY:528, plateW:110, plateH:30,
  chipX:760, chipY:560, chipW:300, chipH:60, chipFS:30,
  panelX:760, panelY:250, panelW:1020, panelH:290,
  stampX:990, stampY:450, stampW:560, stampH:56, stampFS:24,
  cardX0:915, cardSp:150, cardY:360, cardW:130, cardH:110, cardFS:30,
  pilX:760, pilY:600, pilW:400, pilH:65, pilFS:28,
  ecY:400, barW:520,
  titleY:150, titleS0:88, titleSN:72, titleS2:66,
  subTop:740, subId:38, subEn:20, subMax:1360,
  ballD:96, groundY:660, wmY:1010, wmFS:18,
  pansX:[600,960,1320], pansY:[128,104,118], pansD:[58,46,52],
  clockC:[105,305], clockD:80
};
const stage=document.getElementById('stage');
stage.style.width=W+'px';stage.style.height=H+'px';

/* ---------- util & easing ---------- */
const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,p)=>a+(b-a)*p;
const seg=(t,a,d)=>clamp((t-a)/d,0,1);
const eio=p=>p<0.5?2*p*p:1-Math.pow(-2*p+2,2)/2;
const eoe=p=>1-Math.pow(1-p,3);
const smz=(t,a,b,f)=>f?clamp((t-a)/f,0,1)*clamp((b-t)/f,0,1):(t>=a&&t<b?1:0);
function popA(el,t,t0,d,ov,op0,op1){
  const o=clamp(seg(t,t0,0.3)*(1-seg(t,op1,0.35)),0,1);
  const s2=1+(ov/100)*Math.sin(clamp(seg(t,t0,d),0,1)*Math.PI)*(1-seg(t,op1,0.35));
  el.style.opacity=String(o);
  el.style.transform=`scale(${s2.toFixed(3)})`;
}
let _seed=20261117;
const rnd=()=>{_seed|=0;_seed=_seed+0x6D2B79F5|0;let z=Math.imul(_seed^_seed>>>15,1|_seed);
  z=z+Math.imul(z^z>>>7,61|z)^z;return((z^z>>>14)>>>0)/4294967296;};

/* ---------- dinding ubin, plafon balok, panci, jam pi, lantai ---------- */
const wallEl=document.getElementById('tilewall');
wallEl.style.cssText+=`height:${P.floorY}px;`;
const floorEl=document.getElementById('floorplank');
floorEl.style.cssText+=`top:${P.floorY}px;height:${H-P.floorY}px;`;
const shadeEl=document.getElementById('floorshade');
shadeEl.style.cssText+=`top:${P.floorY}px;height:${H-P.floorY}px;opacity:.75;`;
const bbEl=document.getElementById('baseboard');
bbEl.style.cssText+=`top:${P.bbY}px;height:${P.floorY-P.bbY}px;`;
const ceilEl=document.getElementById('ceiling');
ceilEl.style.cssText+=`height:${P.ceilH}px;`;
const PANS=[];
{
  const band=document.createElement('div');
  band.className='beam';
  band.style.cssText+=`left:0;top:0;width:100%;height:${Math.round(P.ceilH*0.34)}px;`;
  ceilEl.appendChild(band);
  const nb=ORIENT==='portrait'?3:4;
  for(let i=0;i<nb;i++){
    const bx=lerp(W*0.1,W*0.9,i/(nb-1));
    const bm=document.createElement('div');
    bm.className='beam';
    const bw=Math.round(P.ceilH*0.22);
    bm.style.cssText+=`left:${bx-bw/2}px;top:0;width:${bw}px;height:${P.ceilH}px;border-radius:${bw/2}px ${bw/2}px 8px 8px;`;
    ceilEl.appendChild(bm);
  }
  /* satu grup panci gantung: tiga panci berbeda ukuran */
  const panG=document.getElementById('pan');
  P.pansX.forEach((px,i)=>{
    const py=P.pansY[i], pd=P.pansD[i];
    const cord=document.createElement('div');
    cord.className='cord';
    cord.style.cssText+=`left:${px-2}px;top:${Math.round(P.ceilH*0.9)}px;height:${py-Math.round(P.ceilH*0.9)}px;`;
    panG.appendChild(cord);
    const body=document.createElement('div');
    body.className='panbody';
    body.style.cssText+=`left:${px-pd/2}px;top:${py}px;width:${pd}px;height:${pd}px;`;
    panG.appendChild(body);
    const hole=document.createElement('div');
    hole.className='panhole';
    hole.style.cssText+=`left:${px-pd*0.18}px;top:${py+pd*0.3}px;width:${pd*0.36}px;height:${pd*0.36}px;`;
    panG.appendChild(hole);
    PANS.push({cord,body,hole,ph:i*1.7});
  });
}
/* jam dinding: angka 12 diganti lambang pi (bekal bab 4) */
const clockEl=document.getElementById('clock');
{
  const [cx,cy]=P.clockC, cd=P.clockD;
  const face=clockEl.querySelector('.face');
  face.style.cssText+=`left:${cx-cd/2}px;top:${cy-cd/2}px;width:${cd}px;height:${cd}px;`;
  const pi=clockEl.querySelector('.pi');
  pi.style.cssText+=`left:${cx-cd*0.16}px;top:${cy-cd*0.42}px;font-size:${Math.round(cd*0.34)}px;`;
  const h1=clockEl.querySelector('.hand'), h2=clockEl.querySelectorAll('.hand')[1];
  h1.style.cssText+=`left:${cx-2}px;top:${cy-cd*0.34}px;height:${cd*0.34}px;`;
  h2.style.cssText+=`left:${cx+cd*0.12}px;top:${cy-2}px;height:${cd*0.24}px;transform:rotate(90deg);transform-origin:0 50%;`;
}

/* ---------- meja kayu dan kue bulat ---------- */
const tableEl=document.getElementById('tableT');
{
  const slab=tableEl.querySelector('.slab');
  slab.style.cssText+=`left:${P.tableX}px;top:${P.slabY}px;width:${P.tableW}px;height:${P.slabH}px;`;
  const legs=tableEl.querySelectorAll('.leg');
  legs[0].style.cssText+=`left:${P.tableX+26}px;top:${P.slabY+P.slabH}px;height:${P.legBot-P.slabY-P.slabH}px;`;
  legs[1].style.cssText+=`left:${P.tableX+P.tableW-52}px;top:${P.slabY+P.slabH}px;height:${P.legBot-P.slabY-P.slabH}px;`;
}
const pizzaEl=document.getElementById('pizzaC');
{
  const d=P.pizzaD;
  pizzaEl.style.cssText+=`left:${P.pizzaCX-d/2}px;top:${P.pizzaCY-d/2}px;width:${d}px;height:${d}px;border:${Math.round(d*0.055)}px solid #A96B2F;`;
  const dg=pizzaEl.querySelector('.dough');
  dg.style.cssText+=`left:0;top:0;width:${d}px;height:${d}px;`;
  /* taburan mesis: titik-titik tetap (seed deterministik) */
  for(let i=0;i<7;i++){
    const dot=document.createElement('div');
    dot.className='pdot';
    const dd=Math.round(d*(0.07+rnd()*0.05));
    const dx=d*(0.12+rnd()*0.62), dy=d*(0.12+rnd()*0.62);
    dot.style.cssText+=`left:${dx.toFixed(0)}px;top:${dy.toFixed(0)}px;width:${dd}px;height:${dd}px;`;
    pizzaEl.appendChild(dot);
  }
  const cv=pizzaEl.querySelector('.cutline');
  cv.style.cssText+=`left:${d/2-3}px;top:0;width:6px;height:${d}px;`;
  const ch=pizzaEl.querySelector('.cutlineH');
  ch.style.cssText+=`left:0;top:${d/2-3}px;width:${d}px;height:6px;`;
  const wg=pizzaEl.querySelectorAll('.wedge');
  const pos=[[0,0],[d/2,0],[0,d/2],[d/2,d/2]];
  wg.forEach((w,i)=>{
    w.style.cssText+=`left:${pos[i][0]}px;top:${pos[i][1]}px;width:${d/2}px;height:${d/2}px;`;
  });
}
/* dua setengah lingkaran untuk hook */
const HALFP=[];
document.querySelectorAll('.halfp').forEach((hp,i)=>{
  const d=P.pizzaD;
  const hd=hp.querySelector('.hdough');
  if(i===0){
    hd.style.cssText+=`left:0;top:0;width:${d}px;height:${d/2}px;border-radius:${d/2}px ${d/2}px 0 0;border-top:${Math.round(d*0.055)}px solid #A96B2F;background:radial-gradient(circle at 35% 20%,#F4CB7A 0%,#E8B25C 55%,#C98A3B 100%);`;
    hp.style.cssText+=`left:${P.pizzaCX-d/2}px;top:${P.pizzaCY-d/2}px;width:${d}px;height:${d/2}px;opacity:0;`;

  const splitP=eio(seg(t,2.45,0.45));
  const wholeO=clamp(wholeIn*(1-seg(t,2.45,0.25))*(1-seg(t,2.45,0.25))+(t>=6.9?seg(t,6.9,0.4):0),0,1);
  pizzaEl.style.opacity=String(clamp(wholeO,0,1)*exo);
  pizzaEl.style.transform=`scale(${(1+0.06*Math.sin(clamp(seg(t,0.9,0.7),0,1)*Math.PI)*(1-seg(t,2.45,0.25))).toFixed(3)})`;
  pizzaEl.style.left=(P.pizzaCX-P.pizzaD/2)+'px';
  pizzaEl.style.top=(P.pizzaCY-P.pizzaD/2)+'px';
  const cvEl=pizzaEl.querySelector('.cutline');
  cvEl.style.opacity=clamp(Math.max(smz(t,1.5,2.45,0.3),smz(t,19.4,99,0.4)),0,1).toFixed(3);
  const chEl=pizzaEl.querySelector('.cutlineH');
  chEl.style.opacity=smz(t,19.4,99,0.4).toFixed(3);
  const WEDGES=pizzaEl.querySelectorAll('.wedge');
  const lit=seg(t,20.2,0.4);
  [[0,0],[1,0],[0,1]].forEach(([wx,wy],i)=>{
    WEDGES[i].style.background=`rgba(242,178,74,${(0.45*lit).toFixed(3)})`;
  });
  /* dua setengahan: dari kue ke piring */
  const d=P.pizzaD, sc=0.5;
  const t1x=[P.pizzaCX-d/2, P.plate1X-d*sc/2], t1y=[P.pizzaCY-d/2, P.plateY-d*sc/2-6];
  const t2x=[P.pizzaCX-d/2, P.plate2X-d*sc/2], t2y=[P.pizzaCY, P.plateY-d*sc/2-6];
  const hO=clamp(seg(t,2.45,0.25)*(1-seg(t,6.4,0.3)),0,1);
  HALFP[0].style.opacity=String(hO);
  HALFP[0].style.transform=`translate(${((t1x[1]-t1x[0])*splitP).toFixed(1)}px,${((t1y[1]-t1y[0])*splitP).toFixed(1)}px) scale(${lerp(1,sc,splitP).toFixed(3)})`;
  HALFP[1].style.opacity=String(hO);
  HALFP[1].style.transform=`translate(${((t2x[1]-t2x[0])*splitP).toFixed(1)}px,${((t2y[1]-t2y[0])*splitP).toFixed(1)}px) scale(${lerp(1,sc,splitP).toFixed(3)})`;
  for(const pl of PLATES){
    pl.el.style.opacity=clamp(seg(t,2.2,0.3)*(1-seg(t,6.4,0.3)),0,1).toFixed(3);
    pl.el.style.transform=`translateY(${((1-eio(seg(t,2.2,0.4)))*14).toFixed(1)}px)`;
  }
  popA(chipHalf,t,3.2,0.5,6,0,6.4);
  popA(stamp,t,3.6,0.55,7,0,6.4);
  /* panel 1: definisi a/b, syarat, contoh, twist bulat juga rasional */
  popA(panel1,t,7.0,0.6,5,0,17.0);
  for(const r of P1ROWS){ r.el.style.opacity=seg(t,r.t0,0.45).toFixed(3); }
  for(const c of P1CHIPS){
    c.el.style.opacity=(clamp(seg(t,c.t0,0.35),0,1)*(1-seg(t,17.0,0.3))).toFixed(3);
  }
  p1Note.textContent = t>=16.5 ? 'BILANGAN BULAT JUGA RASIONAL' : 'RASIONAL BUKAN HANYA PECAHAN';
  popA(p1Note,t,10.8,0.5,5,0,17.0);
  /* panel 2: pembilang dan penyebut + kue dibagi empat */
  popA(panel2,t,21.8,0.55,5,0,32.5);
  for(const r of P2ROWS){ r.el.style.opacity=seg(t,r.t0,0.4).toFixed(3); }
  popA(p2Note,t,26.7,0.45,5,0,32.5);
  /* menu kapur: konversi desimal */
  popA(menuP,t,33.0,0.55,5,0,40.5);
  for(const r of MROWS){ r.el.style.opacity=seg(t,r.t0,0.4).toFixed(3); }
  popA(pillA,t,36.4,0.4,5,0,40.5);
  popA(pillB,t,37.2,0.4,5,0,40.5);
  /* panel 4: mana yang bukan rasional (pi) */
  popA(panel4,t,40.9,0.55,5,0,44.3);
  for(const r of P4ROWS){ r.el.style.opacity=seg(t,r.t0,0.4).toFixed(3); }
  popA(p4Note,t,42.8,0.45,5,0,44.3);
  /* kartu uji: lima bilangan dibalik satu per satu */
  for(const c of CARDS){
    const inA=seg(t,44.7,0.3);
    const fl=t>=c.flip;
    if(c.el.textContent!==(fl?c.val:'?'))c.el.textContent=fl?c.val:'?';
    const bounce=1+0.12*Math.sin(clamp(seg(t,c.flip,0.4),0,1)*Math.PI)*(fl?1:0);
    c.el.style.opacity=(inA*exo).toFixed(3);
    c.el.style.transform=`scale(${bounce.toFixed(3)})`;
    c.el.style.borderColor=fl&&t<c.flip+0.5?'#F2C230':'#C9BBA2';
  }
  popA(pil,t,47.7,0.6,6,0,49.8);
  tableEl.style.opacity=exo.toFixed(3);
  /* mentor: menggelinding antar stasiun di lantai kedai */
  let bx=WAY[WAY.length-1][1];
  for(let k=0;k<WAY.length-1;k++){
    const [w0,x0]=WAY[k],[w1,x1]=WAY[k+1];
    if(t>=w0&&t<w1){ bx=lerp(x0,x1,eio(seg(t,w0,w1-w0))); break; }
  }
  if(t>=WAY[WAY.length-1][0])bx=WAY[WAY.length-1][1];
  if(_mxPrev===null)_mxPrev=bx;
  _roll+=(bx-_mxPrev)/(P.ballD/2)*(180/Math.PI);
  _mxPrev=bx;
  const ep=seg(t,0.6,0.55);
  let hy2=0, lrot=0, drot=0, txj=0;
  for(const [gs,gd,gt,ga] of GESTS){
    const d2=t-gs;
    if(d2>=0&&d2<gd){
      const p=d2/gd, w=Math.sin(p*Math.PI);
      if(gt==='tilt'||gt==='lean'){ lrot+=ga*w; }
      else if(gt==='nod'){ lrot+=ga*Math.sin(p*2*Math.PI); }
      else if(gt==='shiver'){ txj=ga*Math.sin(p*40)*(1-p); }
      else if(gt==='spin'){ drot+=ga*eio(p); }
    }
  }
  mentor.el.style.left=bx.toFixed(1)+'px';
  mentor.el.style.opacity=String(clamp(ep*3,0,1)*exo);
  mentor.el.style.top=(P.groundY-P.ballD+hy2).toFixed(1)+'px';
  mentor.el.style.transform=`translateX(${txj.toFixed(1)}px) rotate(${(_roll+lrot+drot).toFixed(2)}deg) scale(1)`;
  msh.style.left=bx.toFixed(1)+'px';
  msh.style.top=(P.groundY-10)+'px';
  msh.style.opacity=String(clamp(ep*3,0,1)*exo*clamp(0.42+hy2*0.006,0.18,0.5));
  msh.style.transform=`scaleX(${clamp((1+hy2*0.004),0.4,1.08).toFixed(3)})`;
  /* percikan bintang */
  let spo=0;
  for(const [sa,sb] of SPARKS){
    if(t>=sa&&t<sb) spo=smz(t,sa,sb,0.35)*(0.65+0.2*Math.sin(t*7));
  }
  spark.style.opacity=String(clamp(spo,0,1));
  spark.style.left=(bx+62).toFixed(1)+'px';
  spark.style.top=(P.groundY-150+Math.sin(t*2)*4).toFixed(1)+'px';
  spark.style.transform=`rotate(${((t*28)%360).toFixed(0)}deg) scale(${(0.8+0.15*Math.sin(t*7)).toFixed(3)})`;
  /* judul bab (judul terakhir ikut keluar saat penutup agar endcard sendirian) */
  for(let i=0;i<TITLES.length;i++){
    const o=TITLES[i];
    const tEnd=i+1<TITLES.length?TITLES[i+1].t0:50.2;
    const oin=seg(t,o.t0,0.35)*(1-seg(t,tEnd-0.25,0.3));
    const sc2=1+0.035*Math.sin(clamp(seg(t,o.t0,0.7),0,1)*Math.PI);
    o.el.style.opacity=oin.toFixed(3);
    o.el.style.transform=`scale(${sc2.toFixed(3)})`;
  }
  /* endcard penutup bersih: AKIOMIDA.COM muncul SENDIRIAN di layar yang tenang */
  const eci=eio(seg(t,50.2,0.7));
  endcard.style.opacity=eci.toFixed(3);
  endcard.style.transform=`translateY(${((1-eci)*16).toFixed(1)}px) scale(${(0.94+0.06*eci).toFixed(3)})`;
  fBar.style.width=(seg(t,50.9,0.5)*P.barW).toFixed(0)+'px';
  renderSub(t);
  /* kamera tenang */
  const im=imp(t);
  const shx=Math.sin(t*47)*2.5*im, shy=Math.sin(t*39+1.7)*1.8*im;
  world.style.transform=`translate(${shx.toFixed(2)}px,${(shy+Math.sin(t*0.35)*3).toFixed(2)}px)`;
  flash.style.opacity=(im*0.07).toFixed(3);
  fade.style.opacity=String(clamp(1-seg(t,0.05,0.5),0,1)*0.96+clamp(seg(t,51.4,0.6),0,1));
}
renderFrame(0);
window.__ready=true;
</script>
</body>
</html>
