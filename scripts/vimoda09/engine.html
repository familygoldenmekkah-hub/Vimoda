<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
/*__FONTS__*/
*{box-sizing:border-box}
body{margin:0;background:#0B1220;font-family:'Poppins','Noto Sans',sans-serif;-webkit-font-smoothing:antialiased}
#stage{position:relative;overflow:hidden}
#world{position:absolute;inset:0}
#flash{position:absolute;inset:0;background:#FFFFFF;opacity:0;pointer-events:none}
#fade{position:absolute;inset:0;background:#0B1220;opacity:0;pointer-events:none}
.center{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.mono{font-family:'JetBrains Mono','DejaVu Sans Mono',monospace}
/* MENARA LIVO: potongan menara lift kaca bersalju - langit dingin, siluet kota,
   salju turun, shaft lift tembus basement, termometer raksasa, garis bilangan
   di kener dinding. Latar episode ini BERBEDA TOTAL dari Rumah Bulina (aturan 26).
   Karakter: HANYA bola emas mentor, bulat sejati, tanpa mata (aturan 23). */
#skyday{position:absolute;inset:0;background:linear-gradient(180deg,#A8C8E2 0%,#C4DAEC 55%,#DCE9F2 100%)}
#skynight{position:absolute;inset:0;background:linear-gradient(180deg,#0E1930 0%,#16233E 55%,#1D2C4C 100%);opacity:0}
#skyline{position:absolute;left:0;width:100%}
#snow{position:absolute;inset:0}
#frostday{position:absolute;inset:0;background:rgba(226,238,248,.34)}
#frostnight{position:absolute;inset:0;background:rgba(14,24,44,.42);opacity:0}
#ceiling{position:absolute;left:0;top:0;width:100%}
#ceiling .cl{position:absolute;background:#1B2A42;border-radius:0 0 10px 10px}
#ceiling .lamp{position:absolute;border-radius:50%;background:radial-gradient(circle,rgba(255,214,130,.55),rgba(255,214,130,0) 70%);opacity:0}
#floorplank{position:absolute;left:0;width:100%;background:repeating-linear-gradient(90deg,rgba(255,255,255,.05) 0 3px,transparent 3px 190px),linear-gradient(180deg,#2B3850 0,#1F2A3E 100%)}
#baseboard{position:absolute;left:0;width:100%;background:#3A4A66}
#rail{position:absolute;left:0;top:0;width:100%}
#rail .rline{position:absolute;height:5px;border-radius:3px;background:rgba(220,232,244,.85)}
#rail .rtick{position:absolute;width:4px;border-radius:2px;background:rgba(220,232,244,.85);opacity:.35;will-change:opacity}
#rail .rnum{position:absolute;font-family:'JetBrains Mono','DejaVu Sans Mono',monospace;font-weight:800;color:#DCE8F4;opacity:.35;will-change:opacity}
#shaft{position:absolute;will-change:opacity}
#shaft .glass{position:absolute;background:linear-gradient(180deg,rgba(20,32,54,.88),rgba(14,22,40,.92));border:8px solid #33506E;border-radius:12px;box-shadow:0 14px 34px rgba(4,10,20,.5)}
#shaft .guide{position:absolute;width:7px;background:rgba(120,160,200,.35);border-radius:4px}
#shaft .beam{position:absolute;background:#33506E;border-radius:3px}
#shaft .plate{position:absolute;display:flex;align-items:center;justify-content:center;background:#0F1B30;border:3px solid #44648C;border-radius:8px;font-family:'JetBrains Mono','DejaVu Sans Mono',monospace;font-weight:800;color:#BFD2E6;will-change:opacity,box-shadow}
#shaft .cut{position:absolute;left:0;width:100%;background:repeating-linear-gradient(45deg,#243448 0 14px,#1C2A3C 14px 28px);opacity:0}
#thermo{position:absolute;will-change:opacity}
#thermo .tframe{position:absolute;background:rgba(240,246,252,.16);border:6px solid #44648C;border-radius:14px}
#thermo .tube{position:absolute;background:rgba(248,252,255,.92);border:5px solid #44648C;border-radius:26px;overflow:hidden}
#thermo .mercury{position:absolute;background:linear-gradient(180deg,#E15B5B,#B42E2E);width:100%}
#thermo .bulb{position:absolute;border-radius:50%;background:radial-gradient(circle at 35% 30%,#F08A7A,#B42E2E 75%)}
#thermo .tmark{position:absolute;font-family:'JetBrains Mono','DejaVu Sans Mono',monospace;font-weight:800;color:#DCE8F4}
#thermo .tline{position:absolute;height:3px;background:rgba(220,232,244,.7)}
#thermo .frost{position:absolute;border-radius:50%;border:3px solid rgba(170,215,245,.75);opacity:0}
#acuan{position:absolute;left:0;width:100%;will-change:opacity}
#acuan .aline{position:absolute;left:0;width:100%;height:0;border-top:4px dashed rgba(233,177,91,.85)}
#acuan .alab{position:absolute;font-family:'JetBrains Mono','DejaVu Sans Mono',monospace;font-weight:800;color:#E9B15B;letter-spacing:.08em}
#liftcar{position:absolute;will-change:transform,opacity}
#liftcar .body{position:absolute;background:linear-gradient(180deg,#F2B24A,#D98F2E);border-radius:12px;box-shadow:0 10px 24px rgba(4,10,20,.45)}
#liftcar .roof{position:absolute;background:#8B5A2B00;background:#B4771F;border-radius:8px}
#liftcar .cwin{position:absolute;background:linear-gradient(180deg,#14223A,#0E1830);border-radius:8px;border:4px solid #B4771F;overflow:hidden}
#liftcar .cable{position:absolute;width:5px;background:rgba(200,215,230,.5)}
.panelN{position:absolute;background:linear-gradient(180deg,#22304E,#18233B);border-radius:16px;box-shadow:0 16px 38px rgba(4,10,20,.5);will-change:transform,opacity}
.tapeC{position:absolute;background:rgba(150,200,230,.45);border-radius:3px;box-shadow:0 2px 5px rgba(0,0,0,.25)}
.pHd{font-weight:800;color:#FFFFFF;letter-spacing:.10em;text-align:center}
.pRow{display:flex;align-items:center;opacity:0}
.pDot{border-radius:50%;flex:none}
.pName{font-weight:800;color:#FFFFFF;flex:none}
.pEx{font-family:'JetBrains Mono','DejaVu Sans Mono',monospace;font-weight:800;color:#BFD2E6}
.pNote{display:flex;align-items:center;justify-content:center;background:rgba(242,178,74,.24);border:2px solid rgba(242,178,74,.55);border-radius:10px;color:#F2C96B;font-weight:800;letter-spacing:.05em;text-align:center;opacity:0;will-change:opacity}
.hookChip{position:absolute;display:flex;align-items:center;justify-content:center;border-radius:14px;font-family:'JetBrains Mono','DejaVu Sans Mono',monospace;font-weight:800;color:#FFFFFF;box-shadow:0 10px 24px rgba(4,10,20,.45);will-change:transform,opacity}
.stamp{position:absolute;display:flex;align-items:center;justify-content:center;border-radius:999px;background:linear-gradient(92deg,#2BB3A6 0%,#8A6FC6 52%,#E9B45C 100%);color:#0B1220;font-weight:800;letter-spacing:.06em;box-shadow:0 12px 26px rgba(4,10,20,.45);will-change:transform,opacity}
.cmpChip{position:absolute;display:flex;align-items:center;justify-content:center;border-radius:12px;background:linear-gradient(180deg,#22304E,#18233B);border:3px solid #44648C;font-family:'JetBrains Mono','DejaVu Sans Mono',monospace;font-weight:800;color:#FFFFFF;box-shadow:0 10px 24px rgba(4,10,20,.5);will-change:transform,opacity}
.cmpTrail{position:absolute;border-radius:10px;background:linear-gradient(90deg,rgba(139,111,198,0),rgba(139,111,198,.55));opacity:0}
.eqchip{position:absolute;display:flex;align-items:center;justify-content:center;border-radius:12px;background:linear-gradient(180deg,#22304E,#18233B);border:3px solid #44648C;font-family:'JetBrains Mono','DejaVu Sans Mono',monospace;font-weight:800;color:#FFFFFF;box-shadow:0 10px 24px rgba(4,10,20,.5);will-change:transform,opacity}
.ckmark{position:absolute}
.ckmark .a{position:absolute;background:#2BB3A6;border-radius:2px}
.ckmark .b{position:absolute;background:#2BB3A6;border-radius:2px}
.xxmark{position:absolute}
.xxmark .a{position:absolute;background:#E15B5B;border-radius:2px}
.xxmark .b{position:absolute;background:#E15B5B;border-radius:2px}
.qmark{position:absolute;color:#F2B24A;font-weight:800;text-shadow:0 5px 0 rgba(0,0,0,.25);will-change:transform,opacity}
.title{position:absolute;left:0;width:100%;text-align:center;font-weight:800;color:#22304E;letter-spacing:.04em;text-shadow:0 5px 0 rgba(255,255,255,.38),0 12px 26px rgba(10,20,40,.22);will-change:transform,opacity}
#pil{position:absolute;border-radius:999px;background:linear-gradient(92deg,#2BB3A6 0%,#8A6FC6 52%,#E9B45C 100%);color:#0B1220;font-weight:800;display:flex;align-items:center;justify-content:center;will-change:transform,opacity;box-shadow:0 10px 24px rgba(0,0,0,.4)}
#endcard{position:absolute;left:0;width:100%;opacity:0;will-change:transform,opacity}
#f_url{font-weight:800;text-align:center}
#f_bar{height:7px;border-radius:4px;background:linear-gradient(90deg,#2BB3A6,#8A6FC6,#E9B45C)}
#subbar{position:absolute;left:50%;transform:translateX(-50%);background:rgba(10,16,28,.86);border-radius:20px;padding:18px 32px;text-align:center;box-shadow:0 14px 34px rgba(4,10,20,.5);will-change:transform,opacity}
#sub_id{font-weight:800;color:#FFFFFF;line-height:1.26}
#sub_en{color:#B9C7DC;font-weight:600}
#wm{position:absolute;font-weight:800;letter-spacing:.34em;color:#F4EDE0;font-family:'JetBrains Mono','DejaVu Sans Mono',monospace;border:1.5px solid rgba(244,237,224,.42);will-change:transform}
.bchar{position:absolute;will-change:transform,opacity}
.bchar .core{position:absolute;border-radius:100%}
.bchar .shine{position:absolute;border-radius:50%;background:rgba(255,255,255,.72);filter:blur(2px)}
.bsh{position:absolute;border-radius:50%;background:rgba(4,10,20,.4);filter:blur(2px)}
.snowp{position:absolute;border-radius:50%;background:rgba(255,255,255,.9);will-change:transform,opacity}
.spark{position:absolute;width:34px;height:34px;opacity:0}
.spark .sa{position:absolute;background:#FFE9A8;border-radius:3px}
</style>
</head>
<body>
<div id="stage">
  <div id="world">
    <div id="skyday"></div>
    <div id="skynight"></div>
    <div id="skyline"></div>
    <div id="snow"></div>
    <div id="frostday"></div>
    <div id="frostnight"></div>
    <div id="ceiling"></div>
    <div id="floorplank"></div>
    <div id="baseboard"></div>
    <div id="rail"></div>
    <div id="shaft"></div>
    <div id="thermo"></div>
    <div id="acuan"><div class="aline"></div><div class="alab">ACUAN 0</div></div>
    <div id="props"></div>
    <div id="chars"></div>
  </div>
  <div id="flash"></div>
  <div id="fade"></div>
  <div id="liftcar"><div class="cable"></div><div class="body"></div><div class="roof"></div><div class="cwin"></div></div>
  <div id="eqchip" class="eqchip">4 - 9 = -5</div>
  <div id="qchip" class="eqchip">2 - 5 = ?</div>
  <div id="qm" class="qmark">?</div>
  <div id="pil">JAWAB DI KOMEN</div>
  <div id="endcard">
    <div id="f_url">AKIOMIDA.COM</div>
    <div id="f_bar"></div>
  </div>
  <div class="title" id="t0">APA KESAMAANNYA?</div>
  <div class="title" id="t1">BILANGAN BULAT</div>
  <div class="title" id="t2">KENAPA MINUS?</div>
  <div class="title" id="t3">MANA LEBIH BESAR?</div>
  <div class="title" id="t4">BUKAN PECAHAN</div>
  <div class="title" id="t5">UJI LIFT</div>
  <div id="subbar"><div id="sub_id"></div><div id="sub_en"></div></div>
  <div id="wm">AKIOMIDA</div>
</div>
<script>
const Q=new URLSearchParams(location.search);
const ORIENT=Q.get('o')||'landscape';
const W=ORIENT==='portrait'?1080:1920;
const H=ORIENT==='portrait'?1920:1080;

/* v09 "Huyuan" - DUNIA BARU: MENARA LIVO, potongan menara lift kaca bersalju:
   langit dingin berubah siang ke malam bersalju, siluet kota berjendela nyala,
   shaft lift tembus basement dengan plak lantai +3 sampai -3, termometer raksasa,
   garis bilangan besar di kener dinding, garis acuan 0 putus-putus melintang.
   Latar BERBEDA TOTAL dari Rumah Bulina dan Kota Bilangan (aturan 26).
   Karakter: HANYA bola emas mentor, bulat sejati, tanpa mata (aturan 23).
   Subjudul zona aman dan maksimal dua baris (aturan 27); watermark AKIOMIDA di
   tepi paling bawah tanpa menutupi konten (aturan 24); penutup bersih (aturan 28). */
const P = ORIENT==='portrait' ? {
  floorY:1080, bbY:1064, ceilH:110,
  railY:1000, railC:720, railSp:56, railHalf:280, tickFS:24, tickH:16,
  shaftX:50, shaftW:290, shaftTop:560, shaftBot:1160,
  carX:95, carW:200, carH:150,
  floor0:900, floorSp:80,
  plateW:74, plateH:36, plateFS:24,
  thermoX:730, thermoY:470, thermoW:220, thermoH:410,
  acuanY:903,
  panelX:400, panelY:470, panelW:610, panelH:360,
  chipX0:430, chipSp:78, chipW:96, chipH:88, chipFS:36, chipY:495,
  stampY:656, stampW:470, stampH:62, stampFS:28,
  eqX:400, eqY:830, eqW:300, eqH:64, eqFS:34,
  qcX:400, qcY:830, qcW:300, qcH:64,
  qmX:352, qmY:1075, qmFS:76,
  pilX:325, pilY:980, pilW:430, pilH:70, pilFS:30,
  ecY:830, barW:420,
  titleY:300, titleS0:80, titleSN:74,
  subTop:1170, subId:40, subEn:22, subMax:880,
  ballD:110, groundY:1120, wmY:1800, wmFS:20,
  snowN:16, snowZone:[0,120,1080,1020]
} : {
  floorY:508, bbY:494, ceilH:70,
  railY:460, railC:960, railSp:80, railHalf:400, tickFS:22, tickH:14,
  shaftX:140, shaftW:300, shaftTop:290, shaftBot:735,
  carX:185, carW:180, carH:120,
  floor0:550, floorSp:55,
  plateW:64, plateH:32, plateFS:22,
  thermoX:520, thermoY:250, thermoW:180, thermoH:290,
  acuanY:553,
  panelX:760, panelY:250, panelW:1020, panelH:290,
  chipX0:790, chipSp:140, chipW:120, chipH:104, chipFS:44, chipY:285,
  stampY:428, stampW:560, stampH:58, stampFS:26,
  eqX:760, eqY:560, eqW:300, eqH:60, eqFS:30,
  qcX:460, qcY:590, qcW:280, qcH:64,
  qmX:452, qmY:565, qmFS:58,
  pilX:760, pilY:620, pilW:400, pilH:65, pilFS:28,
  ecY:400, barW:520,
  titleY:150, titleS0:88, titleSN:72,
  subTop:740, subId:38, subEn:20, subMax:1360,
  ballD:96, groundY:660, wmY:1010, wmFS:18,
  snowN:14, snowZone:[0,80,1920,500]
};
const MX=60;
const stage=document.getElementById('stage');
stage.style.width=W+'px';stage.style.height=H+'px';

/* ---------- util & easing ---------- */
const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,p)=>a+(b-a)*p;
const seg=(t,a,d)=>clamp((t-a)/d,0,1);
const eio=p=>p<0.5?2*p*p:1-Math.pow(-2*p+2,2)/2;
const eoe=p=>1-Math.pow(1-p,3);
const smz=(t,a,b,f)=>f?clamp((t-a)/f,0,1)*clamp((b-t)/f,0,1):(t>=a&&t<b?1:0);
function popA(el,t,t0,d,ov,op0,op1){
  const o=clamp(seg(t,t0,0.3)*(1-seg(t,op1,0.35)),0,1);
  const s2=1+(ov/100)*Math.sin(clamp(seg(t,t0,d),0,1)*Math.PI)*(1-seg(t,op1,0.35));
  el.style.opacity=String(o);
  el.style.transform=`scale(${s2.toFixed(3)})`;
}
let _seed=20261116;
const rnd=()=>{_seed|=0;_seed=_seed+0x6D2B79F5|0;let z=Math.imul(_seed^_seed>>>15,1|_seed);
  z=z+Math.imul(z^z>>>7,61|z)^z;return((z^z>>>14)>>>0)/4294967296;};

/* ---------- langit, siluet kota, salju, plafond, lantai ---------- */
const floorEl=document.getElementById('floorplank');
floorEl.style.cssText+=`top:${P.floorY}px;height:${H-P.floorY}px;`;
const bbEl=document.getElementById('baseboard');
bbEl.style.cssText+=`top:${P.bbY}px;height:${P.floorY-P.bbY}px;`;
const ceilEl=document.getElementById('ceiling');
ceilEl.style.cssText+=`height:${P.ceilH}px;`;
const LAMPS=[];
{
  const band=document.createElement('div');
  band.className='cl';
  band.style.cssText+=`left:0;top:0;width:100%;height:${Math.round(P.ceilH*0.42)}px;`;
  ceilEl.appendChild(band);
  const nl=ORIENT==='portrait'?3:5;
  for(let i=0;i<nl;i++){
    const lx=lerp(W*0.14,W*0.86,i/(nl-1));
    const lp=document.createElement('div');
    lp.className='lamp';
    const lw=Math.round(P.ceilH*1.6);
    lp.style.cssText+=`left:${lx-lw/2}px;top:${Math.round(P.ceilH*0.2)}px;width:${lw}px;height:${lw}px;`;
    ceilEl.appendChild(lp);
    LAMPS.push(lp);
  }
}
/* siluet kota: balok bangunan + jendela kecil yang menyala saat malam */
const fdEl=document.getElementById('frostday');
fdEl.style.cssText+=`height:${P.floorY}px;`;
const fnEl=document.getElementById('frostnight');
fnEl.style.cssText+=`height:${P.floorY}px;`;
const skyEl=document.getElementById('skyline');
const CITYWIN=[];
{
  const base=ORIENT==='portrait'?P.floorY:P.floorY;
  const bh0=ORIENT==='portrait'?150:110;
  let x=-20;
  let k=0;
  while(x<W+40){
    const bw=90+rnd()*130;
    const bh=bh0+rnd()*bh0*1.4;
    const b=document.createElement('div');
    b.style.cssText+=`position:absolute;left:${x}px;top:${base-bh}px;width:${bw}px;height:${bh}px;background:#7C93AE;opacity:.38;`;
    skyEl.appendChild(b);
    const nw=Math.floor(bw/26), nr=Math.floor(bh/34);
    for(let r=0;r<nr;r++)for(let c=0;c<nw;c++){
      if(rnd()<0.42){
        const wn=document.createElement('div');
        wn.style.cssText+=`position:absolute;left:${x+10+c*26}px;top:${base-bh+12+r*34}px;width:9px;height:13px;background:#FFD98A;opacity:0;border-radius:2px;`;
        skyEl.appendChild(wn);
        CITYWIN.push({el:wn,ph:rnd()*6.28});
      }
    }
    x+=bw+14+rnd()*40;
    k++;
  }
}
/* salju di balik kaca */
const snowEl=document.getElementById('snow');
const SNOW=[];
for(let i=0;i<P.snowN;i++){
  const f=document.createElement('div');
  f.className='snowp';
  const sz=(rnd()*9+4).toFixed(1);
  f.style.cssText+=`width:${sz}px;height:${sz}px;opacity:${(rnd()*0.35+0.3).toFixed(2)};`;
  snowEl.appendChild(f);
  SNOW.push({el:f,x:lerp(P.snowZone[0],P.snowZone[2],rnd()),y0:lerp(P.snowZone[1],P.snowZone[3],rnd()),
    sp:rnd()*26+16,ph:rnd()*6.28,amp:rnd()*22+8});
}

/* ---------- garis bilangan besar di kener dinding ---------- */
const railEl=document.getElementById('rail');
const TICKS=[];
{
  const ln=document.createElement('div');
  ln.className='rline';
  ln.style.cssText+=`left:${P.railC-P.railHalf-20}px;top:${P.railY}px;width:${P.railHalf*2+40}px;`;
  railEl.appendChild(ln);
  for(let v=-5;v<=5;v++){
    const tx=P.railC+v*P.railSp;
    const tk=document.createElement('div');
    tk.className='rtick';
    tk.style.cssText+=`left:${tx-2}px;top:${P.railY-P.tickH}px;height:${P.tickH+5}px;`;
    railEl.appendChild(tk);
    const nm=document.createElement('div');
    nm.className='rnum';
    nm.style.cssText+=`left:${tx-(v<0?26:14)}px;top:${P.railY+8}px;font-size:${P.tickFS}px;`;
    nm.textContent=String(v);
    railEl.appendChild(nm);
    TICKS.push({tk,nm,v});
  }
  const zt=document.createElement('div');
  zt.className='rtick';
  zt.style.cssText+=`left:${P.railC-3}px;top:${P.railY-P.tickH-6}px;height:${P.tickH+11}px;background:#E9B15B;`;
  railEl.appendChild(zt);
}

/* ---------- shaft lift: kaca, panduan, plak lantai +3 sampai -3 ---------- */
const shaftEl=document.getElementById('shaft');
const PLATES=[];
{
  const sh=document.createElement('div');
  sh.className='glass';
  sh.style.cssText+=`left:${P.shaftX}px;top:${P.shaftTop}px;width:${P.shaftW}px;height:${P.shaftBot-P.shaftTop}px;`;
  shaftEl.appendChild(sh);
  const g1=document.createElement('div');
  g1.className='guide';
  g1.style.cssText+=`left:${P.shaftX+22}px;top:${P.shaftTop+10}px;height:${P.shaftBot-P.shaftTop-20}px;`;
  shaftEl.appendChild(g1);
  const g2=document.createElement('div');
  g2.className='guide';
  g2.style.cssText+=`left:${P.shaftX+P.shaftW-29}px;top:${P.shaftTop+10}px;height:${P.shaftBot-P.shaftTop-20}px;`;
  shaftEl.appendChild(g2);
  for(let f=3;f>=-3;f--){
    const py=P.floor0-f*P.floorSp;
    const pl=document.createElement('div');
    pl.className='plate';
    pl.style.cssText+=`left:${P.shaftX+10}px;top:${py-P.plateH/2}px;width:${P.plateW}px;height:${P.plateH}px;font-size:${P.plateFS}px;`;
    pl.textContent=f>0?('+'+f):String(f);
    shaftEl.appendChild(pl);
    const beam=document.createElement('div');
    beam.className='beam';
    beam.style.cssText+=`left:${P.shaftX+P.plateW+18}px;top:${py+P.plateH/2-2}px;width:${P.shaftW-P.plateW-36}px;height:4px;`;
    shaftEl.appendChild(beam);

let subIdx=-1;
function renderSub(t){
  let i=0;
  for(let k=0;k<SUBS.length;k++){ if(t>=SUBS[k][0]-0.001) i=k; }
  const nxt=i+1<SUBS.length?SUBS[i+1][0]:52.4;
  const o=clamp(Math.min(seg(t,SUBS[i][0],0.25), 1-seg(t,nxt-0.14,0.14)),0,1);
  if(i!==subIdx){
    subIdx=i;
    subId.textContent=SUBS[i][1];
    subId.style.color=SUBS[i][3];
    subEn.textContent=SUBS[i][2];
  }
  subbar.style.opacity=(o*0.98).toFixed(3);
  const pop=1+0.018*Math.sin(clamp(seg(t,SUBS[i][0],0.45),0,1)*Math.PI);
  subbar.style.transform=`translateX(-50%) scale(${pop.toFixed(3)})`;
}

  /* malam bersalju: langit gelap, jendela kota menyala, lampu plafond hangat */
  const nk=seg(t,36.0,8.0);
  /* konten latihan keluar layar di 49.8 (aturan 28): shaft, termometer, acuan, mobil */
  const exo=1-seg(t,49.8,0.5);
  skyN.style.opacity=nk.toFixed(3);
  frostN.style.opacity=nk.toFixed(3);
  for(const w of CITYWIN){ w.el.style.opacity=(nk*(0.55+0.35*Math.sin(t*1.3+w.ph))).toFixed(3); }
  for(const l of LAMPS){ l.style.opacity=(0.25+nk*0.75).toFixed(3); }
  /* salju jatuh di balik kaca */
  for(const s of SNOW){
    const yy=P.snowZone[1]+((s.y0-P.snowZone[1]+t*s.sp)% (P.snowZone[3]-P.snowZone[1]));
    const xx=s.x+Math.sin(t*0.9+s.ph)*s.amp;
    s.el.style.transform=`translate(${xx.toFixed(1)}px,${yy.toFixed(1)}px)`;
    s.el.style.opacity=(0.35+0.3*Math.sin(t+s.ph)).toFixed(3);
  }
  /* chip hook: tujuh bilangan contoh */
  for(const c of CHIPS){
    const o=clamp(seg(t,c.t0,0.3)*(1-seg(t,6.4,0.35)),0,1);
    c.el.style.opacity=o.toFixed(3);
    const bob=Math.sin(t*1.6+c.ph)*5*(1-seg(t,6.4,0.35));
    const sc=1+0.07*Math.sin(clamp(seg(t,c.t0,0.6),0,1)*Math.PI)*(1-seg(t,6.4,0.35));
    c.el.style.transform=`translateY(${bob.toFixed(1)}px) scale(${sc.toFixed(3)})`;
  }
  popA(stamp,t,3.0,0.55,7,0,6.4);
  /* panel 1: tiga kelompok */
  popA(panel1,t,7.0,0.6,5,0,17.0);
  for(const r of P1ROWS){ r.el.style.opacity=seg(t,r.t0,0.45).toFixed(3); }
  p1Note.textContent = t>=14.5 ? 'NOL BUKAN POSITIF, BUKAN NEGATIF' : 'NEGATIF KE KIRI, POSITIF KE KANAN';
  popA(p1Note,t,10.8,0.5,5,0,17.0);
  /* termometer: suhu 4 turun 9 menjadi minus 5 */
  popA(thermoEl,t,18.2,0.6,5,0,32.7);
  const tv=4-9*eio(seg(t,20.4,1.4));
  const my=tParts.yOf(tv);
  const mbY=tParts.tubeBot;
  tParts.merc.style.top=(my).toFixed(1)+'px';
  tParts.merc.style.height=Math.max(0,mbY-my).toFixed(1)+'px';
  tParts.frost.style.opacity=(tv<-0.2?smz(t,21.8,1.0,0.5)*(0.65+0.2*Math.sin(t*2.6)):0).toFixed(3);
  popA(eqchip,t,21.9,0.5,6,0,24.6);
  /* plak lantai menyala bergantian (+3, 0, -1, -2) saat narasi gedung */
  const GLOW_T={3:24.2,0:24.6,'-1':25.0,'-2':25.4,'-3':47.4};
  for(const pl of PLATES){
    const gt=GLOW_T[String(pl.f)];
    let g=0;
    if(gt>0){ const d=t-gt; if(d>=0&&d<1.4){ g=Math.max(0,Math.sin(Math.min(d/1.4,1)*Math.PI)); } }
    pl.el.style.boxShadow=g>0.02?`0 0 ${Math.round(16*g+6)}px rgba(242,178,74,${(0.75*g).toFixed(2)})`:'none';
    pl.el.style.borderColor=g>0.02?`rgba(242,178,74,${(0.5+0.5*g).toFixed(2)})`:'#44648C';
    pl.el.style.color=g>0.02?'#FFE9A8':'#BFD2E6';
  }
  /* mobil lift: demo 1 ke -1 (25.6), kembali 0 (29.5), uji: ke 2 (44.4) lalu turun ke -3 (45.9) */
  let cf=0;
  if(t>=25.6&&t<26.8) cf=lerp(0,-1,eio(seg(t,25.6,1.2)));
  else if(t>=26.8&&t<29.5) cf=-1;
  else if(t>=29.5&&t<30.3) cf=lerp(-1,0,eio(seg(t,29.5,0.8)));
  else if(t>=44.8&&t<45.3) cf=lerp(0,2,eio(seg(t,44.8,0.5)));
  else if(t>=45.3&&t<45.9) cf=2;
  else if(t>=45.9&&t<47.4) cf=lerp(2,-3,eio(seg(t,45.9,1.5)));
  else if(t>=47.4) cf=-3;
  const carY=carF2Y(cf);
  carEl.style.left=P.carX+'px';
  carEl.style.top=carY.toFixed(1)+'px';
  carEl.style.opacity=exo.toFixed(3);
  /* uji lift: mentor naik ke mobil 45.0-45.5, lalu ikut turun sampai penutup */
  popA(qchip,t,44.5,0.5,6,0,49.8);
  popA(qm,t,47.5,0.5,8,0,49.8);
  popA(pil,t,47.7,0.6,6,0,49.8);
  /* garis bilangan menyala dari kiri ke kanan */
  for(const tk of TICKS){
    const lo=seg(t,33.0+(tk.v+5)*0.08,0.3);
    const bright=(0.35+0.65*lo)*exo;
    tk.tk.style.opacity=bright.toFixed(3);
    tk.nm.style.opacity=bright.toFixed(3);
  }
  /* chip perbandingan: -5 diam, -2 meluncur ke kanan */
  const cy5=P.railY-Math.round(74*cmpS)-22;
  const x5=P.railC+(-5)*P.railSp, x2=P.railC+(-2)*P.railSp, x2b=P.railC+1*P.railSp;
  popA(cmp5,t,33.6,0.5,7,0,40.5);
  cmp5.style.left=(x5-Math.round(55*cmpS))+'px';
  cmp5.style.top=cy5+'px';
  const slide=eio(seg(t,34.6,1.0));
  const co=clamp(seg(t,33.9,0.3)*(1-seg(t,40.5,0.35)),0,1);
  cmp2.style.opacity=co.toFixed(3);
  cmp2.style.left=(lerp(x2,x2b,slide)-Math.round(55*cmpS))+'px';
  cmp2.style.top=cy5+'px';
  cmp2.style.transform=`scale(${(1+0.07*Math.sin(clamp(seg(t,33.9,0.6),0,1)*Math.PI)).toFixed(3)})`;
  trail.style.opacity=(slide>0&&slide<1?0.8:0).toFixed(3);
  trail.style.left=(x2-Math.round(55*cmpS)).toFixed(0)+'px';
  trail.style.top=(cy5+Math.round(20*cmpS))+'px';
  trail.style.width=Math.max(0,((x2b-x2)*slide)).toFixed(0)+'px';
  trail.style.height=Math.round(8*cmpS)+'px';
  popA(chainP,t,38.0,0.55,5,0,40.6);
  /* panel 4: anggota bulat vs bukan */
  popA(panel4,t,40.9,0.55,5,0,44.0);
  for(const r of P4ROWS){ r.el.style.opacity=seg(t,r.t0,0.4).toFixed(3); }
  popA(p4Note,t,42.6,0.45,5,0,44.0);
  /* shaft, garis acuan dan termometer ikut menutup scene latihan */
  shaftEl.style.opacity=exo.toFixed(3);
  acuanEl.style.opacity=exo.toFixed(3);
  /* mentor: menggelinding antar stasiun, naik lift saat uji */
  let bx=WAY[WAY.length-1][1];
  for(let k=0;k<WAY.length-1;k++){
    const [w0,x0]=WAY[k],[w1,x1]=WAY[k+1];
    if(t>=w0&&t<w1){ bx=lerp(x0,x1,eio(seg(t,w0,w1-w0))); break; }
  }
  if(t>=WAY[WAY.length-1][0])bx=WAY[WAY.length-1][1];
  if(_mxPrev===null)_mxPrev=bx;
  _roll+=(bx-_mxPrev)/(P.ballD/2)*(180/Math.PI);
  _mxPrev=bx;
  const ep=seg(t,0.6,0.55);
  let hy2=0, lrot=0, drot=0, txj=0, mys=1;
  for(const [gs,gd,gt,ga] of GESTS){
    const d2=t-gs;
    if(d2>=0&&d2<gd){
      const p=d2/gd, w=Math.sin(p*Math.PI);
      if(gt==='tilt'||gt==='lean'){ lrot+=ga*w; }
      else if(gt==='nod'){ lrot+=ga*Math.sin(p*2*Math.PI); }
      else if(gt==='shiver'){ txj=ga*Math.sin(p*40)*(1-p); }
      else if(gt==='spin'){ drot+=ga*eio(p); }
      else if(gt==='count'){ hy2-=ga*Math.abs(Math.sin(p*5*Math.PI))*(1-p*0.2); }
    }
  }
  const mFade=1-seg(t,44.3,0.35);
  let mx=bx, myv=P.groundY-P.ballD, onAir=0;
  const bsa=1;
  mentor.el.style.left=mx.toFixed(1)+'px';
  mentor.el.style.opacity=String(clamp(ep*3,0,1)*exo*mFade);
  mentor.el.style.top=(myv+hy2).toFixed(1)+'px';
  mentor.el.style.transform=`translateX(${txj.toFixed(1)}px) rotate(${(_roll+lrot+drot).toFixed(2)}deg) scale(${bsa.toFixed(3)})`;
  msh.style.left=mx.toFixed(1)+'px';
  msh.style.top=(P.groundY-10)+'px';
  msh.style.opacity=String(clamp(ep*3,0,1)*exo*mFade*clamp(0.42+hy2*0.006,0.18,0.5)*bsa);
  msh.style.transform=`scaleX(${clamp((1+hy2*0.004)*bsa,0.4,1.08).toFixed(3)})`;
  /* mentor di dalam lift: bola mini mengikuti mobil */
  const cmTop=carF2Y(cf)+P.carH*0.48-carM.d/2;
  carM.el.style.left=(P.carX+P.carW/2).toFixed(1)+'px';
  carM.el.style.top=cmTop.toFixed(1)+'px';
  carM.el.style.opacity=String(seg(t,44.45,0.35)*exo);
  carM.el.style.transform=`rotate(${(_roll*0.25).toFixed(2)}deg)`;
  /* percikan bintang */
  let spo=0;
  for(const [sa,sb] of SPARKS){
    if(t>=sa&&t<sb) spo=smz(t,sa,sb,0.35)*(0.65+0.2*Math.sin(t*7));
  }
  spark.style.opacity=String(clamp(spo,0,1));
  const spx=t>=44.45?P.carX+P.carW/2+62:mx+62;
  const spy=t>=44.45?cmTop:(P.groundY-150)+Math.sin(t*2)*4;
  spark.style.left=spx.toFixed(1)+'px';
  spark.style.top=spy.toFixed(1)+'px';
  spark.style.transform=`rotate(${((t*28)%360).toFixed(0)}deg) scale(${(0.8+0.15*Math.sin(t*7)).toFixed(3)})`;
  /* judul bab (judul terakhir ikut keluar saat penutup agar endcard sendirian) */
  for(let i=0;i<TITLES.length;i++){
    const o=TITLES[i];
    const tEnd=i+1<TITLES.length?TITLES[i+1].t0:50.2;
    const oin=seg(t,o.t0,0.35)*(1-seg(t,tEnd-0.25,0.3));
    const sc=1+0.035*Math.sin(clamp(seg(t,o.t0,0.7),0,1)*Math.PI);
    o.el.style.opacity=oin.toFixed(3);
    o.el.style.transform=`scale(${sc.toFixed(3)})`;
  }
  /* endcard penutup bersih: AKIOMIDA.COM muncul SENDIRIAN di layar yang tenang */
  const eci=eio(seg(t,50.2,0.7));
  endcard.style.opacity=eci.toFixed(3);
  endcard.style.transform=`translateY(${((1-eci)*16).toFixed(1)}px) scale(${(0.94+0.06*eci).toFixed(3)})`;
  fBar.style.width=(seg(t,50.9,0.5)*P.barW).toFixed(0)+'px';
  renderSub(t);
  /* kamera tenang */
  const im=imp(t);
  const shx=Math.sin(t*47)*2.5*im, shy=Math.sin(t*39+1.7)*1.8*im;
  world.style.transform=`translate(${shx.toFixed(2)}px,${(shy+Math.sin(t*0.35)*3).toFixed(2)}px)`;
  flash.style.opacity=(im*0.07).toFixed(3);
  fade.style.opacity=String(clamp(1-seg(t,0.05,0.5),0,1)*0.96+clamp(seg(t,51.4,0.6),0,1));
}
renderFrame(0);
window.__ready=true;
</script>
</body>
</html>
