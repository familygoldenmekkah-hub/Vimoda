<style>
/* RUANG SAPA rev5 - FORMAT RP GROUP CHAT (riset pola viral chat story:
   bubble pop satu per satu, typing indicator, POV penonton sebagai
   karakter, media campuran, emoji burst, mid-cliffhanger) dipadukan
   momen DIAGRAM MENYALA ala anime sains favorit penonton (Dr Stone:
   penjelasan sains meledak jadi diagram dramatis). Dunia: layar ponsel
   grup chat fiksi SAPA di atas latar doodle angka-permen. Konten 100%
   positif (misteri kebaikan Pembagi Rapi, tanpa kejahatan). Semua teks
   minimal 22px (penonton menonton di layar kecil). Tanpa label episode.
   Label peran menggantikan nama tokoh (KAMU, MENTOR, PEMILIK KIOS, ???).
   Karakter avatar bulat tanpa wajah. Subtitle Inggris di pil bawah.
   Watermark AKIOMIDA selalu terlihat. Dramaturgi anime kishotenketsu:
   ma = typing indicator saat chat hening, twist = diagram flash +
   speedlines, jurus bernama = stiker stempel, uji = overlay papan
   misi. Penutup bersih dua fase (aturan 28). */

<script>
/* ---------- RUANG SAPA rev6: data & elemen format RP group chat ----------
   Revisi 6 atas laporan pemilik: (1) teks dialog DIBESARKAN ke 30px,
   (2) gaya RP dibikin beneran terasa: aksi RP dalam bintang (budaya RP
   TikTok/Character.ai), status Dibaca di chat KAMU, bubble ??? glow emas,
   (3) bahasa obrolan harian yang natural - bukan kalimat iklan AI:
   pesan pendek, CAPS kaget, emoji reaksi, nyela, dobel-chat, nyebut
   aktivitas harian kios, (4) ilustrasi dunia digambar serius (SVG):
   etalase malam, buku tamu, kejutan pagi - bukan kemasan generik. ---------- */
const Q = new URLSearchParams(location.search);
const ORIENT = Q.get('o') === 'landscape' ? 'landscape' : 'portrait';
const W = ORIENT === 'portrait' ? 1080 : 1920;
const H = ORIENT === 'portrait' ? 1920 : 1080;

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)|0;return((t^t>>>14)>>>0)/4294967296}}
const rnd = mulberry32(150926);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const seg=(t,t0,d)=>clamp((t-t0)/d,0,1);
const lerp=(a,b,p)=>a+(b-a)*p;
const eio=p=>p<0.5?2*p*p:1-Math.pow(-2*p+2,2)/2;
const eout=p=>1-Math.pow(1-p,3);
const smz=(t,a,b,s)=>{const o=seg(t,a,s)*(1-seg(t,b,s));return o};

const P = ORIENT==='portrait' ? {
  phoneX:24, phoneY:40, phoneW:1032, phoneH:1060,
  chatTop:210, chatBot:1046, bubW:680, bubS:30, nameS:24, photoW:620,
  headT:32, headS:32, headSubS:24, timeS:24,
  subTop:1170, subMax:880, wmY:1800,
  ecW:760, ecH:130, ecY:700, barW:420, ecFS:56,
  avS:62, avEmoji:28, stickW:640
} : {
  phoneX:460, phoneY:30, phoneW:1000, phoneH:660,
  chatTop:196, chatBot:642, bubW:600, bubS:30, nameS:24, photoW:600,
  headT:28, headS:28, headSubS:24, timeS:24,
  subTop:740, subMax:1300, wmY:1010,
  ecW:700, ecH:110, ecY:360, barW:460, ecFS:44,
  avS:54, avEmoji:26, stickW:620
};

/* posisi phone + latar doodle */
const phoneEl=document.getElementById('phone');
phoneEl.style.cssText+=`left:${P.phoneX}px;top:${P.phoneY}px;width:${P.phoneW}px;height:${P.phoneH}px;`;
document.getElementById('pchat').style.cssText+=`top:${P.chatTop}px;height:${P.chatBot-P.chatTop}px;`;
{
  const ht=document.getElementById('htitle');
  ht.style.fontSize=P.headS+'px';
  const hs=document.getElementById('hsub');
  hs.style.fontSize=P.headSubS+'px';
  const pt=document.getElementById('ptime');
  pt.style.fontSize=P.timeS+'px';
}
/* doodle latar: angka dan permen melayang (bahasa visual materi) */
const DOODLES=[];
{
  const b=document.getElementById('bgdoodle');
  const chars=['1','2','3','4','6','12','8','24'];
  for(let i=0;i<chars.length;i++){
    const d=document.createElement('div');
    d.className='doodle';
    d.textContent=chars[i];
    const fs=54+Math.round(rnd()*70);
    d.style.cssText+=`left:${Math.round(rnd()*(W-140)+40)}px;top:${Math.round(rnd()*(H-260)+80)}px;font-size:${fs}px;opacity:0;`;
    b.appendChild(d);
    DOODLES.push({el:d,ph:i*1.13,fs});
  }
  for(let i=0;i<12;i++){
    const d=document.createElement('div');
    d.className='dperm';
    const cd=16+Math.round(rnd()*26);
    const cols=['#F26D6D','#F7C948','#8E7CD8','#4CAF7A'];
    const col=cols[i%4];
    d.style.cssText+=`left:${Math.round(rnd()*(W-80)+40)}px;top:${Math.round(rnd()*(H-220)+60)}px;width:${cd}px;height:${cd}px;background:${col};opacity:0;`;
    b.appendChild(d);
    DOODLES.push({el:d,ph:i*0.71,fs:cd,perm:true});
  }
}

/* ---------- cast RP (label peran, tanpa nama pribadi; avatar bulat emoji tanpa wajah) ---------- */
const CAST={
  KIOS:{name:'PEMILIK KIOS',glyph:'🍬',bg:'radial-gradient(circle,#F26D6D 58%,#D93A5A)',col:'#FFB3B3'},
  MENTOR:{name:'MENTOR',glyph:'🟡',bg:'radial-gradient(circle,#F7C948 62%,#E8B32E)',col:'#F2C14E'},
  KAMU:{name:'KAMU',glyph:'🔍',bg:'radial-gradient(circle,#C9556B 55%,#A6394B)',col:'#D9C6FF'},
  MYST:{name:'???',glyph:'🌙',bg:'radial-gradient(circle,#FFE9A8 40%,rgba(255,233,168,.12) 72%)',col:'#FFE9A8'}
};

/* ---------- ilustrasi dunia rev6 (SVG foto chat, digambar serius) ----------
   Tiga foto "asli dari dunia RUANG SAPA": etalase malam saat misteri
   (awning toko, lampu gantung, 3 stoples 4-4-4, satu permen di piring
   menyala, papan TUTUP), buku tamu dengan pola kunjungan 4-8-12-16-20
   (12 diclingkung merah), dan kejutan 24 saat pagi (bunting, 3 stoples
   8-8-8, tag BUAT KAMU). Semua deterministik, tanpa gambar acak. ---------- */
const PALS=['#F26D6D','#F7C948','#8E7CD8','#4CAF7A'];
function dot(cx,cy,r,col){return '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="'+col+'"/>'}
function jarSVG(cx,y,h,rows,r){
  let s='<rect x="'+(cx-52)+'" y="'+y+'" width="104" height="'+h+'" rx="10" fill="rgba(185,166,255,.16)" stroke="#E8B32E" stroke-width="3"/>'
       +'<rect x="'+(cx-56)+'" y="'+(y-12)+'" width="112" height="16" rx="8" fill="#C89A3C"/>';
  rows.forEach((row,ri)=>{row.forEach((col,ci)=>{s+=dot(cx-39+ci*26,y+20+ri*30,r,col)})});
  return s;
}
function svgEtalase(){
  let s='<svg class="psvg" viewBox="0 0 600 340" xmlns="http://www.w3.org/2000/svg">'
   +'<defs><linearGradient id="skyE" x1="0" y1="0" x2="0" y2="1">'
   +'<stop offset="0" stop-color="#2A1E44"/><stop offset="1" stop-color="#181132"/></linearGradient>'
   +'<radialGradient id="glowE" cx="0.5" cy="0.5" r="0.5">'
   +'<stop offset="0" stop-color="rgba(247,201,72,.42)"/><stop offset="1" stop-color="rgba(247,201,72,0)"/></radialGradient></defs>'
   +'<rect width="600" height="340" fill="url(#skyE)"/>';
  [[80,44,2],[150,72,1.6],[250,30,2.2],[350,58,1.6],[430,36,2],[480,96,1.6]].forEach(p=>{s+=dot(p[0],p[1],p[2],'rgba(255,246,232,.55)')});
  s+='<circle cx="532" cy="56" r="26" fill="#F7C948"/><circle cx="543" cy="47" r="22" fill="#2A1E44"/>';

/* aksi RP dalam bintang = italic redup (budaya RP TikTok/Character.ai) */
function richText(t){
  const parts=t.split('*');
  const out=[];
  for(let i=0;i<parts.length;i++){
    if(!parts[i]) continue;
    out.push(i%2===1?'<span class="act">'+parts[i]+'</span>':'<span class="say">'+parts[i]+'</span>');
  }
  return out.join('&nbsp;');
}

  el.textContent=v;
  qgridEl.appendChild(el);
  return {el,v,pop:67.4+i*0.12};
});
const qnoteEl=document.getElementById('qnote');
qnoteEl.style.cssText+=`top:${ORIENT==='portrait'?452:350}px;font-size:24px;`;
qnoteEl.textContent='KARTU BANTU MISI NOMOR SATU';

/* ---------- subtitle EN (aturan 8 + 18: proporsional, min 1.7 s) ---------- */
const SUBS=[
  [1.2,'Look at my display this morning!'],

const subbar=document.getElementById('subbar');
const subEn=document.getElementById('sub_en');

/* watermark + endcard */
const markEl=document.getElementById('mark');
markEl.style.cssText+=`top:${P.wmY}px;font-size:24px;`;

const fBar=document.getElementById('f_bar');
fplate.style.cssText+=`left:${P.phoneX+(P.phoneW-P.ecW)/2}px;top:${P.ecY}px;width:${P.ecW}px;height:${P.ecH}px;font-size:${P.ecFS}px;`;

/* ---------- RUANG SAPA rev5: render per frame ----------
   Semua gerak fungsi waktu (deterministik, aturan 20). Bahasa motion:
   bubble pop dengan overshoot kecil (aturan 19), typing indicator
   sebelum tiap pesan, scroll chat halus, diagram flash punch-in ala
   anime sains, emoji burst, overlay misi slide-up, endcard tenang. ---------- */
const SUBS2=SUBS;
let subIdx=-1;
let scrollCur=0;
function renderSub(t){
  let i=0;
  for(let k=0;k<SUBS2.length;k++){ if(t>=SUBS2[k][0]-0.001) i=k; }
  const nxt=i+1<SUBS2.length?SUBS2[i+1][0]:84.0;
  const o=clamp(Math.min(seg(t,SUBS2[i][0],0.28), 1-seg(t,nxt-0.18,0.18)),0,1);
  if(i!==subIdx){
    subIdx=i;
    subEn.textContent=SUBS2[i][1];
  }
  subbar.style.opacity=(o*0.97).toFixed(3);
  const pop=1+0.014*Math.sin(clamp(seg(t,SUBS2[i][0],0.5),0,1)*Math.PI);
  subbar.style.transform=`translateX(-50%) scale(${pop.toFixed(3)})`;
}
const IMPS=[[0.4,1.0],[12.9,13.7],[19.8,20.6],[34.6,35.4],[54.4,55.2],[64.6,65.4]];
function imp(t){
  let a=0;
  for(const [s,e] of IMPS){
    const d=t-s;
    if(d>=0&&d<(e-s)*0.5){ const p=d/((e-s)*0.5); a=Math.max(a,(1-p)*0.8); }
  }
  return a;
}
/* typing indicator: siapa yang sedang mengetik */
function typingInfo(t){
  if(t>=33.5&&t<34.5) return {who:'MENTOR',txt:'menyusun jurus'};
  for(const m of MSGS){
    if(t<m.t0&&t>=m.t0-0.45) return {who:m.who,txt:'mengetik'};
    if(t>=m.t0) continue;
  }
  return null;
}
function renderFrame(t){
  /* latar doodle melayang pelan */
  for(const d of DOODLES){
    const fx=parseFloat(d.el.style.left);
    const fy=parseFloat(d.el.style.top);
    d.el.style.opacity=(0.5+0.3*Math.sin(t*0.4+d.ph)).toFixed(3);
    d.el.style.transform=`translate(${(Math.sin(t*0.22+d.ph)*18).toFixed(1)}px,${(Math.cos(t*0.18+d.ph)*14).toFixed(1)}px)`;
  }
  /* napas phone + kamera hanyut + punch momen */
  const im=imp(t);
  const px=Math.sin(t*0.21)*5+Math.sin(t*47)*2.2*im;
  const py=Math.cos(t*0.15)*4+Math.sin(t*39+1.7)*1.6*im;
  let push=0;
  for(const [s,e] of IMPS){ push+=0.028*smz(t,s,e,0.35); }
  phoneEl.style.transform=`translate(${px.toFixed(2)}px,${py.toFixed(2)}px) scale(${(1+push).toFixed(4)})`;
  /* divider bab pop + ikut memudar saat penutup bersih (aturan 28) */
  const chFade2=1-seg(t,75.2,0.35);
  for(const d of DIVEL){
    const o=clamp(seg(t,d.t0,0.4),0,1)*chFade2;
    d.sp.style.opacity=o.toFixed(3);
    d.sp.style.transform=`translateY(${(12*(1-eio(seg(t,d.t0,0.4)))).toFixed(1)}px)`;
  }
  /* bubble pop + scroll target */
  let lastBot=0;
  for(const x of MSGE){
    const on=t>=x.m.t0;
    if(on){
      const p=clamp(seg(t,x.m.t0,0.42),0,1);
      const popS=1+0.05*Math.sin(p*Math.PI);
      x.el.style.opacity=p.toFixed(3);
      x.el.style.transform=`translateY(${(14*(1-eio(p))).toFixed(1)}px) scale(${popS.toFixed(3)})`;
      lastBot=Math.max(lastBot,x.top+x.h);
    }
  }
  for(const d of DIVEL){
    if(t>=d.t0) lastBot=Math.max(lastBot,d.top+d.h);
  }
  const areaH=P.chatBot-P.chatTop;
  const target=Math.max(0,lastBot-areaH+30);
  if(Math.abs(target-scrollCur)>600)scrollCur=target;
  scrollCur+=(target-scrollCur)*0.22;
  chatEl.style.transform=`translateY(${(-scrollCur).toFixed(1)}px)`;
  /* typing indicator */
  const ti=typingInfo(t);
  if(ti){
    const c=CAST[ti.who];
    typingAv.style.cssText+=`background:${c.bg};`;
    typingAv.textContent=c.glyph;
    typingTx.textContent=ti.txt;
    typingEl.style.opacity='0.95';
    typingEl.style.transform=`translateY(${(Math.sin(t*2.2)*2).toFixed(1)}px)`;
  }else{
    typingEl.style.opacity='0';
  }
  /* DIAGRAM MENYALA (tiga momen ala anime sains) */
  let fOn=null;
  for(const f of FLASHES){ if(t>=f.t0&&t<f.t1) fOn=f; }
  if(fOn){
    const fin=seg(t,fOn.t0,0.28), fout=1-seg(t,fOn.t1-0.32,0.32);
    const o=clamp(Math.min(fin,fout),0,1);
    dimEl.style.opacity=(o*0.78).toFixed(3);
    flashEl.style.opacity=o.toFixed(3);
    const sc=0.94+0.08*eout(fin)-0.03*seg(t,fOn.t1-0.32,0.32);
    flashEl.style.transform=`scale(${sc.toFixed(4)})`;
    fKick.textContent=fOn.kick;
    fTitle.textContent=fOn.title;
    fEn.textContent=fOn.en;
    fKick.style.opacity=o.toFixed(3);
    fTitle.style.opacity=o.toFixed(3);
    fTitle.style.transform=`translateY(${(16*(1-eio(fin))).toFixed(1)}px) scale(${(1+0.03*Math.sin(clamp(fin,0,1)*Math.PI)).toFixed(3)})`;
    fEn.style.opacity=(o*0.9).toFixed(3);
    fGlow.style.opacity=(o*0.85).toFixed(3);
    fGlow.style.transform=`translate(${(Math.sin(t*0.9)*60).toFixed(1)}px,${(Math.cos(t*0.7)*40).toFixed(1)}px)`;
    const idx=FLASHES.indexOf(fOn);
    const body=FLASHBODY[idx];
    body.w.style.display='flex';
    for(let j=0;j<FLASHBODY.length;j++){ if(j!==idx) FLASHBODY[j].w.style.display='none'; }
    for(const ch of body.chips){
      const ct=fOn.t0+0.14+ch.i*0.09;
      const co=clamp(seg(t,ct,0.3),0,1);
      ch.el.style.opacity=co.toFixed(3);
      ch.el.style.transform=`translateY(${(18*(1-eio(co))).toFixed(1)}px) scale(${(1+0.1*Math.sin(clamp(seg(t,ct,0.45),0,1)*Math.PI)).toFixed(3)})`;
    }
    for(const ln of body.lines){
      ln.el.style.opacity=clamp(seg(t,fOn.t0+0.75,0.4),0,1).toFixed(3);
    }
    if(fOn.twoEl){ fOn.twoEl.style.opacity=clamp(seg(t,fOn.t0+1.15,0.4),0,1).toFixed(3); }
    for(let ni=0;ni<body.notes.length;ni++){
      body.notes[ni].el.style.opacity=clamp(seg(t,fOn.t0+1.5+ni*0.35,0.4),0,1).toFixed(3);
    }
    flashwhite.style.opacity=clamp(smz(t,fOn.t0,fOn.t0+0.16,0.05)*0.16,0,1).toFixed(3);
  }else{
    dimEl.style.opacity='0';
    flashEl.style.opacity='0';
    flashwhite.style.opacity='0';
    for(const b of FLASHBODY) b.w.style.display='none';
  }
  /* emoji burst */
  for(const pt of BPARTS){
    const b=BURSTS[pt.bi];
    if(t>=b.t0&&t<b.t1){
      const p=seg(t,b.t0,b.t1-b.t0);
      const rise=Math.sin(p*Math.PI);
      const ox=Math.cos(pt.a)*b.rad*(0.4+0.6*p)*pt.d;
      const oy=Math.sin(pt.a)*b.rad*0.62*(0.4+0.6*p)*pt.d-p*40;
      const cx=ORIENT==='portrait'?P.phoneX+P.phoneW/2:P.phoneX+P.phoneW/2;
      const cy=ORIENT==='portrait'?P.phoneY+P.phoneH/2:P.phoneY+P.phoneH/2;
      pt.el.style.opacity=(rise*0.95).toFixed(3);
      pt.el.style.transform=`translate(${(cx+ox-30).toFixed(0)}px,${(cy+oy-30).toFixed(0)}px) scale(${(0.7+0.6*rise).toFixed(3)}) rotate(${(p*90*(pt.d>1?1:-1)).toFixed(0)}deg)`;
    }else{
      pt.el.style.opacity='0';
    }
  }
  /* overlay MISI BARU (aturan 30) */
  {
    const qin=eio(seg(t,64.6,0.6));
    const qout=1-seg(t,71.6,0.5);
    const qo=clamp(Math.min(qin,qout),0,1);
    quizEl.style.opacity=qo.toFixed(3);
    quizEl.style.transform=`translateY(${((1-qin)*46-(1-qout)*40).toFixed(1)}px) scale(${(0.96+0.04*qin).toFixed(3)})`;
    for(const r of UJIS){ r.el.style.opacity=seg(t,r.t0,0.35).toFixed(3); }
    for(let i=0;i<CARDS.length;i++){
      const cc=CARDS[i];
      const inA=clamp(seg(t,cc.pop,0.35),0,1);
      const dir=i%2===0?-1:1;
      const s2=1+0.09*Math.sin(clamp(seg(t,cc.pop,0.4),0,1)*Math.PI);
      cc.el.style.opacity=(inA*qo).toFixed(3);
      cc.el.style.transform=`translateX(${((1-inA)*46*dir).toFixed(1)}px) rotate(${((1-inA)*10*dir).toFixed(2)}deg) scale(${s2.toFixed(3)})`;
      cc.el.style.borderColor=inA>0.9&&t<cc.pop+0.45?'#E8B32E':'#C8A86E';
    }
    qnoteEl.style.opacity=(seg(t,66.4,0.4)*qo).toFixed(3);
    const cpo=eio(seg(t,68.0,0.5));
    qctaEl.style.opacity=(cpo*qo).toFixed(3);
    qctaEl.style.transform=`translateX(${((1-cpo)*30).toFixed(1)}px) scale(${(1+0.02*Math.sin(clamp(seg(t,68.0,0.6),0,1)*Math.PI)).toFixed(3)})`;
  }
  /* penutup bersih (aturan 28): konten teaser keluar, endcard sendirian */
  const chFade=1-seg(t,75.2,0.35);
  document.getElementById('phead').style.opacity=String(clamp(1-seg(t,75.2,0.35),0,1));
  for(const x of MSGE){ if(t>=75.2) x.el.style.opacity=String(clamp(1-seg(t,75.2,0.35),0,1)*parseFloat(x.el.style.opacity||'1')); }
  typingEl.style.opacity=t>=75.2?'0':typingEl.style.opacity;
  const eci=eio(seg(t,75.4,0.8));
  endcard.style.opacity=eci.toFixed(3);
  endcard.style.transform=`translateY(${((1-eci)*16).toFixed(1)}px) scale(${(0.94+0.06*eci).toFixed(3)})`;
  fBar.style.width=(seg(t,78.4,0.8)*P.barW).toFixed(0)+'px';
  renderSub(t);
  fadeEl.style.opacity=String(clamp(1-seg(t,0.05,0.5),0,1)*0.96+clamp(seg(t,80.6,0.9),0,1));
}
/* layout akurat setelah font siap, lalu siap render */
function boot(){
  let booted=false;
  const run=()=>{ if(booted)return; booted=true; layoutChat(); renderFrame(0); window.__ready=true; };
  if(document.fonts&&document.fonts.ready){ document.fonts.ready.then(run); setTimeout(run,2500); }
  else run();
}
boot();
window.__renderFrame=renderFrame;
</script>
