<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
/*__FONTS__*/
*{margin:0;padding:0;box-sizing:border-box;}
html,body{background:#000;overflow:hidden;}
#stage{position:relative;overflow:hidden;font-family:'Poppins','DejaVu Sans',sans-serif;color:#E7EEF8;
  -webkit-font-smoothing:antialiased;}
/* langit malam ala modeling */
#sky{position:absolute;inset:0;background:linear-gradient(180deg,#0A0E24 0%,#10173A 46%,#0B0F26 100%);}
#stars i{position:absolute;border-radius:50%;background:#DDE7FF;will-change:opacity;}
#world{position:absolute;inset:0;will-change:transform;transform-origin:50% 55%;}
#particles span{position:absolute;will-change:transform,opacity;font-family:'JetBrains Mono','DejaVu Sans Mono',monospace;color:#7DD3FC;}
/* tanah: rumput + tanah cokelat bergaris diagonal */
#dirt{position:absolute;left:0;right:0;will-change:opacity;}
#grass{position:absolute;left:0;right:0;background:#3FA34D;box-shadow:inset 0 -7px 0 rgba(0,0,0,.28);}
#soil{position:absolute;left:0;right:0;background:#241811;
  background-image:repeating-linear-gradient(115deg,rgba(0,0,0,.20) 0 14px,transparent 14px 34px);}
/* papan kayu */
.plankseg{position:absolute;background:linear-gradient(180deg,#A96F35 0%,#8B5A2B 62%,#6E4420 100%);
  border-radius:10px;box-shadow:0 5px 0 rgba(0,0,0,.30);will-change:opacity;}
.plankleg{position:absolute;background:#5E3A1B;border-radius:3px;}
/* blok digit raksasa ala modeling (kontekstual: angka) */
.digblk{position:absolute;border-radius:22px;background:linear-gradient(160deg,#FFE28A 0%,#F2C230 58%,#D19A12 100%);
  box-shadow:inset 0 -10px 0 rgba(146,98,8,.45),0 12px 0 rgba(0,0,0,.32),0 0 34px rgba(242,194,48,.14);
  display:flex;align-items:center;justify-content:center;will-change:transform,opacity;}
.digblk b{font-family:'JetBrains Mono','DejaVu Sans Mono',monospace;color:#FFFFFF;font-weight:800;
  text-shadow:0 4px 0 rgba(146,98,8,.85);}
.chipd{position:absolute;border-radius:8px;background:rgba(255,255,255,.08);border:1px solid rgba(125,211,252,.45);
  color:#7DD3FC;font-weight:800;will-change:transform;font-family:'JetBrains Mono','DejaVu Sans Mono',monospace;}
/* judul raksasa ala modeling */
.bigtitle{position:absolute;left:0;right:0;text-align:center;font-weight:800;opacity:0;will-change:transform,opacity;white-space:nowrap;
  text-shadow:0 6px 0 rgba(0,0,0,.55),0 14px 40px rgba(0,0,0,.6);}
/* tokoh ubin: nama di atas kepala */
.nmtag{position:absolute;left:0;right:0;text-align:center;font-family:'JetBrains Mono','DejaVu Sans Mono',monospace;
  font-weight:800;color:#FFFFFF;white-space:nowrap;will-change:transform,opacity;
  text-shadow:2px 2px 0 #000,-2px 2px 0 #000,2px -2px 0 #000,-2px -2px 0 #000,0 6px 16px rgba(0,0,0,.6);}
.gtile{position:absolute;border-radius:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  will-change:transform,opacity;box-shadow:0 14px 34px rgba(0,0,0,.5);}
.gtile .dg{font-family:'JetBrains Mono','DejaVu Sans Mono',monospace;font-weight:800;line-height:1.06;white-space:nowrap;}
.gtile .en{font-weight:600;letter-spacing:.16em;color:#8FA3BF;}
/* panel gelap ala modeling (chat, keluarga, persamaan, toko) */
.panel{position:absolute;background:rgba(13,19,40,.93);border-radius:20px;will-change:transform,opacity;
  box-shadow:0 22px 60px rgba(0,0,0,.55);}
.panel .hd{font-weight:800;color:#FCD34D;}
.prow{position:absolute;left:0;right:0;display:flex;align-items:center;justify-content:space-between;
  border-radius:12px;background:rgba(255,255,255,.05);will-change:transform,opacity;}
/* panel pesan */
#chatp .who{font-weight:800;color:#4ADE80;}
#chatp .msg{font-weight:700;color:#FFFFFF;}
#chatp{border:2px solid rgba(74,222,128,.55);}
/* subtitle besar ala modeling: pill hitam, teks raksasa */
#subbar{position:absolute;border-radius:22px;background:rgba(4,7,14,.78);box-shadow:0 14px 44px rgba(0,0,0,.6);
  padding:18px 40px;will-change:transform,opacity;left:50%;transform:translateX(-50%);}
#sub_id{font-weight:800;color:#FFFFFF;text-shadow:0 3px 14px rgba(0,0,0,.85);line-height:1.16;}
#sub_en{font-weight:600;color:#9FB0CE;white-space:nowrap;text-shadow:0 2px 8px rgba(0,0,0,.8);}
/* pil emas CTA */
.goldpill{position:absolute;border-radius:999px;background:linear-gradient(92deg,#F59E0B,#FBBF24);color:#1A1206;
  font-weight:800;display:flex;align-items:center;justify-content:center;will-change:transform,opacity;
  box-shadow:0 10px 26px rgba(245,158,11,.35);}
.vig{position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(94% 94% at 50% 42%, transparent 58%, rgba(0,0,0,.52) 100%);}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;}
#fade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;}
.mono{font-family:'JetBrains Mono','DejaVu Sans Mono',monospace;}
.center{text-align:center;}
#grain{position:absolute;inset:0;pointer-events:none;opacity:.04;mix-blend-mode:overlay;
  background-image:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="180" height="180"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><rect width="180" height="180" filter="url(%23n)" opacity="0.6"/></svg>');}
.starclip{background:linear-gradient(180deg,#FDE68A,#D97706);
  -webkit-clip-path:polygon(50% 0%,61.8% 35.2%,98.2% 35.2%,68.2% 57.2%,79.2% 91.2%,50% 70.2%,20.8% 91.2%,31.8% 57.2%,1.8% 35.2%,38.2% 35.2%);
  clip-path:polygon(50% 0%,61.8% 35.2%,98.2% 35.2%,68.2% 57.2%,79.2% 91.2%,50% 70.2%,20.8% 91.2%,31.8% 57.2%,1.8% 35.2%,38.2% 35.2%);}
</style>
</head>
<body>
<div id="stage">
  <div id="sky"></div>
  <div id="stars"></div>
  <div id="world">
    <div id="particles"></div>
    <div id="dirt"><div id="soil"></div><div id="grass"></div></div>
    <div id="planks"></div>
    <div id="blocks"></div>

    <!-- S0 HOOK -->
    <div class="bigtitle" id="t0">1, 2, 3 SAJA?</div>
    <div id="h_tiles"></div>
    <div id="h_q" class="center mono" style="position:absolute;color:#F87171;font-weight:800;opacity:0;">?</div>

    <!-- S1 SITUASI: properti dunia muncul berurutan -->
    <div class="bigtitle" id="t1">EMPAT SITUASI</div>
    <div id="a_props"></div>

    <!-- S2 KELOMPOK: lima tokoh bernama -->
    <div class="bigtitle" id="t2">LIMA KELOMPOK</div>
    <div id="g_tiles"></div>

    <!-- S3 KENAPA: panel keluarga ala leaderboard -->
    <div class="bigtitle" id="t3">KELUARGA BILANGAN</div>
    <div class="panel" id="fam">
      <div class="hd center" id="fam_hd">KELUARGA BILANGAN</div>
      <div id="fam_rows"></div>
    </div>

    <!-- S4 ATURAN: panel persamaan -->
    <div class="bigtitle" id="t4">ATURAN SATU</div>
    <div class="panel" id="eqp">
      <div class="mono center" id="eq_t" style="font-weight:800;color:#FCD34D;">1/2 + 1/2 = 1</div>
      <div class="center" id="eq_lab" style="color:#9FB0CE;font-weight:700;letter-spacing:.20em;">CARA BEBAS, HASIL SESUAI ATURAN</div>
    </div>

    <!-- S5 CTA: panel toko ala modeling -->
    <div class="bigtitle" id="t5">PILIH SATU?</div>
    <div class="panel center" id="cta">
      <div id="f_open" style="color:#C9D6EE;font-weight:700;letter-spacing:.14em;">MENURUTMU, CUKUP SATU JENIS?</div>
      <div id="f_open_e" style="color:#8FA3BF;font-weight:600;letter-spacing:.26em;">IS ONE KIND ENOUGH?</div>
      <div id="f_url" class="mono" style="font-weight:800;">AKIOMIDA.COM</div>
      <div id="f_bar" style="height:6px;border-radius:99px;background:linear-gradient(90deg,#22D3EE,#A78BFA,#FBBF24);width:0;"></div>
      <div class="goldpill" id="f_pill">TULIS DI KOMEN</div>
    </div>

    <!-- papan bawah tokoh: bola emas BABOPA + bayangan + kilat -->
    <div id="ballsh"></div>
    <div id="ball"></div>
    <div id="spark" class="starclip" style="position:absolute;width:34px;height:34px;opacity:0;"></div>

    <!-- panel pesan ala modeling -->
    <div class="panel" id="chatp" style="opacity:0;">
      <div class="who">&#9679; BABOPA</div>
      <div class="msg" id="chatp_msg"></div>
    </div>
  </div>

  <div id="subbar">
    <div class="center" id="sub_id"></div>
    <div class="center" id="sub_en"></div>
  </div>

  <div class="center" id="wm" style="position:absolute;color:#7C8BA1;font-weight:600;letter-spacing:.40em;opacity:.5;">AKIOMIDA</div>
  <div class="vig"></div>
  <div id="grain"></div>
  <div id="flash"></div>
  <div id="fade"></div>
</div>

<script>
const Q=new URLSearchParams(location.search);
const ORIENT=Q.get('o')||'landscape';
const W=ORIENT==='portrait'?1080:1920;
const H=ORIENT==='portrait'?1920:1080;

/* v07 rombak total ala modeling 60719beb: dunia pixel layar penuh,
   teks besar nyaman (subtitle raksasa, judul raksasa, tokoh bernama),
   satu ide per layar, panel gelap ala UI game. */
const P = ORIENT==='portrait' ? {
  groundY:1230, grassH:26,
  plankY:988, plankN:4, plankW:236, plankGap:22,
  blkY1:150, blkS1:150, blkG1:18, blkY2:520, blkS2:130,
  titleY:330, titleS0:110, titleSN:86,
  WAY:[[0.55,180],[1.5,320],[6.7,230],[8.85,650],[10.0,230],[12.2,650],[14.6,110],[25.7,110],[26.6,980],[32.9,980],[33.8,170],[36.6,170],[40.2,260],[51.9,260]],
  ttX:[180,540,110,980,170,260],
  tw0:[447,1.0], twGap:28, tileS:130, tagS:30,
  gtGap:12, gtS:132, gtTag:26, gtDg:40, gtEn:14,
  propX:[330,750],
  famX:120, famY:470, famW:840, famHd:74, famRow:74, famName:30, famMem:40,
  eqX:100, eqY:470, eqW:880, eqH:206, eqSize:88,
  ctaX:80, ctaY:480, ctaW:920, ctaH:540, ctaOpen:38, ctaOpenE:17, ctaUrl:94,
  subTop:1272, subId:50, subEn:24, subMax:900,
  chatX:70, chatY:640, chatW:470, chatWho:27, chatMsg:32,
  ballD:110, qX:846, qY:560, qSize:132,
  wmY:1852, wmSize:20
} : {
  groundY:828, grassH:22,
  plankY:662, plankN:5, plankW:320, plankGap:24,
  blkY1:60, blkS1:130, blkG1:16, blkY2:470, blkS2:110,
  titleY:240, titleS0:94, titleSN:80,
  WAY:[[0.55,300],[1.5,480],[6.7,560],[8.85,1020],[10.0,560],[12.2,1020],[14.6,470],[25.7,470],[26.6,1620],[32.9,1620],[33.8,300],[36.6,300],[40.2,480],[51.9,480]],
  ttX:[300,900,470,1560,300,420],
  tw0:[756,1.0], twGap:28, tileS:120, tagS:27,
  gtGap:12, gtS:124, gtTag:24, gtDg:36, gtEn:13,
  propX:[660,1120],
  famX:460, famY:380, famW:1000, famHd:56, famRow:62, famName:24, famMem:30,
  eqX:510, eqY:470, eqW:900, eqH:180, eqSize:76,
  ctaX:530, ctaY:380, ctaW:860, ctaH:440, ctaOpen:32, ctaOpenE:15, ctaUrl:82,
  subTop:830, subId:50, subEn:24, subMax:1400,
  chatX:80, chatY:470, chatW:440, chatWho:24, chatMsg:29,
  ballD:96, qX:1420, qY:300, qSize:118,
  wmY:1018, wmSize:20
};
const MX=60;
const stage=document.getElementById('stage');
stage.style.width=W+'px';stage.style.height=H+'px';

/* ---------- easing & util ---------- */
const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,p)=>a+(b-a)*p;
const seg=(t,a,d)=>clamp((t-a)/d,0,1);
const eio=p=>p<0.5?2*p*p:1-Math.pow(-2*p+2,2)/2;
const eoe=p=>1-Math.pow(1-p,3);
const smz=(t,a,b,f)=>f?clamp((t-a)/f,0,1)*clamp((b-t)/f,0,1):(t>=a&&t<b?1:0);
function popA(el,t,t0,d,ov,op0,op1){
  const o=clamp(seg(t,t0,0.3)*(1-seg(t,op1,0.35)),0,1);
  const s2=1+(ov/100)*Math.sin(clamp(seg(t,t0,d),0,1)*Math.PI)*(1-seg(t,op1,0.35));
  el.style.opacity=String(o);
  el.style.transform=`scale(${s2.toFixed(3)})`;
}
const mulberry=(s)=>()=>{s|=0;s=s+0x6D2B79F5|0;let q=Math.imul(s^s>>>15,1|s);q=q+Math.imul(q^q>>>7,61|q)^q;return((q^q>>>14)>>>0)/4294967296;};
const rnd=mulberry(20261115);

/* ---------- langit: bintang + partikel digit ---------- */
const stars=document.getElementById('stars');
stars.style.cssText='position:absolute;inset:0;';
const ST=[];
for(let i=0;i<46;i++){
  const s=document.createElement('i');
  const sz=(2+rnd()*3).toFixed(0);
  s.style.cssText=`left:${(rnd()*W).toFixed(0)}px;top:${(rnd()*(P.groundY-140)).toFixed(0)}px;width:${sz}px;height:${sz}px;`;
  stars.appendChild(s);
  ST.push({el:s,ph:rnd()*6.28,sp:.5+rnd()*1.2});
}
const parts=document.getElementById('particles');
const CH='0123456789+=/\u00BD\u00B0\u00D7';
const NP=18, PA=[];
for(let i=0;i<NP;i++){
  const el=document.createElement('span');
  el.textContent=CH[Math.floor(rnd()*CH.length)];
  el.style.fontSize=(15+rnd()*22).toFixed(0)+'px';
  el.style.fontWeight=(rnd()<.3?'700':'400');
  parts.appendChild(el);
  PA.push({el,x:rnd()*W,y0:rnd()*H,sp:5+rnd()*11,wf:.3+rnd()*.7,ph:rnd()*6.28,o:.13+rnd()*.15});
}

/* ---------- tanah, papan kayu, blok digit ---------- */
const dirt=document.getElementById('dirt');
const soil=document.getElementById('soil'), grass=document.getElementById('grass');
soil.style.cssText+=`top:${P.grassH}px;bottom:0;`;
grass.style.cssText+=`top:0;height:${P.grassH}px;`;
dirt.style.cssText+=`top:${P.groundY}px;bottom:0;`;
const planks=document.getElementById('planks');
{
  const total=P.plankN*P.plankW+(P.plankN-1)*P.plankGap;
  const x0=(W-total)/2;
  for(let i=0;i<P.plankN;i++){
    const s=document.createElement('div');s.className='plankseg';
    s.style.cssText+=`left:${x0+i*(P.plankW+P.plankGap)}px;top:${P.plankY}px;width:${P.plankW}px;height:26px;`;
    const l1=document.createElement('div');l1.className='plankleg';
    l1.style.cssText+=`left:22px;top:${P.plankY+26}px;width:16px;height:14px;`;
    const l2=document.createElement('div');l2.className='plankleg';
    l2.style.cssText+=`left:${P.plankW-38}px;top:${P.plankY+26}px;width:16px;height:14px;`;
    s.appendChild(l1);s.appendChild(l2);planks.appendChild(s);
  }
  const chips=['1','0','5','+'];
  for(let i=0;i<3;i++){
    const c=document.createElement('div');c.className='chipd';
    c.style.cssText+=`left:${x0+60+i*310}px;top:${P.plankY-20}px;width:22px;height:22px;`+
      `display:flex;align-items:center;justify-content:center;font-size:13px;`;
    c.textContent=chips[i];
    planks.appendChild(c);
  }
}
const blocks=document.getElementById('blocks');
const BLK=[];
const ROWS1=['1','2','3','0','5'];
const ROWS2=['1/2','\u03C0','-5\u00B0','7'];
function buildBlkRow(list,y,sz,gap,fs){
  const total=list.length*sz+(list.length-1)*gap;
  const x0=(W-total)/2;
  list.forEach((g,i)=>{
    const b=document.createElement('div');b.className='digblk';
    b.style.cssText+=`left:${x0+i*(sz+gap)}px;top:${y}px;width:${sz}px;height:${sz}px;opacity:0;`;
    const t=document.createElement('b');
    t.style.fontSize=fs+'px';t.textContent=g;
    b.appendChild(t);blocks.appendChild(b);
    BLK.push({el:b,ph:i*0.7+((y===P.blkY1)?0:2.1),t0:y===P.blkY1?0.35:0.85});
  });
}
buildBlkRow(ROWS1,P.blkY1,P.blkS1,P.blkG1,Math.round(P.blkS1*0.42));
buildBlkRow(ROWS2,P.blkY2,P.blkS2,P.blkG1,Math.round(P.blkS2*0.36));

/* ---------- tokoh utama: bulatan emas BABOPA ---------- */
function buildGoldBall(host,d){
  const el=document.createElement('div');
  el.style.cssText=`position:absolute;left:${P.ttX[0]}px;top:${P.groundY}px;width:${d}px;height:${d}px;margin-left:${-d/2}px;transform-origin:50% 100%;will-change:transform,opacity,left;opacity:0;`;
  const core=document.createElement('div');
  core.style.cssText=`position:absolute;left:0;top:${-d}px;width:${d}px;height:${d}px;border-radius:50%;background:radial-gradient(circle at 33% 27%, #FFF3C4 0%, #FCD34D 34%, #F59E0B 68%, #B45309 100%);box-shadow:inset -7px -11px 20px rgba(120,53,15,.35), 0 0 50px rgba(251,191,36,.30);`;
  el.appendChild(core);
  const shine=document.createElement('div');
  shine.style.cssText=`position:absolute;left:${d*0.18}px;top:${-d*0.89}px;width:${d*0.32}px;height:${d*0.18}px;border-radius:50%;background:rgba(255,255,255,.72);filter:blur(2px);transform:rotate(-24deg);`;
  el.appendChild(shine);
  const sweat=document.createElement('div');
  sweat.style.cssText=`position:absolute;left:${d*0.75}px;top:${-d*1.14}px;width:12px;height:16px;background:#7DD3FC;border-radius:2px 2px 60% 60%;opacity:0;will-change:transform,opacity;`;
  el.appendChild(sweat);
  host.appendChild(el);
  return {el,core,shine,sweat};
}
function buildShadow(host){
  const d=P.ballD;
  const el=document.createElement('div');
  el.style.cssText=`position:absolute;left:${P.ttX[0]}px;top:${P.groundY-8}px;width:${d*0.72}px;height:15px;margin-left:${-d*0.36}px;border-radius:50%;background:radial-gradient(ellipse at center, rgba(0,0,0,.5) 0%, rgba(0,0,0,0) 72%);filter:blur(2px);opacity:0;will-change:transform,opacity,margin-left;`;
  host.appendChild(el);
  return el;
}
function buildTag(host,x,y,txt,sz){
  const el=document.createElement('div');
  el.className='nmtag';
  el.style.cssText+=`left:${x-70}px;top:${y}px;width:140px;font-size:${sz}px;opacity:0;`;
  el.textContent=txt;
  host.appendChild(el);
  return el;
}
/* ubin tokoh (teaser dan lima kelompok) */
function buildTile(host,x,s,glyph,col,en,ts,dgfs,enfs){
  const el=document.createElement('div');
  el.className='gtile';
  el.style.cssText+=`left:${x}px;top:${P.groundY-s}px;width:${s}px;height:${s}px;opacity:0;`+
    `background:rgba(13,19,40,.92);border:2px solid ${col};`;
  const d=document.createElement('div');
  d.className='dg';d.style.cssText=`font-size:${dgfs}px;color:${col};`;d.textContent=glyph;
  el.appendChild(d);
  if(en){
    const e2=document.createElement('div');
    e2.className='en';e2.style.cssText=`font-size:${enfs}px;`;e2.textContent=en;
    el.appendChild(e2);
  }
  host.appendChild(el);
  return el;
}
const ball=buildGoldBall(document.getElementById('ball'),P.ballD);
const ballsh=buildShadow(document.getElementById('ballsh'));
const spark=document.getElementById('spark');
/* kembaran bola seragam untuk demo belah dua (1/2 dan 1/2+1/2=1) */
const ballB=document.createElement('div');
ballB.style.cssText=`position:absolute;left:${P.ttX[4]}px;top:${P.groundY-Math.round(P.ballD*0.52)}px;width:${Math.round(P.ballD*0.52)}px;height:${Math.round(P.ballD*0.52)}px;margin-left:${-Math.round(P.ballD*0.26)}px;border-radius:50%;background:radial-gradient(circle at 33% 27%, #FFF3C4 0%, #FCD34D 34%, #F59E0B 68%, #B45309 100%);box-shadow:0 0 30px rgba(251,191,36,.22);opacity:0;will-change:transform,opacity,left;`;
document.getElementById('ball').appendChild(ballB);

/* ---------- S0: tiga kartu teaser sebagai tokoh ---------- */
const hTiles=document.getElementById('h_tiles');
const hQ=document.getElementById('h_q');
hQ.style.cssText+=`left:${P.qX}px;top:${P.qY}px;font-size:${P.qSize}px;text-shadow:0 8px 0 rgba(0,0,0,.4);`;
const TEAS=[
  {g:'-5\u00B0',c:'#7DD3FC',n:'NEGATIF'},
  {g:'1/2',c:'#34D399',n:'PECAHAN'},
  {g:'\u03C0',c:'#A78BFA',n:'IRASIONAL'}
];
const TW=[];

const world=document.getElementById('world');

let _roll=0, _lbx=null;
function renderFrame(t){
  /* bintang + partikel + blok dunia */
  for(const s of ST){
    s.el.style.opacity=(0.35+0.5*(0.5+0.5*Math.sin(t*s.sp+s.ph))).toFixed(3);
  }
  const zone=0.5+0.3*(smz(t,0,6.6)+smz(t,34.8,43.2));
  for(let i=0;i<NP;i++){
    const p=PA[i];
    const yy=((p.y0-t*p.sp)%(H+140)+H+140)%(H+140)-70;
    p.el.style.transform=`translate(${(p.x+Math.sin(t*p.wf+p.ph)*20).toFixed(1)}px,${yy.toFixed(1)}px)`;
    p.el.style.opacity=(p.o*zone*(0.75+0.25*Math.sin(t*1.1+p.ph))).toFixed(3);
  }
  for(const b of BLK){
    const o=clamp(seg(t,b.t0,0.5)*(1-seg(t,25.6,0.4))*0.95,0,0.95);
    b.el.style.opacity=o.toFixed(3);
    b.el.style.transform=`translateY(${(Math.sin(t*0.8+b.ph)*7).toFixed(1)}px)`;
  }

  /* judul raksasa */
  for(let i=0;i<TITLES.length;i++){
    const o=TITLES[i];
    const tEnd=i+1<TITLES.length?TITLES[i+1].t0:51.4;
    const oin=seg(t,o.t0,0.35)*(1-seg(t,tEnd-0.25,0.3));
    const sc=1+0.07*Math.sin(clamp(seg(t,o.t0,0.5),0,1)*Math.PI);
    o.el.style.opacity=oin.toFixed(3);
    o.el.style.transform=`scale(${sc.toFixed(3)})`;
  }

  /* S0: kartu teaser + tanda tanya (pergi saat S1 mulai) */
  for(const w of TW){
    popA(w.el,t,w.t0,0.55,22,0.8,6.4);
  }
  popA(hQ,t,4.9,0.6,26,0.8,6.4);
  hQ.style.transform=`scale(${(1+0.10*Math.sin(clamp(seg(t,4.9,0.6),0,1)*Math.PI)).toFixed(3)}) rotate(${(Math.sin(t*3.2)*4).toFixed(2)}deg)`;

  /* S1: properti dunia berpasangan (pasangan 1 pergi di 10.15, pasangan 2 di 14.0) */
  const pOut=1-seg(t,10.15,0.3), pOut2=1-seg(t,14.0,0.3);
  [[0,6.9],[1,8.85],[2,10.35],[3,10.45]].forEach(([i,t0])=>{
    const pr=PROPS[i];
    const oin=seg(t,t0,0.4);
    const o=oin*(i<2?pOut:pOut2);
    pr.el.style.opacity=o.toFixed(3);
    pr.el.style.transform=`translateY(${((1-eio(oin))*60).toFixed(1)}px)`;
    pr.tg.style.opacity=o.toFixed(3);
  });

  /* S2: lima tokoh kelompok (pergi saat panel keluarga muncul) */
  for(const g of GT){
    popA(g.el,t,g.t0,0.55,20,0.8,25.8);
  }

  /* S3: panel keluarga + baris (pergi saat S4) */
  popA(fam,t,26.0,0.6,10,0.8,32.75);
  for(const r of FROW){
    const oin=seg(t,r.t0,0.4);
    r.el.style.opacity=oin.toFixed(3);
    r.el.style.transform=`translateX(${((1-eio(oin))*-70).toFixed(1)}px)`;
  }

  /* S4: panel persamaan (pergi saat S5) */
  popA(eqp,t,36.7,0.55,10,0.8,40.1);

  /* S5: panel toko */
  popA(cta,t,40.9,0.6,10,0.8,51.6);
  fBar.style.width=(seg(t,42.2,1.8)*Math.max(0,P.ctaW-80)).toFixed(0)+'px';
  popA(fPill,t,47.5,0.5,14,0.8,51.6);

  /* panel pesan */
  let cOn=false;
  for(const [b0,b1,tx3] of CHATS){
    if(t>=b0&&t<b1){
      cOn=true;
      if(chatMsg.textContent!==tx3)chatMsg.textContent=tx3;
    }
  }
  const co=cOn?Math.min(seg(t,chatT0(CHATS,t),0.25),1-seg(t,chatT1(CHATS,t)-0.14,0.14)):0;
  chatp.style.opacity=co.toFixed(3);
  chatp.style.transform=`scale(${(0.9+0.1*co).toFixed(3)})`;

  /* bola mentor: masterplan gerakan - tabel waypoint, menggelinding antar stasiun
     (rotasi = jarak/jari-jari), gestur bersih tanpa deformasi, skala selalu seragam */
  let bx=P.WAY[P.WAY.length-1][1];
  for(let k=0;k<P.WAY.length-1;k++){
    const [w0,x0]=P.WAY[k], [w1,x1]=P.WAY[k+1];
    if(t>=w0&&t<w1){ bx=lerp(x0,x1,eio(seg(t,w0,w1-w0))); break; }
  }
  if(t>=P.WAY[P.WAY.length-1][0]) bx=P.WAY[P.WAY.length-1][1];
  if(_lbx===null)_lbx=bx;
  _roll+=(bx-_lbx)/(P.ballD/2)*(180/Math.PI);
  _lbx=bx;
  const ep=seg(t,0.6,0.55), ef=eoe(ep);
  const brs=Math.sin(t*9.4)*0.03;
  let hy=0, gro=0, lrot=0, drot=0, dyy=0, sinkA=0, txj=0;
  for(const [gs,gd,gt,ga,gdir] of GESTS){
    const d=t-gs;
    if(d>=0&&d<gd){
      const p=d/gd, w=Math.sin(p*Math.PI);
      if(gt==='tilt'||gt==='lean'){ lrot+=(gt==='lean'?gdir:1)*ga*w; }
      else if(gt==='nod'){ lrot+=ga*Math.sin(p*2*Math.PI); }
      else if(gt==='pulse'){ gro+=(ga-1)*w; }
      else if(gt==='jump'){ hy-=ga*4*p*(1-p); }
      else if(gt==='spin'){ drot+=ga*eio(p); }
      else if(gt==='count'){ hy-=ga*Math.abs(Math.sin(p*5*Math.PI))*(1-p*0.2); }
      else if(gt==='shiver'){ txj=ga*Math.sin(p*40)*(1-p); }
      else if(gt==='sink'){ dyy+=ga*w; sinkA=w; }
    }
  }
  /* belah dua seragam (pizza 1/2 dan 1/2+1/2=1) */
  let bsa=1, bbo=0, bboff=0;
  for(const [s0,s1] of SPLIT){
    if(t>=s0&&t<s1){
      const p=(t-s0)/(s1-s0);
      const sp2=p<0.35? eio(p/0.35) : (p>0.7? 1-eio((p-0.7)/0.3) : 1);
      bsa=1-0.48*sp2;
      bbo=sp2;
      bboff=lerp(0,96,sp2);
    }
  }
  const uni=(1+brs)*(1+gro);
  ball.el.style.left=bx.toFixed(1)+'px';
  ball.el.style.opacity=String(clamp(ep*3,0,1));
  ball.el.style.transform=`translateY(${((1-ef)*-260+hy+dyy).toFixed(1)}px) translateX(${txj.toFixed(1)}px) rotate(${(_roll+lrot+drot).toFixed(2)}deg) scale(${(uni*bsa).toFixed(3)})`;
  ballsh.style.left=bx.toFixed(1)+'px';
  ballsh.style.opacity=String(clamp(ep*3,0,1)*clamp(0.42+hy*0.006,0.18,0.5)*(1-0.5*sinkA)*bsa);
  ballsh.style.transform=`scaleX(${clamp((1+hy*0.004)*bsa,0.4,1.08).toFixed(3)})`;
  const sweatOn=((t>=4.9&&t<5.7)||(t>=8.85&&t<9.7))?1:0;
  ball.sweat.style.opacity=String(sweatOn*0.9);
  ball.sweat.style.transform=`translateY(${(sweatOn?(t*16)%24:0).toFixed(1)}px)`;
  ballB.style.left=(bx+bboff).toFixed(1)+'px';
  ballB.style.opacity=String(clamp(bbo,0,1));
  ballB.style.transform=`rotate(${(_roll*0.5).toFixed(1)}deg)`;
  let spo=0;
  for(const [sa,sb] of SPARKS){
    if(t>=sa&&t<sb) spo=smz(t,sa,sb,0.35)*(0.65+0.35*Math.sin(t*11));
  }
  spark.style.opacity=String(clamp(spo,0,1));
  spark.style.left=(bx+58).toFixed(1)+'px';
  spark.style.top=(P.groundY-168+Math.sin(t*3)*6).toFixed(1)+'px';
  spark.style.transform=`rotate(${((t*40)%360).toFixed(0)}deg) scale(${(0.8+0.25*Math.sin(t*9)).toFixed(3)})`;

  renderSub(t);

  /* kamera: guncangan beat + kilat */
  const im=imp(t);
  const shx=Math.sin(t*47)*6*im, shy=Math.sin(t*39+1.7)*4*im;
  world.style.transform=`translate(${shx.toFixed(2)}px,${(shy+Math.sin(t*0.35)*5).toFixed(2)}px) scale(${(1+im*0.012).toFixed(4)})`;
  flash.style.opacity=(im*0.14).toFixed(3);
  fade.style.opacity=String(clamp(1-seg(t,0.05,0.5),0,1)*0.96+clamp(seg(t,51.4,0.6),0,1));
}
function chatT0(list,t){ for(const [b0] of list){ if(t>=b0&&t<b0+0.4) return b0; } return 0; }
function chatT1(list,t){ for(const [b0,b1] of list){ if(t>=b0-0.4&&t<b1) return b1; } return 52; }
renderFrame(0);
window.__ready=true;
</script>
