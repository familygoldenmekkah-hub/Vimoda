<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
/*__FONTS__*/
*{margin:0;padding:0;box-sizing:border-box;}
html,body{background:#000;overflow:hidden;}
#stage{position:relative;overflow:hidden;font-family:'Poppins','DejaVu Sans',sans-serif;color:#1B2437;
  -webkit-font-smoothing:antialiased;}
/* langit kota: siang menuju senja (dua layer silang) */
#skyday{position:absolute;inset:0;background:linear-gradient(180deg,#8ECDF8 0%,#B8E2FB 55%,#EAF6FF 100%);}
#skydusk{position:absolute;inset:0;background:linear-gradient(180deg,#232B5E 0%,#4A3B75 52%,#C96A4B 86%,#E89255 100%);opacity:0;}
#stars i{position:absolute;border-radius:50%;background:#FFF6D9;will-change:opacity;}
/* dunia kota */
#world{position:absolute;inset:0;will-change:transform;transform-origin:50% 60%;}
.cloud{position:absolute;will-change:transform;opacity:.92;}
.cloud b{position:absolute;border-radius:999px;background:#FFFFFF;box-shadow:0 10px 24px rgba(120,160,200,.25);}
.bld{position:absolute;border-radius:14px 14px 0 0;will-change:opacity,transform;}
.win{position:absolute;border-radius:6px;background:#39506B;will-change:background,box-shadow;}
.awn{position:absolute;border-radius:10px 10px 0 0;will-change:transform,opacity;
  background:repeating-linear-gradient(90deg,#E15B5B 0 26px,#FFFFFF 26px 52px);
  box-shadow:0 6px 0 rgba(0,0,0,.14);}
#road{position:absolute;left:0;right:0;background:#3E4653;}
#roadmark{position:absolute;left:0;right:0;height:0;border-top:7px dashed #F2E85C;opacity:.85;}
#curb{position:absolute;left:0;right:0;background:#DAE0E8;box-shadow:0 -5px 0 rgba(0,0,0,.10);}
#walk{position:absolute;left:0;right:0;background:#C9CFD8;
  background-image:linear-gradient(90deg,rgba(0,0,0,.055) 2px,transparent 2px),linear-gradient(rgba(0,0,0,.045) 2px,transparent 2px);
  background-size:120px 60px;}
#plaza{position:absolute;left:0;right:0;opacity:0;will-change:opacity;
  background:#BFC6D2;background-image:radial-gradient(circle at 24px 24px,rgba(0,0,0,.05) 3px,transparent 4px);
  background-size:96px 96px;}
.tree{position:absolute;will-change:transform,opacity;}
.tree .trunk{position:absolute;left:50%;bottom:0;width:16px;border-radius:6px;background:#7A5230;margin-left:-8px;}
.tree .leaf{position:absolute;border-radius:50%;background:#4FA35C;box-shadow:inset -8px -10px 0 rgba(0,0,0,.12);}
.lamp{position:absolute;will-change:transform,opacity;}
.lamp .pole{position:absolute;left:50%;bottom:0;width:10px;margin-left:-5px;border-radius:4px;background:#4A5568;}
.lamp .head{position:absolute;left:50%;width:34px;height:20px;margin-left:-17px;border-radius:8px;background:#4A5568;}
.lamp .glow{position:absolute;left:50%;width:110px;height:110px;margin-left:-55px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,214,130,.85) 0%,rgba(255,214,130,0) 70%);opacity:0;will-change:opacity;}
.bench{position:absolute;will-change:opacity;}
.bench i{position:absolute;border-radius:8px;background:#8B5A2B;box-shadow:0 4px 0 rgba(0,0,0,.18);}
.car{position:absolute;will-change:transform;}
.car .body{position:absolute;left:0;top:0;border-radius:16px;box-shadow:inset 0 -10px 0 rgba(0,0,0,.18);}
.car .top{position:absolute;border-radius:12px 12px 0 0;background:rgba(255,255,255,.28);}
.car .wh{position:absolute;bottom:-7px;width:26px;height:26px;border-radius:50%;background:#22262E;border:5px solid #4A525F;}
/* plak nomor pintu 1 2 3 (hook) */
.plaque{position:absolute;border-radius:12px;background:linear-gradient(160deg,#FFE28A,#F2C230);
  box-shadow:0 6px 0 rgba(0,0,0,.22),0 0 26px rgba(242,194,48,.25);
  display:flex;align-items:center;justify-content:center;will-change:transform,opacity;}
.plaque b{font-family:'JetBrains Mono','DejaVu Sans Mono',monospace;color:#FFF;font-weight:800;
  text-shadow:0 3px 0 rgba(146,98,8,.8);}
/* jendela kedai + chip situasi */
.shopwin{position:absolute;border-radius:14px;background:#F7F3E9;border:6px solid #FFFFFF;
  box-shadow:0 12px 30px rgba(30,45,80,.25);will-change:transform,opacity;overflow:hidden;}
.chip{position:absolute;border-radius:9px;background:rgba(20,28,48,.82);color:#FFFFFF;font-weight:800;
  font-family:'JetBrains Mono','DejaVu Sans Mono',monospace;will-change:transform,opacity;
  box-shadow:0 5px 14px rgba(0,0,0,.3);text-align:center;}
/* ubin kelompok (papan toko) + daftar keluarga */
.tile{position:absolute;border-radius:14px;background:rgba(255,255,255,.95);will-change:transform,opacity;
  box-shadow:0 10px 26px rgba(30,45,80,.22);text-align:center;}
.fam{position:absolute;border-radius:22px;background:rgba(13,20,38,.9);will-change:transform,opacity;
  box-shadow:0 14px 40px rgba(0,0,0,.4);padding:20px 30px;}
/* papan tulis kafe + papan pengumuman kayu */
.board{position:absolute;will-change:transform,opacity;}
.board.wood{background:linear-gradient(180deg,#8B5A2B,#6E4420);border-radius:16px;
  box-shadow:0 14px 34px rgba(0,0,0,.35),inset 0 0 0 4px #5E3A1B;}
.board.slate{background:#2B3A46;border:8px solid #7A5230;border-radius:14px;
  box-shadow:0 12px 30px rgba(0,0,0,.3);}
/* karakter bola (mentor emas + teman warna): tanpa nama, bermata */
.bchar{position:absolute;will-change:transform,opacity;}
.bchar .core{position:absolute;border-radius:50%;}
.bchar .shine{position:absolute;border-radius:50%;background:rgba(255,255,255,.72);filter:blur(2px);}
.bsh{position:absolute;border-radius:50%;background:radial-gradient(ellipse at center,rgba(20,28,40,.42) 0%,rgba(20,28,40,0) 70%);
  filter:blur(2px);will-change:transform,opacity;}
.goldpill{position:absolute;border-radius:999px;background:linear-gradient(92deg,#F59E0B,#FBBF24);color:#1A1206;
  font-weight:800;display:flex;align-items:center;justify-content:center;will-change:transform,opacity;
  box-shadow:0 10px 26px rgba(245,158,11,.4);}
#f_url{font-family:'JetBrains Mono','DejaVu Sans Mono',monospace;}
#subbar{position:absolute;border-radius:22px;background:rgba(10,14,26,.82);box-shadow:0 14px 44px rgba(0,0,0,.5);
  padding:18px 40px;will-change:transform,opacity;left:50%;transform:translateX(-50%);}
#sub_id{font-weight:800;color:#FFFFFF;text-shadow:0 3px 14px rgba(0,0,0,.85);line-height:1.16;}
#sub_en{font-weight:600;color:#A9B8D0;white-space:nowrap;text-shadow:0 2px 8px rgba(0,0,0,.8);}
/* watermark AKIOMIDA: wajib selalu terlihat */
#wm{position:absolute;left:0;right:0;text-align:center;color:#FFFFFF;font-weight:600;opacity:.55;
  letter-spacing:.42em;font-family:'JetBrains Mono','DejaVu Sans Mono',monospace;
  text-shadow:0 2px 10px rgba(0,0,0,.6);pointer-events:none;}
.starclip{background:linear-gradient(180deg,#FDE68A,#D97706);
  -webkit-clip-path:polygon(50% 0%,61.8% 35.2%,98.2% 35.2%,68.2% 57.2%,79.2% 91.2%,50% 70.2%,20.8% 91.2%,31.8% 57.2%,1.8% 35.2%,38.2% 35.2%);
  clip-path:polygon(50% 0%,61.8% 35.2%,98.2% 35.2%,68.2% 57.2%,79.2% 91.2%,50% 70.2%,20.8% 91.2%,31.8% 57.2%,1.8% 35.2%,38.2% 35.2%);}
.vig{position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(94% 94% at 50% 42%, transparent 60%, rgba(10,16,30,.4) 100%);}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;}
#fade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;}
.mono{font-family:'JetBrains Mono','DejaVu Sans Mono',monospace;}
.center{text-align:center;}
.bigtitle{position:absolute;left:0;right:0;text-align:center;font-weight:800;opacity:0;will-change:transform,opacity;
  white-space:nowrap;color:#FFFFFF;text-shadow:0 5px 0 rgba(24,38,66,.5),0 14px 40px rgba(24,38,66,.45);}
#grain{position:absolute;inset:0;pointer-events:none;opacity:.04;mix-blend-mode:overlay;
  background-image:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="180" height="180"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><rect width="180" height="180" filter="url(%23n)" opacity="0.6"/></svg>');}
</style>
</head>
<body>
<div id="stage">
  <div id="skyday"></div>
  <div id="skydusk"></div>
  <div id="stars"></div>
  <div id="world">
    <div id="clouds"></div>
    <div id="town"></div>
    <div id="roadwrap"><div id="road"></div><div id="roadmark"></div><div id="cars"></div></div>
    <div id="curb"></div>
    <div id="walk"></div>
    <div id="plaza"></div>
    <div id="streetprops"></div>
    <div id="chars"></div>
    <div id="fireflies"></div>
  </div>

  <div class="bigtitle" id="t0">1, 2, 3 SAJA?</div>
  <div class="bigtitle" id="t1">EMPAT SITUASI</div>
  <div class="bigtitle" id="t2">LIMA KELOMPOK</div>
  <div class="bigtitle" id="t3">KELUARGA BILANGAN</div>
  <div class="bigtitle" id="t4">ATURAN SATU</div>
  <div class="bigtitle" id="t5">PILIH SATU?</div>

  <!-- papan pengumuman CTA (AKIOMIDA.COM reveal lambat di akhir) -->
  <div class="board wood center" id="cta" style="opacity:0;">
    <div id="f_open" style="color:#FFE9C2;font-weight:800;letter-spacing:.14em;">MENURUTMU, CUKUP SATU JENIS?</div>
    <div id="f_open_e" style="color:#D9B98F;font-weight:600;letter-spacing:.26em;">IS ONE KIND ENOUGH?</div>
    <div id="f_url" class="center" style="font-weight:800;opacity:0;">AKIOMIDA.COM</div>
    <div id="f_bar" style="height:6px;border-radius:99px;background:linear-gradient(90deg,#22D3EE,#A78BFA,#FBBF24);width:0;"></div>
    <div class="goldpill" id="f_pill">TULIS DI KOMEN</div>
  </div>

  <div id="subbar">
    <div class="center" id="sub_id"></div>
    <div class="center" id="sub_en"></div>
  </div>

  <!-- watermark AKIOMIDA: wajib selalu terlihat -->
  <div id="wm">AKIOMIDA</div>

  <div class="vig"></div>
  <div id="grain"></div>
  <div id="flash"></div>
  <div id="fade"></div>
</div>

<script>
const Q=new URLSearchParams(location.search);
const ORIENT=Q.get('o')||'landscape';
const W=ORIENT==='portrait'?1080:1920;
const H=ORIENT==='portrait'?1920:1080;

/* v07 revisi 17: dunia nyata "Kota Bilangan" - gedung, kedai, jalan raya
   dengan mobil, trotoar, pohon, lampu; siang menuju senja.
   Karakter: HANYA bola emas mentor, BULAT SEJATI, tanpa mata.
   Karakter tambahan dihapus (tidak berguna) -> kelompok & keluarga tampil
   sebagai papan/ubin. Semua label dalam zona aman sosmed. Watermark
   AKIOMIDA wajib selalu terlihat. */
const P = ORIENT==='portrait' ? {
  bldBot:950, roadTop:950, roadBot:1028, walkTop:1032, walkBot:1152,
  groundY:1120, backY:1050,
  shopY:560, shopH:256, shopW:200, shopX:[70,310,550,790], awnY:518, awnH:44,
  plqY:420, plqS:66, plqX0:407, plqGap:82,
  qx:716, qy:430, qSize:96,
  titleY:300, titleS0:104, titleSN:82,
  tileY:470, tileW:172, tileGap:16, tileH:330, tileFS:30, tileEx:34, tileEn:14,
  famX:150, famY:430, famW:780, famHd:54, famRow:74, famName:30, famMem:26,
  slateX:30, slateBot:1140, slateW:300, slateH:196, eqFS:46, labFS:17,
  ctaX:80, ctaY:430, ctaW:920, ctaH:540, ctaOff:[64,124,196], ctaPillB:44,
  openFS:36, openEFS:16, urlFS:92,
  pillW:430, pillH:74, pillFS:32,
  subTop:1170, subId:50, subEn:24, subMax:760,
  ballD:110, wmY:1460, wmFS:20,
  treeX:[36,1060], treeS:1.0, lampX:[80,1000], lampH:210,
  carY:962, carW:210, carH:64, carH2:52,
  plazaY:1032
} : {
  bldBot:430, roadTop:430, roadBot:505, walkTop:508, walkBot:630,
  groundY:660, backY:600,
  shopY:270, shopH:150, shopW:230, shopX:[130,630,1130,1630], awnY:234, awnH:34,
  plqY:238, plqS:56, plqX0:870, plqGap:74,
  qx:1100, qy:248, qSize:84,
  titleY:150, titleS0:88, titleSN:72,
  tileY:250, tileW:300, tileGap:24, tileH:210, tileFS:24, tileEx:30, tileEn:13,
  famX:560, famY:240, famW:800, famHd:40, famRow:46, famName:24, famMem:22,
  slateX:250, slateBot:680, slateW:330, slateH:164, eqFS:40, labFS:15,
  ctaX:530, ctaY:240, ctaW:860, ctaH:320, ctaOff:[40,90,130], ctaPillB:30,
  openFS:30, openEFS:14, urlFS:80,
  pillW:400, pillH:66, pillFS:28,
  subTop:740, subId:50, subEn:24, subMax:1300,
  ballD:96, wmY:950, wmFS:18,
  treeX:[110,1810], treeS:0.9, lampX:[120,1800], lampH:170,
  carY:442, carW:190, carH:56, carH2:46,
  plazaY:508
};
const MX=60;
const stage=document.getElementById('stage');
stage.style.width=W+'px';stage.style.height=H+'px';

/* ---------- util & easing ---------- */
const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,p)=>a+(b-a)*p;
const seg=(t,a,d)=>clamp((t-a)/d,0,1);
const eio=p=>p<0.5?2*p*p:1-Math.pow(-2*p+2,2)/2;
const eoe=p=>1-Math.pow(1-p,3);
const smz=(t,a,b,f)=>f?clamp((t-a)/f,0,1)*clamp((b-t)/f,0,1):(t>=a&&t<b?1:0);
function popA(el,t,t0,d,ov,op0,op1){
  const o=clamp(seg(t,t0,0.3)*(1-seg(t,op1,0.35)),0,1);
  const s2=1+(ov/100)*Math.sin(clamp(seg(t,t0,d),0,1)*Math.PI)*(1-seg(t,op1,0.35));
  el.style.opacity=String(o);
  el.style.transform=`scale(${s2.toFixed(3)})`;
}
/* RNG berbenih (deterministik antar render) */
let _seed=20261115;
const rnd=()=>{_seed|=0;_seed=_seed+0x6D2B79F5|0;let z=Math.imul(_seed^_seed>>>15,1|_seed);
  z=z+Math.imul(z^z>>>7,61|z)^z;return((z^z>>>14)>>>0)/4294967296;};

/* ---------- langit: bintang + awan ---------- */
const starsEl=document.getElementById('stars');
const ST=[];
for(let i=0;i<64;i++){
  const s=document.createElement('i');
  const sz=(rnd()*2.4+1.2).toFixed(1);
  s.style.cssText+=`width:${sz}px;height:${sz}px;left:${(rnd()*W).toFixed(0)}px;top:${(rnd()*P.bldBot*0.72).toFixed(0)}px;opacity:0;`;
  starsEl.appendChild(s);
  ST.push({el:s,sp:rnd()*1.4+0.6,ph:rnd()*6.28});
}
const cloudsEl=document.getElementById('clouds');
const CL=[];
for(let i=0;i<3;i++){
  const c=document.createElement('div');
  c.className='cloud';
  const cw=[260,200,320][i], ch=76;
  c.style.cssText+=`left:${(rnd()*W*0.8).toFixed(0)}px;top:${[120,250,90][i]*(ORIENT==='portrait'?1:0.8)}px;width:${cw}px;height:${ch}px;`;
  [[0,22,110,54],[70,0,120,64],[150,30,100,44]].forEach(([bx,by,bw,bh])=>{
    const b=document.createElement('b');
    b.style.cssText+=`left:${bx}px;top:${by}px;width:${bw}px;height:${bh}px;`;
    c.appendChild(b);
  });
  cloudsEl.appendChild(c);
  CL.push({el:c,x:parseFloat(c.style.left),y:parseFloat(c.style.top),sp:rnd()*7+5,w:cw});
}

/* ---------- kota: deretan gedung berjendela ---------- */
const townEl=document.getElementById('town');
const WINS=[]; /* jendela yang menyala saat senja */
{
  const cols=ORIENT==='portrait'
    ? [[0,200,'#F3E2C7',430],[200,200,'#E8D3F0',560],[400,220,'#D8ECF4',500],[620,200,'#F6D5D0',620],[820,260,'#E7EFE0',470]]
    : [[0,300,'#F3E2C7',420],[300,340,'#E8D3F0',500],[640,300,'#D8ECF4',400],[940,360,'#F6D5D0',540],[1300,320,'#E7EFE0',430],[1620,300,'#EFD9B8',470]];
  cols.forEach(([bx,bw,col,bh],bi)=>{
    const b=document.createElement('div');
    b.className='bld';
    b.style.cssText+=`left:${bx}px;width:${bw}px;height:${bh}px;background:${col};
      box-shadow:inset 0 -14px 0 rgba(0,0,0,.10);top:${P.bldBot-bh}px;`;
    const nx=Math.max(2,Math.floor(bw/110)), ny=Math.max(2,Math.floor(bh/190));
    for(let i=0;i<nx;i++)for(let j=0;j<ny;j++){
      const w=document.createElement('div');
      w.className='win';
      const wx=bx+22+i*((bw-44-(nx-1)*26)/nx)+i*26, wy=P.bldBot-bh+30+j*((bh-60-(ny-1)*40)/ny)+j*40;
      w.style.cssText+=`left:${wx}px;top:${wy}px;width:${(bw-44-(nx-1)*26)/nx}px;height:${Math.min(64,(bh-60-(ny-1)*40)/ny)}px;`;
      townEl.appendChild(w);
      if((i+j*nx)%3===1)WINS.push(w);
    }
    townEl.appendChild(b);
  });
}
/* plak nomor pintu 1 2 3 (hook, di muka gedung tengah) */
const PLQ=[];
['1','2','3'].forEach((g,i)=>{
  const p=document.createElement('div');
  p.className='plaque';
  p.style.cssText+=`left:${P.plqX0+i*P.plqGap}px;top:${P.plqY}px;width:${P.plqS}px;height:${P.plqS+8}px;opacity:0;`;
  const b=document.createElement('b');
  b.style.fontSize=Math.round(P.plqS*0.62)+'px';b.textContent=g;
  p.appendChild(b);townEl.appendChild(p);
  PLQ.push({el:p,t0:0.9+i*0.22});
});
/* tanda tanya merah (hook) */
const hQ=document.createElement('div');
hQ.className='center mono';
hQ.style.cssText+=`position:absolute;left:${P.qx}px;top:${P.qy}px;color:#E15B5B;font-weight:800;
  font-size:${P.qSize}px;opacity:0;text-shadow:0 6px 0 rgba(0,0,0,.25);`;
hQ.textContent='?';
townEl.appendChild(hQ);

/* ---------- empat jendela kedai berisi situasi nyata ---------- */
const SHOPS=[];
{
  const defs=[
    {x:P.shopX[0],t0:6.9,kind:'books'},
    {x:P.shopX[1],t0:8.85,kind:'thermo'},
    {x:P.shopX[2],t0:10.35,kind:'pizza'},
    {x:P.shopX[3],t0:10.45,kind:'pi'}
  ];
  defs.forEach((d,i)=>{
    const w=document.createElement('div');
    w.className='shopwin';
    w.style.cssText+=`left:${d.x}px;top:${P.shopY}px;width:${P.shopW}px;height:${P.shopH}px;opacity:0;`;
    const awn=document.createElement('div');
    awn.className='awn';
    awn.style.cssText+=`left:${d.x-8}px;top:${P.awnY}px;width:${P.shopW+16}px;height:${P.awnH}px;opacity:0;`;
    const chip=document.createElement('div');
    chip.className='chip';
    chip.style.cssText+=`left:${d.x+P.shopW*0.16}px;top:${P.shopY+P.shopH-40}px;width:${P.shopW*0.68}px;height:34px;
      font-size:${ORIENT==='portrait'?20:16}px;line-height:34px;opacity:0;`;
    townEl.appendChild(w);townEl.appendChild(awn);townEl.appendChild(chip);
    const sit=document.createElement('div');
    sit.className='sit';
    w.appendChild(sit);
    SHOPS.push({win:w,awn,sit,chip,t0:d.t0,kind:d.kind});
  });
  const [bw,bh]=[P.shopW,P.shopH];
  const S=SHOPS;
  /* kedai buku: lima buku bertumpuk */
  {
    const cols=['#E15B5B','#5B8FE1','#4FA35C','#F2C230','#A78BFA'];
    cols.forEach((c,i)=>{
      const b=document.createElement('div');
      b.style.cssText=`position:absolute;left:${bw*0.3-(i%2)*8}px;top:${bh-58-(i+1)*26}px;width:${bw*0.42-(i%2)*6}px;height:22px;
        border-radius:4px;background:${c};box-shadow:inset 0 -5px 0 rgba(0,0,0,.2);`;
      S[0].sit.appendChild(b);
    });
    S[0].chip.textContent='5 BUKU';
  }
  /* kafe dingin: termometer -5 derajat */
  {
    const tube=document.createElement('div');
    tube.style.cssText=`position:absolute;left:${bw*0.42}px;top:${bh*0.12}px;width:${bw*0.18}px;height:${bh*0.62}px;
      border-radius:99px;background:#FFFFFF;border:3px solid #B9C4D4;overflow:hidden;`;
    const red=document.createElement('div');
    red.style.cssText=`position:absolute;left:0;bottom:0;width:100%;height:38%;background:#E15B5B;`;
    tube.appendChild(red);S[1].sit.appendChild(tube);

  let i=0;

  const nxt=i+1<SUBS.length?SUBS[i+1][0]:52.4;
  const o=clamp(Math.min(seg(t,SUBS[i][0],0.25), 1-seg(t,nxt-0.14,0.14)),0,1);

/* ---------- RENDER PER FRAME ---------- */
const world=document.getElementById('world');
const flash=document.getElementById('flash');
const fade=document.getElementById('fade');
const skydusk=document.getElementById('skydusk');
let _roll=0,_mxPrev=null;
function renderFrame(t){
  const dk=seg(t,34.0,9.0);
  skydusk.style.opacity=dk.toFixed(3);
  /* bintang */
  for(const s of ST){
    s.el.style.opacity=(dk*(0.35+0.5*(0.5+0.5*Math.sin(t*s.sp+s.ph)))).toFixed(3);
  }
  /* awan drift */
  for(const c of CL){
    c.x+=c.sp*(1/30);
    if(c.x>W+c.w)c.x=-c.w-40;
    c.el.style.transform=`translateX(${c.x.toFixed(1)}px)`;
    c.el.style.opacity=(0.92*(1-dk*0.8)).toFixed(3);
  }
  /* kota & plaza: satu ide per layar */
  const plazaK=seg(t,16.6,0.6)*(1-seg(t,32.5,0.6))+seg(t,40.0,0.6);
  const pk=clamp(plazaK,0,1);
  plaza.style.opacity=(pk*0.9).toFixed(3);
  const townDim=1-0.62*pk;
  townEl.style.opacity=townDim.toFixed(3);
  TREES.forEach(tr=>{ tr.el.style.opacity=(1-0.5*pk).toFixed(3);
    tr.el.style.transform=`rotate(${(Math.sin(t*0.9+tr.ph)*1.2).toFixed(2)}deg)`; });
  /* lampu jalan menyala saat senja */
  LAMPS.forEach(l=>{
    l.glow.style.opacity=(dk*(0.55+0.2*Math.sin(t*2+l.ph))).toFixed(3);
  });
  /* jendela menyala hangat saat senja */
  if(WINS.length){
    const warm=dk*0.85;
    const r=Math.round(lerp(57,255,warm)), g=Math.round(lerp(80,217,warm)), b=Math.round(lerp(107,138,warm));
    const col=`rgb(${r},${g},${b})`;
    for(const w of WINS){ w.style.background=col; }
  }
  /* mobil lewat */
  for(const [p0,p1,dir,ci] of PASSES){
    const c=CARS[ci];
    const p=seg(t,p0,p1-p0);
    const on=t>=p0&&t<=p1?1:0;
    c.el.style.opacity=on;
    if(on){
      const x=dir>0?lerp(-c.w-60,W+60,p):lerp(W+60,-c.w-60,p);
      c.el.style.transform=`translateX(${x.toFixed(1)}px)`;
    }
  }
  /* plak 1 2 3 + tanda tanya (hook) */
  for(const p of PLQ){ popA(p.el,t,p.t0,0.5,8,0,6.5); }
  popA(hQ,t,4.9,0.7,9,0,6.5);

  /* jendela kedai (pasangan 1 pergi 10.15, pasangan 2 pergi 14.0) */
  const pOut=1-seg(t,10.15,0.3), pOut2=1-seg(t,14.0,0.3);
  SHOPS.forEach((s,i)=>{
    const o=seg(t,s.t0,0.45)*(i<2?pOut:pOut2);
    s.win.style.opacity=o.toFixed(3);
    s.win.style.transform=`translateY(${((1-eio(seg(t,s.t0,0.45)))*26).toFixed(1)}px)`;
    s.awn.style.opacity=o.toFixed(3);
    s.chip.style.opacity=(seg(t,s.t0+0.25,0.35)*(i<2?pOut:pOut2)).toFixed(3);
  });

  /* papan tulis kafe (S4) */
  popA(slate,t,36.7,0.6,6,0,40.15);

  /* ubin kelima kelompok (S2) & daftar keluarga (S3) */
  for(const tl of TILES){ popA(tl.el,t,tl.t0,0.5,7,0,25.7); }
  popA(famEl,t,25.9,0.55,5,0,33.0);
  for(const r of FAM_ROWS){
    r.el.style.opacity=seg(t,r.t0,0.45).toFixed(3);
  }

  /* mentor: menggelinding di trotoar antar stasiun (tidak menembus apa pun) */
  let bx=WAY[WAY.length-1][1];
  for(let k=0;k<WAY.length-1;k++){
    const [w0,x0]=WAY[k],[w1,x1]=WAY[k+1];
    if(t>=w0&&t<w1){ bx=lerp(x0,x1,eio(seg(t,w0,w1-w0))); break; }
  }
  if(t>=WAY[WAY.length-1][0])bx=WAY[WAY.length-1][1];
  if(_mxPrev===null)_mxPrev=bx;
  _roll+=(bx-_mxPrev)/(P.ballD/2)*(180/Math.PI);
  _mxPrev=bx;
  const ep=seg(t,0.6,0.55), ef=eoe(ep);
  let hy2=0, lrot=0, drot=0, txj=0;
  for(const [gs,gd,gt,ga] of GESTS){
    const d2=t-gs;
    if(d2>=0&&d2<gd){
      const p=d2/gd, w=Math.sin(p*Math.PI);
      if(gt==='tilt'||gt==='lean'){ lrot+=ga*w; }
      else if(gt==='nod'){ lrot+=ga*Math.sin(p*2*Math.PI); }
      else if(gt==='spin'){ drot+=ga*eio(p); }
      else if(gt==='count'){ hy2-=ga*Math.abs(Math.sin(p*5*Math.PI))*(1-p*0.2); }
      else if(gt==='shiver'){ txj=ga*Math.sin(p*40)*(1-p); }
      else if(gt==='jump'){ hy2-=ga*4*p*(1-p); }
    }
  }
  void ef;
  /* belah dua seragam (pizza 1/2 dan 1/2+1/2=1) */
  let bsa=1, bbo=0, bboff=0;
  for(const [s0,s1] of SPLIT){
    if(t>=s0&&t<s1){
      const p=(t-s0)/(s1-s0);
      const sp2=p<0.35? eio(p/0.35) : (p>0.7? 1-eio((p-0.7)/0.3) : 1);
      bsa=1-0.48*sp2;
      bbo=sp2;
      bboff=lerp(0,96,sp2);
    }
  }
  mentor.el.style.left=bx.toFixed(1)+'px';
  mentor.el.style.opacity=String(clamp(ep*3,0,1));
  mentor.el.style.top=(P.groundY-P.ballD+hy2).toFixed(1)+'px';
  mentor.el.style.transform=`translateX(${txj.toFixed(1)}px) rotate(${(_roll+lrot+drot).toFixed(2)}deg) scale(${bsa.toFixed(3)})`;
  msh.style.left=bx.toFixed(1)+'px';
  msh.style.top=(P.groundY-10)+'px';
  msh.style.opacity=String(clamp(ep*3,0,1)*clamp(0.42+hy2*0.006,0.18,0.5)*bsa);
  msh.style.transform=`scaleX(${clamp((1+hy2*0.004)*bsa,0.4,1.08).toFixed(3)})`;
  ballB.style.left=(bx+bboff).toFixed(1)+'px';
  ballB.style.top=(P.groundY-Math.round(P.ballD*0.52)+hy2)+'px';
  ballB.style.opacity=String(clamp(bbo,0,1));
  ballB.style.transform=`rotate(${(_roll*0.5).toFixed(1)}deg)`;
  /* percikan bintang */
  let spo=0;
  for(const [sa,sb] of SPARKS){
    if(t>=sa&&t<sb) spo=smz(t,sa,sb,0.35)*(0.65+0.2*Math.sin(t*7));
  }
  spark.style.opacity=String(clamp(spo,0,1));
  spark.style.left=(bx+62).toFixed(1)+'px';
  spark.style.top=(P.groundY-150+Math.sin(t*2)*4).toFixed(1)+'px';
  spark.style.transform=`rotate(${((t*28)%360).toFixed(0)}deg) scale(${(0.8+0.15*Math.sin(t*7)).toFixed(3)})`;

  /* kunang-kunang senja */
  const fz=seg(t,40.5,1.0)*(1-seg(t,51.2,0.6));
  for(const f of FF){
    const ox=Math.sin(t*f.sp+f.ph)*f.amp, oy=Math.cos(t*f.sp*0.8+f.ph)*f.amp*0.6;
    f.el.style.transform=`translate(${(f.x+ox).toFixed(1)}px,${(f.y+oy).toFixed(1)}px)`;
    f.el.style.opacity=(fz*(0.35+0.65*(0.5+0.5*Math.sin(t*2.2+f.ph)))).toFixed(3);
  }

  /* judul bab */
  for(let i=0;i<TITLES.length;i++){
    const o=TITLES[i];
    const tEnd=i+1<TITLES.length?TITLES[i+1].t0:51.4;
    const oin=seg(t,o.t0,0.35)*(1-seg(t,tEnd-0.25,0.3));
    const sc=1+0.035*Math.sin(clamp(seg(t,o.t0,0.7),0,1)*Math.PI);
    o.el.style.opacity=oin.toFixed(3);
    o.el.style.transform=`scale(${sc.toFixed(3)})`;
  }

  /* CTA: AKIOMIDA.COM hanya menyala di akhir, reveal tenang */
  popA(cta,t,40.9,0.7,6,0,51.6);
  const uo=seg(t,45.8,1.4);
  fUrl.style.opacity=uo.toFixed(3);
  fUrl.style.transform=`translateY(${((1-eio(uo))*14).toFixed(1)}px)`;
  fBar.style.width=(seg(t,48.6,1.8)*Math.max(0,P.ctaW-80)).toFixed(0)+'px';
  popA(fPill,t,47.5,0.6,6,0,51.6);

  renderSub(t);

  /* kamera tenang */
  const im=imp(t);
  const shx=Math.sin(t*47)*2.5*im, shy=Math.sin(t*39+1.7)*1.8*im;
  world.style.transform=`translate(${shx.toFixed(2)}px,${(shy+Math.sin(t*0.35)*3).toFixed(2)}px)`;
  flash.style.opacity=(im*0.07).toFixed(3);
  fade.style.opacity=String(clamp(1-seg(t,0.05,0.5),0,1)*0.96+clamp(seg(t,51.4,0.6),0,1));
}
renderFrame(0);
window.__ready=true;
</script>
</body>
</html>
