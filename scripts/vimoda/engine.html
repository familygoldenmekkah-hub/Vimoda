<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
/*__FONTS__*/
*{margin:0;padding:0;box-sizing:border-box;}
html,body{background:#000;overflow:hidden;}
#stage{position:relative;overflow:hidden;
  background:radial-gradient(120% 95% at 50% 8%, #101B2E 0%, #080C18 52%, #05070F 100%);
  font-family:'Poppins','DejaVu Sans',sans-serif;color:#E7EEF8;
  -webkit-font-smoothing:antialiased;}
.blob{position:absolute;border-radius:50%;filter:blur(90px);will-change:transform;}
#blobC{background:#0EA5E9;opacity:.30;}
#blobV{background:#8B5CF6;opacity:.26;}
#blobA{background:#F59E0B;opacity:.22;}
#grid{position:absolute;inset:0;
  background-image:linear-gradient(rgba(148,163,184,.05) 1px,transparent 1px),
                   linear-gradient(90deg,rgba(148,163,184,.05) 1px,transparent 1px);
  background-size:80px 80px;}
#world{position:absolute;inset:0;will-change:transform;transform-origin:50% 42%;}
#particles span{position:absolute;will-change:transform,opacity;font-family:'JetBrains Mono','DejaVu Sans Mono',monospace;color:#7DD3FC;}
.sweep{position:absolute;top:-12%;left:0;width:42%;height:124%;pointer-events:none;opacity:0;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.14),transparent);
  transform:translateX(-160%);}
#grain{position:absolute;inset:0;pointer-events:none;opacity:.04;mix-blend-mode:overlay;
  background-image:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="180" height="180"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><rect width="180" height="180" filter="url(%23n)" opacity="0.6"/></svg>');}
.scene{position:absolute;inset:0;will-change:transform,opacity;}
.card{background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.13);
  border-radius:26px;box-shadow:0 18px 60px rgba(0,0,0,.45);}
.chip{display:inline-block;border-radius:999px;border:1px solid rgba(34,211,238,.45);
  background:rgba(34,211,238,.09);color:#67E8F9;font-weight:600;letter-spacing:.28em;}
.grad{background:linear-gradient(92deg,#22D3EE 0%,#A78BFA 52%,#FBBF24 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;}
.vig{position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(92% 92% at 50% 44%, transparent 60%, rgba(0,0,0,.5) 100%);}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;}
#fade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;}
.mono{font-family:'JetBrains Mono','DejaVu Sans Mono',monospace;}
.center{text-align:center;}
.enpan{color:#64748B;font-weight:600;letter-spacing:.20em;}
.enword{color:#7488A6;font-weight:600;letter-spacing:.22em;}
.enchip{color:#64748B;font-weight:600;letter-spacing:.24em;}
/* dunia pixel: subtitle bar permanen ala referensi */
#subbar{position:absolute;border-radius:22px;background:rgba(8,12,22,.80);
  border:1px solid rgba(255,255,255,.10);box-shadow:0 12px 40px rgba(0,0,0,.5);}
#sub_id{font-weight:700;color:#FFFFFF;}
#sub_en{font-weight:600;color:#8FA3BF;}
/* gelembung reaksi tokoh */
.bubble{position:absolute;background:#F8FAFC;color:#111827;border-radius:16px;
  font-weight:700;box-shadow:0 8px 24px rgba(0,0,0,.4);}
.bubble:after{content:'';position:absolute;left:26px;bottom:-10px;width:0;height:0;
  border-left:11px solid transparent;border-right:11px solid transparent;border-top:11px solid #F8FAFC;}
.starclip{background:linear-gradient(180deg,#FDE68A,#D97706);
  -webkit-clip-path:polygon(50% 0%,61.8% 35.2%,98.2% 35.2%,68.2% 57.2%,79.2% 91.2%,50% 70.2%,20.8% 91.2%,31.8% 57.2%,1.8% 35.2%,38.2% 35.2%);
  clip-path:polygon(50% 0%,61.8% 35.2%,98.2% 35.2%,68.2% 57.2%,79.2% 91.2%,50% 70.2%,20.8% 91.2%,31.8% 57.2%,1.8% 35.2%,38.2% 35.2%);}
</style>
</head>
<body>
<div id="stage">
  <div class="blob" id="blobC"></div>
  <div class="blob" id="blobV"></div>
  <div class="blob" id="blobA"></div>
  <div id="grid"></div>
  <div id="world">
    <div id="particles"></div>

    <!-- S0 HOOK -->

    <div class="scene" id="s4">
      <div class="card" id="e_big" style="position:absolute;">

      </div>
      <div class="card" id="e_eq" style="position:absolute;">
        <div class="starclip" id="e_eq_s"></div>
        <div class="mono" id="e_eq_t" style="font-weight:800;color:#FBBF24;"> + 2 = 9</div>
      </div>
      <div class="center" id="e_eqlab" style="position:absolute;left:0;right:0;color:#FBBF24;font-weight:700;letter-spacing:.22em;">NILAINYA TETAP 9</div>
    </div>

    <!-- S5 CTA -->
    <div class="scene" id="s5">
      <div class="card" id="f_card" style="position:absolute;">
        <div class="center" id="f_open" style="color:#94A3B8;font-weight:600;letter-spacing:.30em;">BUKA BROWSER KAMU</div>
        <div class="center enchip" id="f_open_e">OPEN YOUR BROWSER</div>
        <div class="center" id="f_url" style="font-weight:800;"><span class="grad" id="f_url_t">AKIOMIDA.COM</span></div>
        <div id="f_bar" style="height:5px;border-radius:99px;background:linear-gradient(90deg,#22D3EE,#A78BFA,#FBBF24);width:0;"></div>
      </div>
    </div>

    <!-- dunia pixel: panggung tokoh + subtitle (tidak ikut push-pan) -->
    <div id="pixworld">
      <div id="plat"></div>
      <div id="sheepA"></div>
      <div id="sheepB"></div>
      <div id="ballsh"></div>
      <div id="ball"></div>
      <div id="spark"></div>
      <div class="bubble center" id="bub" style="opacity:0;"></div>
    </div>

    <div id="subbar">
      <div class="center" id="sub_id"></div>
      <div class="center" id="sub_en"></div>
    </div>

    <div class="center" id="wm" style="position:absolute;color:#7C8BA1;font-weight:600;letter-spacing:.40em;opacity:.5;">AKIOMIDA</div>
  </div>
  <div class="vig"></div>
  <div id="grain"></div>
  <div id="flash"></div>
  <div id="fade"></div>
</div>

<script>
const Q=new URLSearchParams(location.search);
const ORIENT=Q.get('o')||'landscape';
const W=ORIENT==='portrait'?1080:1920;
const H=ORIENT==='portrait'?1920:1080;

/* v09 (revisi 4): dunia cerita pixel ala referensi.
   - tokoh pixel tetap di panggung bawah sepanjang video (penggembala + domba)
   - subtitle bar permanen (ID putih tebal + EN kecil) membawa narasi
   - teks scene dirampingkan; label penjelas tetap ada
   - semua kunci P unik (anti-tumpuk warisan revisi 2) */
const P = ORIENT==='portrait' ? {
  mx:84, wmY:60, wmSize:18,
  h1Y:230, h1Size:170, h1BoxW:160, h1BoxH:210,
  qX:680, qY:250, qSize:110,
  cardY:520, cardH:210, cardW:288, cardGap:20,
  cardGSize:52, cardLab:20, cardEn:12,
  platX:100, platW:520, groundY:1230, ballX:[170,215,170,255,200,240], sheepX:470, sheepX2:560, bubY:1006,
  chapY:200, chapSize:22,
  wordY:300, wordSize:88,
  cardY1:560, cardH1:310, cardW1:680,
  markY:80, markW:9, markH:78, markStep:20, gGap:44, strikeH:8, strikeW:84,
  tlabY:190, tlabSize:26, tlabEY:232, tlabESize:13, tsubY:262, tsubSize:14,
  digY:500, digH:120, digW:80, digGap:10, digSize:46,
  ntpY:660, ntpH:160, ntpW:280, ntpGap:20, ntpDSize:50, ntpLab:17, ntpEn:11, tagSize:28,
  bTakeY:930, bTakeSize:46, markBarW:420,
  boxY:560, boxH:310, boxW:880, eqSize2:76, eqSize3:64, morphTop:90, stagLabY:214, stagLabSize:20,
  bigY:280, bigH:220, bigW:220, bigStar:130,
  eqY:570, eqH:150, eqW:560, eqStar:70, eqTSize:54, eqLabY:762, eqLabSize:22,
  cardY2:380, card2H2:360, cardW2:900,
  openY:96, openEY:134, openESize:13, urlY:190, urlSize:84, barY:300,
  subbarY:1300, subbarH:128, subIdSize:32, subEnSize:21, subbarMX:130
} : {
  mx:200, wmY:56, wmSize:18,
  h1Y:130, h1Size:170, h1BoxW:160, h1BoxH:210,
  qX:1160, qY:150, qSize:110,
  cardY:420, cardH:210, cardW:310, cardGap:30,
  cardGSize:52, cardLab:20, cardEn:12,
  platX:240, platW:420, groundY:828, ballX:[300,350,300,360,320,360], sheepX:520, sheepX2:590, bubY:690,
  chapY:130, chapSize:22,
  wordY:228, wordSize:86,
  cardY1:470, cardH1:310, cardW1:760,
  markY:80, markW:9, markH:78, markStep:20, gGap:44, strikeH:8, strikeW:84,
  tlabY:190, tlabSize:28, tlabEY:234, tlabESize:14, tsubY:266, tsubSize:14,
  digY:490, digH:130, digW:84, digGap:12, digSize:48,
  ntpY:650, ntpH:170, ntpW:290, ntpGap:24, ntpDSize:52, ntpLab:18, ntpEn:11, tagSize:30,
  bTakeY:838, bTakeSize:46, markBarW:520,
  boxY:470, boxH:300, boxW:1100, eqSize2:74, eqSize3:64, morphTop:78, stagLabY:208, stagLabSize:21,
  bigY:200, bigH:220, bigW:220, bigStar:130,
  eqY:480, eqH:150, eqW:600, eqStar:70, eqTSize:54, eqLabY:672, eqLabSize:22,
  cardY2:300, card2H2:360, cardW2:950,
  openY:96, openEY:134, openESize:13, urlY:190, urlSize:88, barY:300,
  subbarY:916, subbarH:96, subIdSize:30, subEnSize:19, subbarMX:320
};

const stage=document.getElementById('stage');
stage.style.width=W+'px'; stage.style.height=H+'px';
const MX=P.mx;
function tx(el,y,size){
  el.style.position='absolute';
  el.style.left=MX+'px';el.style.right=MX+'px';
  el.style.top=y+'px';el.style.fontSize=size+'px';
}

/* ---------- easing ---------- */
const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,p)=>a+(b-a)*p;
const seg=(t,a,d)=>clamp((t-a)/d,0,1);
const eoc=p=>{p=clamp(p,0,1);return 1-Math.pow(1-p,3);};
const eoe=p=>{p=clamp(p,0,1);return p>=1?1:1-Math.pow(2,-10*p);};
const eio=p=>{p=clamp(p,0,1);return p<0.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2;};
const backOS=(p,s=1.7)=>{p=clamp(p,0,1);const c=s;return 1+(c+1)*Math.pow(p-1,3)+c*Math.pow(p-1,2);};
const smz=(t,a,b,f=.6)=>{return clamp((t-a)/f,0,1)*clamp((b-t)/f,0,1);};

/* blobs */
const blobC=document.getElementById('blobC');
const blobV=document.getElementById('blobV');
const blobA=document.getElementById('blobA');
const BS=ORIENT==='portrait'?820:720;
blobC.style.width=BS+'px';blobC.style.height=BS+'px';
blobC.style.left=(-BS*0.28)+'px';blobC.style.top=(ORIENT==='portrait'?-BS*0.30:-BS*0.34)+'px';
blobV.style.width=(BS*1.05)+'px';blobV.style.height=(BS*1.05)+'px';
blobV.style.right=(-BS*0.32)+'px';blobV.style.bottom=(ORIENT==='portrait'?-BS*0.16:-BS*0.34)+'px';
blobA.style.width=(BS*0.7)+'px';blobA.style.height=(BS*0.7)+'px';
blobA.style.left=(W/2-BS*0.35)+'px';
blobA.style.top=(ORIENT==='portrait'?H*0.34:H*0.42)+'px';

/* partikel ambient */
const parts=document.getElementById('particles');
const mulberry=(s)=>()=>{s|=0;s=s+0x6D2B79F5|0;let z=Math.imul(s^s>>>15,1|s);z=z+Math.imul(z^z>>>7,61|z)^z;return((z^z>>>14)>>>0)/4294967296;};
const rnd=mulberry(20261114);
const CH='0123456789+=/VX\u00BD\u00B0\u00D7';
const NP=22, PA=[];
for(let i=0;i<NP;i++){
  const el=document.createElement('span');
  el.textContent=CH[Math.floor(rnd()*CH.length)];
  el.style.fontSize=(16+rnd()*26).toFixed(0)+'px';
  el.style.fontWeight=(rnd()<.3?'700':'400');
  parts.appendChild(el);
  PA.push({el, x:rnd()*W, y0:rnd()*H, sp:6+rnd()*12, wf:.3+rnd()*.7, ph:rnd()*6.28, o:.14+rnd()*.18});
}

/* wm di atas (ala logo aplikasi pada referensi) */
const wm=document.getElementById('wm');
wm.style.fontSize=P.wmSize+'px';
if(ORIENT==='portrait'){wm.style.top=P.wmY+'px';wm.style.left='0';wm.style.right='0';}
else{wm.style.top=P.wmY+'px';wm.style.right='70px';wm.style.left='auto';}

/* ---------- pembangun dunia pixel ---------- */
function pxBlock(parent,x,y,w,h,c,extra){
  const d=document.createElement('div');
  d.style.cssText=`position:absolute;left:${x}px;top:${y}px;width:${w}px;height:${h}px;background:${c};${extra||''}`;
  parent.appendChild(d);
  return d;
}
function buildSheep(host,x,s){
  const el=document.createElement('div');
  el.style.cssText=`position:absolute;left:${x}px;top:${P.groundY}px;transform:scale(${s});transform-origin:0 100%;will-change:transform,opacity;opacity:0;`;
  pxBlock(el,8,-14,9,14,'#334155','border-radius:4px;');
  pxBlock(el,29,-14,9,14,'#334155','border-radius:4px;');
  pxBlock(el,0,-38,46,26,'#F1F5F9','border-radius:46%;');
  pxBlock(el,7,-44,30,11,'#F8FAFC','border-radius:46%;');
  pxBlock(el,36,-50,17,17,'#334155','border-radius:50%;');
  pxBlock(el,46,-42,4,4,'#94A3B8','border-radius:50%;');
  host.appendChild(el);
  return el;
}
/* karakter kita: bulatan emas tanpa wajah tanpa mata - unik, lucu, gemoy */
function buildGoldBall(host,x){
  const el=document.createElement('div');
  el.style.cssText=`position:absolute;left:${x}px;top:${P.groundY}px;width:88px;height:88px;margin-left:-44px;transform-origin:50% 100%;will-change:transform,opacity,left;opacity:0;`;
  const core=document.createElement('div');
  core.style.cssText='position:absolute;left:0;top:-88px;width:88px;height:88px;border-radius:50%;background:radial-gradient(circle at 33% 27%, #FFF3C4 0%, #FCD34D 34%, #F59E0B 68%, #B45309 100%);box-shadow:inset -6px -10px 18px rgba(120,53,15,.35), 0 0 44px rgba(251,191,36,.28);';
  el.appendChild(core);
  const shine=document.createElement('div');
  shine.style.cssText='position:absolute;left:16px;top:-78px;width:28px;height:16px;border-radius:50%;background:rgba(255,255,255,.72);filter:blur(2px);transform:rotate(-24deg);';
  el.appendChild(shine);
  const sweat=document.createElement('div');
  sweat.style.cssText='position:absolute;left:66px;top:-100px;width:11px;height:15px;background:#7DD3FC;border-radius:2px 2px 60% 60%;opacity:0;will-change:transform,opacity;';
  el.appendChild(sweat);
  host.appendChild(el);
  return {el,core,shine,sweat};
}
function buildShadow(host,x){
  const el=document.createElement('div');
  el.style.cssText=`position:absolute;left:${x}px;top:${P.groundY-7}px;width:78px;height:15px;margin-left:-39px;border-radius:50%;background:radial-gradient(ellipse at center, rgba(0,0,0,.5) 0%, rgba(0,0,0,0) 72%);filter:blur(2px);opacity:0;will-change:transform,opacity,margin-left;`;
  host.appendChild(el);
  return el;
}
function buildSpark(host){
  const el=document.createElement('div');
  el.className='starclip';
  el.style.cssText=`position:absolute;left:0;top:0;width:30px;height:30px;opacity:0;will-change:transform,opacity;filter:drop-shadow(0 0 12px rgba(253,230,138,.8));`;
  host.appendChild(el);
  return el;
}
function buildPlatform(host){
  const el=document.createElement('div');
  el.style.cssText=`position:absolute;left:${P.platX}px;top:${P.groundY}px;width:${P.platW}px;height:32px;opacity:0;will-change:opacity,transform;`;
  pxBlock(el,0,0,P.platW,22,'#6B4A2B');
  pxBlock(el,0,0,P.platW,10,'#4ADE80');
  pxBlock(el,40,12,18,10,'#5A3E23');
  pxBlock(el,140,12,24,10,'#5A3E23');
  pxBlock(el,250,12,18,10,'#5A3E23');
  /* rumput hias bergoyang + bunga pixel */
  const deco=[];
  const tuft=(x,y)=>{
    const g=document.createElement('div');
    g.style.cssText=`position:absolute;left:${x}px;top:${y}px;width:16px;height:14px;transform-origin:50% 100%;will-change:transform;`;
    pxBlock(g,2,3,3,11,'#22C55E','border-radius:2px;');
    pxBlock(g,7,0,3,14,'#16A34A','border-radius:2px;');
    pxBlock(g,12,4,3,10,'#22C55E','border-radius:2px;');
    el.appendChild(g);
    deco.push({el:g, ph:deco.length*1.7});
  };
  tuft(66,-12); tuft(310,-12); tuft(452,-12);
  const fl=document.createElement('div');
  fl.style.cssText=`position:absolute;left:196px;top:-24px;width:12px;height:24px;transform-origin:50% 100%;will-change:transform;`;
  pxBlock(fl,4,10,3,14,'#16A34A','border-radius:2px;');
  pxBlock(fl,1,2,9,9,'#F472B6','border-radius:3px;');
  pxBlock(fl,4,5,3,3,'#FDE68A','border-radius:50%;');
  el.appendChild(fl);
  deco.push({el:fl, ph:2.6});
  host.appendChild(el);
  return {el, deco};
}
const BALL_XS=P.ballX;
const ball=buildGoldBall(document.getElementById('ball'),BALL_XS[0]);
const ballsh=buildShadow(document.getElementById('ballsh'),BALL_XS[0]);
const spark=buildSpark(document.getElementById('spark'));
const sheep1=buildSheep(document.getElementById('sheepA'),P.sheepX,0.85);
const sheep2=buildSheep(document.getElementById('sheepB'),P.sheepX2,0.7);
const plat=buildPlatform(document.getElementById('plat'));
const bub=document.getElementById('bub');
bub.style.left=(BALL_XS[0]+26)+'px';bub.style.top=P.bubY+'px';
bub.style.fontSize=(ORIENT==='portrait'?24:22)+'px';
bub.style.padding='10px 22px';
/* skala dunia pixel: jangkar di garis tanah agar tokoh terasa hadir */
const pixworld=document.getElementById('pixworld');
const PWSC=ORIENT==='portrait'?1.35:1.2;
pixworld.style.transformOrigin=`0px ${P.groundY+32}px`;
pixworld.style.transform=`scale(${PWSC})`;

/* subtitle bar permanen */
const subbar=document.getElementById('subbar');
const subId=document.getElementById('sub_id');

function sweepAny(sw,t,tss,amp=0.85){
  let p=-1;

  }
  if(p<0){if(sw.style.opacity!=='0')sw.style.opacity='0';return;}
  sw.style.opacity=String(amp*(1-Math.abs(p*2-1)));
  sw.style.transform=`translateX(${lerp(-160,260,p).toFixed(1)}%)`;
}

/* kamera */
const CUTS=[6.0,14.4,25.2,34.8,43.2];
const IMPACTS=[[0.5,0.5],[21.0,0.15],[32.2,0.42],[40.2,0.28],[45.3,0.28],[48.7,0.28]];
function imp(t){
  let a=0;
  for(const [it,ia] of IMPACTS){
    const d=t-it;
    if(d>=0&&d<0.4)a=Math.max(a,ia*(1-d/0.4));
  }
  return a;
}
function camScale(t){
  let base=1.0;
  for(let i=0;i<CUTS.length+1;i++){
    const a=i===0?0:CUTS[i-1];
    const b=i===CUTS.length?52:CUTS[i];
    if(t>=a&&t<b){
      const p=(t-a)/(b-a);
      base=0.992+0.036*eio(clamp(p*1.1,0,1));
      break;
    }
  }
  return base+imp(t)*0.015;
}
function slideScene(el,t,tIn,tOut){
  let x=0, op=1;
  const pin=seg(t,tIn,0.6);
  x=(1-eoc(pin))*W;
  const pout=seg(t,tOut,0.6);
  if(pout>0){
    x=-eoc(pout)*W;
    op=1-eoc(clamp(pout*1.8,0,1));
  }
  el.style.transform=`translateX(${x.toFixed(1)}px)`;
  el.style.opacity=op.toFixed(3);
}

  for(let i=0;i<NP;i++){
    const p=PA[i];
    const yy=((p.y0 - t*p.sp)%(H+140)+H+140)%(H+140)-70;
    p.el.style.transform=`translate(${(p.x+Math.sin(t*p.wf+p.ph)*20).toFixed(1)}px,${yy.toFixed(1)}px)`;
    p.el.style.opacity=(p.o*zone*(0.75+0.25*Math.sin(t*1.1+p.ph))).toFixed(3);
  }

  renderSub(t);

  /* panggung pixel: bulatan emas + domba tetap hadir sepanjang video */
  popA(plat.el,t,0.3,0.6,24,0.9,1.6);
  plat.deco.forEach(d=>{ d.el.style.transform=`rotate(${(Math.sin(t*1.7+d.ph)*6).toFixed(2)}deg)`; });
  popA(sheep1,t,1.6,0.6,20,0.8,1.8);
  popA(sheep2,t,2.0,0.6,20,0.8,1.8);
  const sheepFade=1-seg(t,14.0,0.4);
  sheep1.style.opacity=String(parseFloat(sheep1.style.opacity||'0')*sheepFade);
  sheep2.style.opacity=String(parseFloat(sheep2.style.opacity||'0')*sheepFade);
  /* bulatan emas: menggelinding antar bab, napas squash-stretch, lompat di beat */
  let sidx=0;
  for(let k=0;k<SCENE_T.length;k++){ if(t>=SCENE_T[k]) sidx=k; }
  let bx=BALL_XS[0];
  if(sidx>0){
    bx=lerp(BALL_XS[sidx-1],BALL_XS[sidx],eio(seg(t,SCENE_T[sidx]+0.25,0.9)));
  }
  const ep=seg(t,0.6,0.55), ef=eoe(ep);
  const lq=Math.exp(-Math.pow((ep-0.94)/0.05,2));
  const brs=Math.sin(t*9.4)*0.035;
  let hy=0, hsq=0;
  for(const [hs,hh] of HOPS){
    const d=t-hs;
    if(d>=0&&d<0.8){
      const p=d/0.8;
      hy-=hh*4*p*(1-p);
      hsq+=0.16*Math.sin(p*Math.PI)-(p<0.14?(1-p/0.14)*0.12:0)-(p>0.82?((p-0.82)/0.18)*0.16:0);
    }
  }
  let sway=0;
  if(t>=11.5&&t<14.2) sway=Math.sin((t-11.5)*2.2)*7;
  const wig=Math.sin(t*16)*6*seg(t,48.7,0.3);
  const sy2=1+brs+hsq-lq*0.16, sx2=1-(brs+hsq)*0.75+lq*0.10;
  ball.el.style.left=(bx+sway).toFixed(1)+'px';
  ball.el.style.opacity=String(clamp(ep*3,0,1));
  ball.el.style.transform=`translateY(${((1-ef)*-250+hy).toFixed(1)}px) rotate(${wig.toFixed(2)}deg) scale(${sx2.toFixed(3)},${sy2.toFixed(3)})`;
  ballsh.style.left=bx.toFixed(1)+'px';
  ballsh.style.opacity=String(clamp(ep*3,0,1)*clamp(0.42+hy*0.006,0.18,0.5));
  ballsh.style.transform=`scaleX(${clamp(1+hy*0.004,0.8,1.08).toFixed(3)})`;
  const sweatOn=(t>=10.2&&t<12.2)?1:0;
  ball.sweat.style.opacity=String(sweatOn*0.9);
  ball.sweat.style.transform=`translateY(${(sweatOn?((t-10.2)*16)%24:0).toFixed(1)}px)`;
  let spo=0;
  for(const [sa,sb] of SPARKS){
    if(t>=sa&&t<sb) spo=smz(t,sa,sb,0.35)*(0.65+0.35*Math.sin(t*11));
  }
  spark.style.opacity=String(clamp(spo,0,1));
  spark.style.left=(bx+36).toFixed(1)+'px';
  spark.style.top=(P.groundY-152+Math.sin(t*3)*6).toFixed(1)+'px';
  spark.style.transform=`rotate(${((t*40)%360).toFixed(0)}deg) scale(${(0.8+0.25*Math.sin(t*9)).toFixed(3)})`;
  let sh1=0, sh2=0;
  const sd=t-3.6; if(sd>=0&&sd<0.6) sh1=-56*(sd/0.6)*(1-sd/0.6);
  const sd2=t-8.6; if(sd2>=0&&sd2<0.6) sh2=-56*(sd2/0.6)*(1-sd2/0.6);
  const bob1=Math.floor((t*2.6)%2)*-3;
  sheep1.style.transform=`scale(0.85) translateY(${(bob1+sh1).toFixed(1)}px)`;
  const bob2=Math.floor((t*2.6+0.5)%2)*-3;
  sheep2.style.transform=`scale(0.7) translateY(${(bob2+sh2).toFixed(1)}px)`;
  if(ORIENT==='portrait') bub.style.left=(bx+sway+26).toFixed(1)+'px';
  else bub.style.left='80px';
  /* gelembung reaksi */
  let bo=0, bs=1, btxt='';
  for(const [b0,b1,tx3] of BUBS){
    if(t>=b0&&t<b1){
      btxt=tx3;
      const p=eio(seg(t,b0,0.25));
      bo=1-seg(t,b1-0.2,0.2);
      bs=0.6+0.4*backOS(p,2.0);
    }
  }
  bub.style.opacity=String(clamp(bo,0,1));
  bub.style.transform=`scale(${bs.toFixed(3)})`;
  if(btxt&&bub.textContent!==btxt)bub.textContent=btxt;

  /* S0 0-6.6 */
  const s0=document.getElementById('s0');
  slideScene(s0,t,-3,5.7);
  popA(h1,t,0.5,0.8,44,1.35,1.35);
  hQ.style.opacity=String(clamp(backOS(seg(t,4.9,0.5),2.0),0,1));
  hQ.style.transform=`translateY(${((1-clamp(backOS(seg(t,4.9,0.5),2.0),0,1))*28).toFixed(2)}px)`;
  H0C.forEach((el,i)=>{
    popA(el,t,1.0+i*0.45,0.6,36,0.84,1.7);
    sweepAny(SWEEPS0[i],t,[1.62+i*0.45]);
  });

  /* S1 6.0-14.4 */
  const s1=document.getElementById('s1');
  slideScene(s1,t,6.0,14.1);
  wipeChip(aChapT,t,6.7);
  aChap.style.opacity=String(clamp(seg(t,6.7,0.3)*2,0,1));
  headIn(aWord,t,7.2,0.10);
  popA(aCard,t,8.2,0.7,30,0.9,1.6);
  M7.forEach((m,i)=>{
    popA(m.el,t,m.ts,0.5,18,0.7,2.0);
    if(m.strike){
      const p=seg(t,m.strike.ts,0.35);
      m.strike.el.style.opacity=String(p);
      m.strike.el.style.transform=`rotate(-55deg) scaleX(${Math.max(p,0.001).toFixed(3)})`;
    }
  });
  sweepAny(aCardSw,t,[9.9]);
  const alp=eoe(seg(t,10.1,0.5));
  const cnt=Math.floor(eio(seg(t,10.1,0.45))*347);
  aTl.textContent = t<10.55 ? `${cnt} = ${cnt} GORESAN` : '347 = 347 GORESAN';
  aTl.style.opacity=String(alp);
  aTl.style.transform=`translateY(${((1-alp)*14).toFixed(2)}px)`;
  aTlE.textContent = t<10.55 ? `${cnt} = ${cnt} MARKS` : '347 = 347 MARKS';
  const alpe=eoe(seg(t,10.25,0.5));
  aTlE.style.opacity=String(alpe*0.95);
  aTlE.style.transform=`translateY(${((1-alpe)*10).toFixed(2)}px)`;
  const asub=eoe(seg(t,11.0,0.5));
  aTsub.style.opacity=String(asub*0.95);
  aTsub.style.transform=`translateY(${((1-asub)*10).toFixed(2)}px)`;

  /* S2 14.4-25.2 */
  const s2=document.getElementById('s2');
  slideScene(s2,t,14.4,24.9);
  wipeChip(bChapT,t,15.1);
  bChap.style.opacity=String(clamp(seg(t,15.1,0.3)*2,0,1));
  headIn(bWord,t,15.6,0.10);
  DT.forEach((el,i)=>{
    popA(el,t,16.8+i*0.08,0.5,24,0.8,2.0);
    if(i===5)sweepAny(DSWEEP,t,[17.6]);
  });
  N3.forEach((o,i)=>{
    popA(o.el,t,19.2+i*0.9,0.55,30,0.85,1.8);
    sweepAny(o.sw,t,[19.8+i*0.9]);
  });
  TAGS.forEach((o,i)=>{
    const p=seg(t,o.ts,0.9);
    const pin=eoe(seg(t,o.ts,0.3));
    o.el.style.opacity=String(pin*(1-Math.pow(p,2)));
    o.el.style.transform=`translateY(${((1-pin)*16-p*34).toFixed(2)}px)`;
  });
  fadeUp(bTake,t,22.8,0.7,26);
  bMark.style.transform=`scaleX(${eio(seg(t,23.0,0.7)).toFixed(3)})`;

  /* S3 25.2-34.8 */
  const s3=document.getElementById('s3');
  slideScene(s3,t,25.2,34.5);
  wipeChip(cChapT,t,25.9);
  cChap.style.opacity=String(clamp(seg(t,25.9,0.3)*2,0,1));
  headIn(cWord,t,26.4,0.10);
  popA(cBox,t,27.6,0.7,30,0.9,1.6);
  const st=stageIdx(t);
  const m=STAGE_TXT[st];
  cMorph.textContent=m.t;
  cMorph.className='center mono';
  cMorph.style.color=m.col||'';
  cMorph.classList.toggle('grad',st===3);
  cMorph.style.fontSize=(m.g?P.eqSize3:P.eqSize2)+'px';
  let mo=1, mty=0, msx=1, msy=1;
  for(const s of [29.0,30.6,32.2]){
    const pre=s-t;
    if(pre>0&&pre<=0.12){
      const q=1-pre/0.12;
      mty=-9*q; msy=1-0.07*q; msx=1+0.04*q;
    }
    const d=t-s;
    if(d>=0&&d<0.36){
      const e=backOS(d/0.36,2.0);
      mo=clamp((d/0.36)*2.4,0,1);
      msy=e; msx=e*1.02;
    }
  }
  cMorph.style.opacity=String(mo);
  cMorph.style.transform=`translateY(${mty.toFixed(2)}px) scale(${msx.toFixed(3)},${msy.toFixed(3)})`;
  const slp=eoe(seg(t,27.9,0.4));
  let slo=slp, slty=0;
  for(const s of [29.0,30.6,32.2]){
    const d=t-s;
    if(d>=0&&d<0.3){slo=slp*eio(d/0.3); slty=(1-eio(d/0.3))*8;}
  }
  cStage.textContent=STAGE_LAB[st];
  cStage.style.color=st===3?'#FBBF24':'#94A3B8';
  cStage.style.opacity=String(slo*0.95);
  cStage.style.transform=`translateY(${slty.toFixed(2)}px)`;
  const glowC=st===1?'rgba(125,211,252,':st===2?'rgba(167,139,250,':'rgba(251,191,36,';
  cBox.style.boxShadow=`0 18px 60px rgba(0,0,0,.45), 0 0 ${(28+16*Math.sin(t*3)).toFixed(0)}px ${glowC}${(0.09+0.04*Math.sin(t*3)).toFixed(3)})`;

  /* S4 34.8-43.2 */
  const s4=document.getElementById('s4');
  slideScene(s4,t,34.8,42.9);
  popA(eBig,t,35.5,0.8,40,1.3,1.4);
  sweepAny(eBigSw,t,[36.3]);
  popA(eEq,t,38.2,0.7,30,0.88,1.6);
  sweepAny(eEqSw,t,[38.6]);
  fadeUp(eEqLab,t,39.0,0.6,18);

  /* S5 43.2-52 */
  const s5=document.getElementById('s5');
  slideScene(s5,t,43.2,51.9);
  popA(fCard,t,47.8,0.8,40,0.88,1.5);
  fCard.style.boxShadow=`0 18px 60px rgba(0,0,0,.45), 0 0 ${(38+20*Math.sin(t*3.6)).toFixed(0)}px rgba(34,211,238,${(0.10+0.05*Math.sin(t*3.6)).toFixed(3)})`;
  const up=eoe(seg(t,48.7,0.9));
  const fUrlT=document.getElementById('f_url_t');
  fUrlT.style.letterSpacing=lerp(0.30,0.06,up)+'em';
  fUrlT.style.opacity=String(up);
  fBar.style.width=(FW*0.68*eoe(seg(t,49.3,0.8)))+'px';
  const per=[];for(let ts=48.2;ts<51.6;ts+=2.6)per.push(ts);
  sweepAny(fCardSw,t,per,0.75);

  flash.style.opacity=(im*0.14).toFixed(3);
  fade.style.opacity=(seg(t,51.3,0.7)*0.94).toFixed(3);
}

renderFrame(0);
window.renderFrame=renderFrame;
window.__ready=true;
</script>
</body>
</html>
