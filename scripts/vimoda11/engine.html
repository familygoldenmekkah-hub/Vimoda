<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
/*__FONTS__*/
*{box-sizing:border-box}
body{margin:0;background:#120C08;font-family:'Poppins','Noto Sans',sans-serif;-webkit-font-smoothing:antialiased}
#stage{position:relative;overflow:hidden}
#world{position:absolute;inset:0}
#flash{position:absolute;inset:0;background:#FFFFFF;opacity:0;pointer-events:none}
#fade{position:absolute;inset:0;background:#120C08;opacity:0;pointer-events:none}
.center{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.mono{font-family:'JetBrains Mono','DejaVu Sans Mono',monospace}
/* RUMAH PETA KARTIKA: ruang kartografi vintage - kertas peta tua krem dengan
   grid tinta biru samar, meja mahoni dengan peta terbuka dan pita angka pi
   yang digitnya muncul satu per satu, kompas kuningan raksasa di dinding,
   lampu gantung ber-tudung hijau, lantai papan kayu dengan karpet marun,
   rak kartu katalog, segel lilin merah.
   Latar BERBEDA TOTAL dari Dapoer Posya, Menara Livo, dan semua episode lain
   (aturan 26). Karakter: HANYA bola emas mentor, bulat sejati, tanpa mata
   (aturan 23). Subjudul zona aman maksimal dua baris (aturan 27);
   watermark AKIOMIDA di tepi paling bawah (aturan 24); penutup bersih
   (aturan 28). */
#mapwall{position:absolute;left:0;top:0;width:100%;
  background:repeating-linear-gradient(0deg,rgba(44,74,110,.16) 0 2px,transparent 2px 96px),
  repeating-linear-gradient(90deg,rgba(44,74,110,.16) 0 2px,transparent 2px 112px),
  linear-gradient(180deg,#F2E9D2 0%,#E8DCC0 100%)}
#tilesun{position:absolute;inset:0;background:rgba(58,38,26,0);will-change:background}
#ceiling{position:absolute;left:0;top:0;width:100%}
#ceiling .beam{position:absolute;background:linear-gradient(180deg,#6E4A32,#543622);border-radius:0 0 8px 8px;box-shadow:0 4px 10px rgba(20,10,4,.25)}
.lampW{position:absolute;will-change:opacity}
.lampW .cord{position:absolute;width:4px;background:#3A2C1E}
.lampW .shade{position:absolute;border-radius:12px 12px 0 0;background:linear-gradient(180deg,#3E7A62,#2E5E4E);box-shadow:0 8px 18px rgba(30,16,6,.3)}
.lampW .glow{position:absolute;border-radius:50%;background:radial-gradient(circle,rgba(255,236,180,.75),rgba(255,236,180,0) 70%)}
#compass{position:absolute;will-change:opacity}
#compass .rim{position:absolute;border-radius:50%;background:conic-gradient(#D9B36A,#A87E36,#D9B36A,#A87E36,#D9B36A);box-shadow:0 10px 24px rgba(30,16,6,.35)}
#compass .face{position:absolute;border-radius:50%;background:radial-gradient(circle at 40% 32%,#FBF3DC,#EFE2C0 72%)}
#compass .needle{position:absolute;background:#B5432E;border-radius:3px}
#compass .needle2{position:absolute;background:#3A2C1E;border-radius:3px}
#compass .pip{position:absolute;border-radius:50%;background:#3A2C1E}
#compass .nmark{position:absolute;font-weight:800;color:#B5432E}
#floorplank{position:absolute;left:0;width:100%;
  background:repeating-linear-gradient(0deg,#8A6A48 0 58px,#7A5C3E 58px 62px,#8A6A48 62px 120px)}
#rug{position:absolute;border-radius:50%;background:radial-gradient(circle at 45% 35%,#8E3A38,#7A3030 62%,#632624 100%);border:8px solid #B98A3C;box-shadow:0 14px 30px rgba(30,16,6,.35);will-change:opacity}
#baseboard{position:absolute;left:0;width:100%;background:#543622}
#tableT{position:absolute;will-change:opacity}
#tableT .slab{position:absolute;background:linear-gradient(180deg,#7A4E32,#5C3A28);border-radius:10px;box-shadow:0 10px 22px rgba(30,16,6,.35)}
#tableT .leg{position:absolute;background:#4E3222;border-radius:4px;width:26px}
#mapSheet{position:absolute;will-change:opacity}
#mapSheet .paper{position:absolute;background:linear-gradient(180deg,#FBF3DC,#F2E6C6);border:3px solid #B98A3C;border-radius:6px;box-shadow:0 8px 20px rgba(30,16,6,.3)}
#mapSheet .coast{position:absolute;border:3px solid rgba(44,74,110,.55);border-radius:46% 54% 58% 42%/52% 44% 56% 48%;background:rgba(44,74,110,.10)}
#mapSheet .gr{position:absolute;background:repeating-linear-gradient(0deg,rgba(44,74,110,.14) 0 2px,transparent 2px 26px),repeating-linear-gradient(90deg,rgba(44,74,110,.14) 0 2px,transparent 2px 26px)}
#mapSheet .wax{position:absolute;border-radius:50%;background:radial-gradient(circle at 38% 32%,#D2543E,#A83222 70%);box-shadow:0 4px 10px rgba(30,16,6,.3)}
#mapSheet .mini{position:absolute;border-radius:50%;border:2px solid #B5432E}
#mapSheet .mline{position:absolute;background:#B5432E;border-radius:2px}
#ribbon{position:absolute;will-change:opacity}
#ribbon .strip{position:absolute;background:linear-gradient(180deg,#FFFDF2,#F7EDD2);border:2px solid #B98A3C;border-radius:8px;box-shadow:0 6px 14px rgba(30,16,6,.25)}
#ribbon .digits{position:absolute;font-family:'JetBrains Mono','DejaVu Sans Mono',monospace;font-weight:800;color:#2C4A6E;white-space:nowrap}
#ribbon .dots{position:absolute;font-family:'JetBrains Mono','DejaVu Sans Mono',monospace;font-weight:800;color:#B5432E;opacity:0}
.panelI{position:absolute;background:linear-gradient(180deg,#223A54,#1A2C42);border-radius:16px;border:4px solid #B98A3C;box-shadow:0 16px 38px rgba(20,10,4,.5);will-change:transform,opacity}
.tapeC{position:absolute;background:rgba(185,138,60,.5);border-radius:3px;box-shadow:0 2px 5px rgba(20,10,4,.25)}
.pHd{font-weight:800;color:#FFF6E6;letter-spacing:.10em;text-align:center}
.pRow{display:flex;align-items:center;opacity:0}
.pDot{border-radius:50%;flex:none}
.pName{font-weight:800;color:#FFF6E6;flex:none}
.pEx{font-family:'JetBrains Mono','DejaVu Sans Mono',monospace;font-weight:800;color:#F2E2C4}
.pNote{display:flex;align-items:center;justify-content:center;background:rgba(185,138,60,.25);border:2px solid rgba(185,138,60,.6);border-radius:10px;color:#F2CE8E;font-weight:800;letter-spacing:.05em;text-align:center;opacity:0;will-change:opacity}
.chipA{display:flex;align-items:center;justify-content:center;border-radius:12px;font-family:'JetBrains Mono','DejaVu Sans Mono',monospace;font-weight:800;color:#FFF6E6;background:#31506E;box-shadow:0 8px 18px rgba(20,10,4,.4);opacity:0;will-change:opacity}
.stamp{position:absolute;display:flex;align-items:center;justify-content:center;border-radius:999px;background:linear-gradient(92deg,#7FA6BF 0%,#B5432E 52%,#D98F2E 100%);color:#22160C;font-weight:800;letter-spacing:.06em;box-shadow:0 12px 26px rgba(20,10,4,.45);will-change:transform,opacity}
.rootCard{position:absolute;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:10px;background:linear-gradient(180deg,#FFFDF6,#F2E6C6);border:3px solid #B98A3C;font-family:'JetBrains Mono','DejaVu Sans Mono',monospace;font-weight:800;box-shadow:0 8px 18px rgba(20,10,4,.35);will-change:transform,opacity}
.rootCard .val{line-height:1.05}
.rootCard .tag{letter-spacing:.08em}
.series{position:absolute;background:rgba(181,67,46,.14);border:2px solid rgba(181,67,46,.5);border-radius:8px;font-family:'JetBrains Mono','DejaVu Sans Mono',monospace;font-weight:800;color:#8A3A24;opacity:0;will-change:opacity}
.kcol{position:absolute;border-radius:12px;border:3px solid;background:rgba(255,253,246,.06);opacity:0;will-change:opacity}
.kcol .kh{font-weight:800;text-align:center;letter-spacing:.08em}
.krow{display:flex;align-items:center;opacity:0}
.krow .kd{border-radius:50%;flex:none}
.krow .kt{font-weight:700;color:#FFF6E6}
.formula{position:absolute;font-family:'JetBrains Mono','DejaVu Sans Mono',monospace;font-weight:800;color:#F2CE8E;opacity:0;will-change:opacity}
.pcompass{position:absolute;will-change:opacity}
.pcompass .rim{position:absolute;border-radius:50%;background:conic-gradient(#D9B36A,#A87E36,#D9B36A,#A87E36,#D9B36A)}
.pcompass .face{position:absolute;border-radius:50%;background:radial-gradient(circle at 40% 32%,#FBF3DC,#EFE2C0 72%)}
.pcompass .rline{position:absolute;background:#B5432E;border-radius:2px}
.pcompass .rc{position:absolute;border-radius:50%;background:#B5432E}
.pcompass .rlab{position:absolute;font-family:'JetBrains Mono','DejaVu Sans Mono',monospace;font-weight:800;color:#B5432E}
.cabinet{position:absolute;will-change:opacity}
#cabinet .box{position:absolute;background:linear-gradient(180deg,#7A4E32,#5C3A28);border-radius:8px;box-shadow:0 12px 26px rgba(30,16,6,.4)}
#cabinet .drawer{position:absolute;background:linear-gradient(180deg,#8A5C3C,#6E462C);border-radius:4px;border:2px solid #4E3222}
#cabinet .handle{position:absolute;border-radius:50%;background:#D9B36A}
.qmark{position:absolute;color:#D98F2E;font-weight:800;text-shadow:0 5px 0 rgba(0,0,0,.25);will-change:transform,opacity}
.title{position:absolute;left:0;width:100%;text-align:center;font-weight:800;color:#3A2E20;letter-spacing:.04em;text-shadow:0 5px 0 rgba(255,255,255,.45),0 12px 26px rgba(60,30,10,.22);will-change:transform,opacity}
#pil{position:absolute;border-radius:999px;background:linear-gradient(92deg,#7FA6BF 0%,#B5432E 52%,#D98F2E 100%);color:#22160C;font-weight:800;display:flex;align-items:center;justify-content:center;will-change:transform,opacity;box-shadow:0 10px 24px rgba(20,10,4,.4)}
#endcard{position:absolute;left:0;width:100%;opacity:0;will-change:transform,opacity}
#fplate{background:rgba(26,16,10,.62);border-radius:28px;padding:14px 44px;width:max-content;margin:0 auto;box-shadow:0 14px 34px rgba(20,10,4,.4)}
#f_url{font-weight:800;text-align:center}
#f_bar{height:7px;border-radius:4px;background:linear-gradient(90deg,#7FA6BF,#B5432E,#D98F2E)}
#subbar{position:absolute;left:50%;transform:translateX(-50%);background:rgba(26,16,10,.86);border-radius:20px;padding:18px 32px;text-align:center;box-shadow:0 14px 34px rgba(20,10,4,.5);will-change:transform,opacity}
#sub_id{font-weight:800;color:#FFFFFF;line-height:1.26}
#sub_en{color:#D9C8B4;font-weight:600}
#wm{position:absolute;font-weight:800;letter-spacing:.34em;color:#F6EFE2;font-family:'JetBrains Mono','DejaVu Sans Mono',monospace;border:1.5px solid rgba(246,239,226,.42);will-change:transform}
.bchar{position:absolute;will-change:transform,opacity}
.bchar .core{position:absolute;border-radius:100%}
.bchar .shine{position:absolute;border-radius:50%;background:rgba(255,255,255,.72);filter:blur(2px)}
.bsh{position:absolute;border-radius:50%;background:rgba(20,10,4,.4);filter:blur(2px)}
.spark{position:absolute;width:34px;height:34px;opacity:0}
.spark .sa{position:absolute;background:#FFE9A8;border-radius:3px}
</style>
</head>
<body>
<div id="stage">
  <div id="world">
    <div id="mapwall"></div>
    <div id="tilesun"></div>
    <div id="ceiling"></div>
    <div class="lampW"><div class="cord"></div><div class="shade"></div><div class="glow"></div></div>
    <div class="lampW"><div class="cord"></div><div class="shade"></div><div class="glow"></div></div>
    <div id="compass"><div class="rim"></div><div class="face"></div><div class="needle"></div><div class="needle2"></div><div class="pip"></div><div class="nmark">U</div></div>
    <div id="floorplank"></div>
    <div id="rug"></div>
    <div id="baseboard"></div>
    <div id="tableT"><div class="slab"></div><div class="leg"></div><div class="leg"></div></div>
    <div id="mapSheet"><div class="paper"></div><div class="gr"></div><div class="coast"></div><div class="mini"></div><div class="mline"></div><div class="wax"></div></div>
    <div id="ribbon"><div class="strip"></div><div class="digits"></div><div class="dots">...</div></div>
    <div id="cabinet"><div class="box"></div></div>
    <div id="props"></div>
    <div id="chars"></div>
  </div>
  <div id="flash"></div>
  <div id="fade"></div>
  <div id="pil">KELOMPOKKAN DI KOMEN</div>
  <div id="endcard">
    <div id="fplate"><div id="f_url">AKIOMIDA.COM</div></div>
    <div id="f_bar"></div>
  </div>
  <div class="title" id="t0">KENAPA ADA TITIK?</div>
  <div class="title" id="t1">APA ITU IRASIONAL</div>
  <div class="title" id="t2">AKAR DUA, KENAPA?</div>
  <div class="title" id="t3">LINGKARAN DAN PI</div>
  <div class="title" id="t4">DUA KELUARGA</div>
  <div class="title" id="t5">KELOMPOK MANA?</div>
  <div id="subbar"><div id="sub_id"></div><div id="sub_en"></div></div>
  <div id="wm">AKIOMIDA</div>
</div>
<script>
const Q=new URLSearchParams(location.search);
const ORIENT=Q.get('o')||'landscape';
const W=ORIENT==='portrait'?1080:1920;
const H=ORIENT==='portrait'?1920:1080;

/* v11 "Buhbus" - DUNIA BARU: RUMAH PETA KARTIKA, ruang kartografi vintage:
   kertas peta tua krem dengan grid tinta biru, meja mahoni dengan peta
   terbuka dan pita angka pi yang digitnya muncul satu per satu lalu ditutup
   titik titik, kompas kuningan raksasa di dinding, lampu gantung ber-tudung
   hijau, lantai papan kayu dengan karpet marun, rak kartu katalog, segel
   lilin merah. Kartu uji bergaya kartu katalog yang dibalik satu per satu.
   Latar BERBEDA TOTAL dari Dapoer Posya dan episode lain (aturan 26).
   Karakter: HANYA bola emas mentor, bulat sejati, tanpa mata (aturan 23).
   Subjudul zona aman dua baris (aturan 27); watermark AKIOMIDA di tepi
   paling bawah (aturan 24); penutup bersih (aturan 28). */
const P = ORIENT==='portrait' ? {
  floorY:1080, bbY:1064, ceilH:110,
  tableX:50, tableW:330, slabY:830, slabH:52, legBot:1080,
  mapW:300, mapH:96, mapCX:215, mapCY:778,
  ribW:290, ribH:44, ribX:70, ribY:690,
  stampX:470, stampY:600, stampW:480, stampH:60, stampFS:26,
  panelX:400, panelY:470, panelW:610, panelH:360,
  pilX:305, pilY:758, pilW:470, pilH:68, pilFS:28,
  ecY:830, barW:420,
  titleY:300, titleS0:80, titleSN:74,
  subTop:1170, subId:40, subEn:22, subMax:880,
  ballD:110, groundY:1120, wmY:1800, wmFS:20,
  lampsX:[340,700], lampsY:[168,150], lampsD:[74,62],
  compassC:[78,468], compassD:96,
  rugX:220, rugW:640, rugY:1092, rugH:96,
  cabX:830, cabY:880, cabW:180, cabH:130,
  cardW:130, cardH:96, cardFS:28
} : {
  floorY:508, bbY:494, ceilH:70,
  tableX:140, tableW:360, slabY:540, slabH:40, legBot:700,
  mapW:340, mapH:82, mapCX:320, mapCY:494,
  ribW:330, ribH:38, ribX:150, ribY:404,
  stampX:960, stampY:440, stampW:560, stampH:56, stampFS:24,
  panelX:760, panelY:250, panelW:1020, panelH:290,
  pilX:760, pilY:600, pilW:430, pilH:65, pilFS:26,
  ecY:400, barW:520,
  titleY:150, titleS0:88, titleSN:72,
  subTop:740, subId:38, subEn:20, subMax:1360,
  ballD:96, groundY:660, wmY:1010, wmFS:18,
  lampsX:[560,1000], lampsY:[112,100], lampsD:[62,52],
  compassC:[80,300], compassD:88,
  rugX:620, rugW:680, rugY:676, rugH:66,
  cabX:1450, cabY:560, cabW:220, cabH:130,
  cardW:150, cardH:84, cardFS:26
};
const stage=document.getElementById('stage');
stage.style.width=W+'px';stage.style.height=H+'px';

/* ---------- util & easing ---------- */
const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,p)=>a+(b-a)*p;
const seg=(t,a,d)=>clamp((t-a)/d,0,1);
const eio=p=>p<0.5?2*p*p:1-Math.pow(-2*p+2,2)/2;
const eoe=p=>1-Math.pow(1-p,3);
const smz=(t,a,b,f)=>f?clamp((t-a)/f,0,1)*clamp((b-t)/f,0,1):(t>=a&&t<b?1:0);
function popA(el,t,t0,d,ov,op0,op1){
  const o=clamp(seg(t,t0,0.3)*(1-seg(t,op1,0.35)),0,1);
  const s2=1+(ov/100)*Math.sin(clamp(seg(t,t0,d),0,1)*Math.PI)*(1-seg(t,op1,0.35));
  el.style.opacity=String(o);
  el.style.transform=`scale(${s2.toFixed(3)})`;
}
let _seed=20261118;
const rnd=()=>{_seed|=0;_seed=_seed+0x6D2B79F5|0;let z=Math.imul(_seed^_seed>>>15,1|_seed);
  z=z+Math.imul(z^z>>>7,61|z)^z;return((z^z>>>14)>>>0)/4294967296;};

/* ---------- dinding peta, plafon, lampu, kompas, lantai ---------- */
const wallEl=document.getElementById('mapwall');
wallEl.style.cssText+=`height:${P.floorY}px;`;
const floorEl=document.getElementById('floorplank');
floorEl.style.cssText+=`top:${P.floorY}px;height:${H-P.floorY}px;`;
const bbEl=document.getElementById('baseboard');
bbEl.style.cssText+=`top:${P.bbY}px;height:${P.floorY-P.bbY}px;`;
const ceilEl=document.getElementById('ceiling');
ceilEl.style.cssText+=`height:${P.ceilH}px;`;
{
  const band=document.createElement('div');
  band.className='beam';
  band.style.cssText+=`left:0;top:0;width:100%;height:${Math.round(P.ceilH*0.32)}px;`;
  ceilEl.appendChild(band);
  const nb=ORIENT==='portrait'?3:4;
  for(let i=0;i<nb;i++){
    const bx=lerp(W*0.08,W*0.92,i/(nb-1));
    const bm=document.createElement('div');
    bm.className='beam';
    const bw=Math.round(P.ceilH*0.20);
    bm.style.cssText+=`left:${bx-bw/2}px;top:0;width:${bw}px;height:${P.ceilH}px;border-radius:${bw/2}px ${bw/2}px 8px 8px;`;
    ceilEl.appendChild(bm);
  }
}
const LAMPS=[];
document.querySelectorAll('.lampW').forEach((lw,i)=>{
  const lx=P.lampsX[i], ly=P.lampsY[i], ld=P.lampsD[i];
  const cord=lw.querySelector('.cord');
  cord.style.cssText+=`left:${lx-2}px;top:${Math.round(P.ceilH*0.9)}px;height:${ly-Math.round(P.ceilH*0.9)}px;`;
  const shade=lw.querySelector('.shade');
  shade.style.cssText+=`left:${lx-ld/2}px;top:${ly}px;width:${ld}px;height:${Math.round(ld*0.5)}px;`;
  const glow=lw.querySelector('.glow');
  glow.style.cssText+=`left:${lx-ld*0.9}px;top:${ly+Math.round(ld*0.2)}px;width:${ld*1.8}px;height:${ld*1.8}px;`;
  LAMPS.push({lw,shade,ph:i*2.1});
});
/* kompas kuningan raksasa di dinding kiri atas */
const compEl=document.getElementById('compass');
{
  const [cx,cy]=P.compassC, cd=P.compassD;
  const rim=compEl.querySelector('.rim');
  rim.style.cssText+=`left:${cx-cd/2}px;top:${cy-cd/2}px;width:${cd}px;height:${cd}px;`;
  const face=compEl.querySelector('.face');
  face.style.cssText+=`left:${cx-cd/2+7}px;top:${cy-cd/2+7}px;width:${cd-14}px;height:${cd-14}px;`;
  const n1=compEl.querySelector('.needle');
  n1.style.cssText+=`left:${cx-3}px;top:${cy-cd*0.34}px;width:6px;height:${cd*0.34}px;transform:rotate(38deg);transform-origin:50% 100%;`;
  const n2=compEl.querySelector('.needle2');
  n2.style.cssText+=`left:${cx-3}px;top:${cy-cd*0.3}px;width:6px;height:${cd*0.3}px;transform:rotate(218deg);transform-origin:50% 100%;`;
  const pip=compEl.querySelector('.pip');
  pip.style.cssText+=`left:${cx-6}px;top:${cy-6}px;width:12px;height:12px;`;
  const nm=compEl.querySelector('.nmark');
  nm.style.cssText+=`left:${cx-7}px;top:${cy-cd/2+9}px;font-size:${Math.round(cd*0.2)}px;`;
}
/* karpet marun di lantai tengah */
const rugEl=document.getElementById('rug');
rugEl.style.cssText+=`left:${P.rugX}px;top:${P.rugY}px;width:${P.rugW}px;height:${P.rugH}px;`;

/* ---------- meja mahoni, peta terbuka, pita pi ---------- */
const tableEl=document.getElementById('tableT');
{
  const slab=tableEl.querySelector('.slab');
  slab.style.cssText+=`left:${P.tableX}px;top:${P.slabY}px;width:${P.tableW}px;height:${P.slabH}px;`;
  const legs=tableEl.querySelectorAll('.leg');
  legs[0].style.cssText+=`left:${P.tableX+26}px;top:${P.slabY+P.slabH}px;height:${P.legBot-P.slabY-P.slabH}px;`;
  legs[1].style.cssText+=`left:${P.tableX+P.tableW-52}px;top:${P.slabY+P.slabH}px;height:${P.legBot-P.slabY-P.slabH}px;`;
}
const mapEl=document.getElementById('mapSheet');
{
  const mwx=P.mapCX-P.mapW/2, mwy=P.mapCY-P.mapH/2;
  const paper=mapEl.querySelector('.paper');
  paper.style.cssText+=`left:${mwx}px;top:${mwy}px;width:${P.mapW}px;height:${P.mapH}px;`;
  const gr=mapEl.querySelector('.gr');

subbar.style.top=P.subTop+'px';
subbar.style.maxWidth=P.subMax+'px';
subbar.style.width='max-content';
const wm=document.getElementById('wm');
wm.style.cssText+=`top:${P.wmY}px;font-size:${P.wmFS}px;left:50%;transform:translateX(-50%);
  width:max-content;padding:9px 30px;background:rgba(26,16,10,.55);border-radius:999px;`;
/* ---------- narasi buhbus: 16 beat soft selling (aturan 25) ---------- */
const SUBS=[
  [0.50,'Pi: 3,1415926535, lalu titik titik.','Pi: 3,1415926535, then dots.','#FFFFFF'],
  [2.90,'Angkanya terus tanpa berhenti dan tanpa pola.','Its digits go on forever, with no pattern.','#FFFFFF'],
  [6.60,'Jenis itu punya nama: bilangan irasional.','That kind has a name: irrational numbers.','#FFFFFF'],
  [9.70,'Irasional tak bisa ditulis sebagai a per b.','Irrationals cannot be written as a over b.','#FFFFFF'],
  [12.90,'Contohnya: akar dua, akar tiga, akar lima, pi.','Examples: square root 2, 3, 5, and pi.','#FFFFFF'],
  [16.40,'Sekarang, akar dua. Kenapa irasional?','Now, square root 2. Why irrational?','#FFFFFF'],
  [19.20,'Akar empat sama dengan dua. Bulat, rasional.','Square root 4 is 2. Whole, so rational.','#FFFFFF'],
  [22.50,'Akar dua? 1,4142135 dan terus, tanpa pola.','Root 2? 1,4142135 and on, no pattern.','#D98F2E'],
  [25.70,'Tapi hati hati: akar 25 sama dengan lima.','But careful: root 25 equals five.','#FFFFFF'],
  [28.70,'Akar 36? Enam. Lihat hasilnya, bukan tandanya.','Root 36? Six. Check the result, not the sign.','#D98F2E'],
  [32.70,'Pi dan lingkaran memang sahabat.','Pi and circles are old friends.','#FFFFFF'],
  [35.10,'Keliling lingkaran: dua kali pi kali jari jari.','Circle perimeter: two times pi times radius.','#FFFFFF'],
  [38.60,'Tanda kira kira: 3,14159 hanyalah pendekatan.','The approx sign: 3,14159 is just an estimate.','#D98F2E'],
  [42.00,'Dua keluarga, satu dunia: bilangan real.','Two families, one world: real numbers.','#D98F2E'],
  [44.90,'Kelompokkan enam kartu ini, tulis di komentar.','Sort these six cards, write it below.','#FFFFFF'],
  [50.07,'Terima kasih sudah menonton.','Thanks for watching.','#FFE9A8']
];
let subIdx=-1;
function renderSub(t){
  let i=0;
  for(let k=0;k<SUBS.length;k++){ if(t>=SUBS[k][0]-0.001) i=k; }
  const nxt=i+1<SUBS.length?SUBS[i+1][0]:52.4;
  const o=clamp(Math.min(seg(t,SUBS[i][0],0.25), 1-seg(t,nxt-0.14,0.14)),0,1);
  if(i!==subIdx){
    subIdx=i;
    subId.textContent=SUBS[i][1];
    subId.style.color=SUBS[i][3];
    subEn.textContent=SUBS[i][2];
  }
  subbar.style.opacity=(o*0.98).toFixed(3);
  const pop=1+0.018*Math.sin(clamp(seg(t,SUBS[i][0],0.45),0,1)*Math.PI);
  subbar.style.transform=`translateX(-50%) scale(${pop.toFixed(3)})`;
}

/* ---------- judul bab (rata tengah, aturan 28) ---------- */
const TITLES=[['t0',0.35],['t1',6.6],['t2',17.3],['t3',32.7],['t4',40.6],['t5',44.3]]
  .map(([id,t0],i)=>({el:document.getElementById(id),t0:t0,i:i}));
TITLES.forEach((o)=>{
  o.el.style.top=(o.i===0?P.titleY:P.titleY+14)+'px';
  o.el.style.fontSize=(o.i===0?P.titleS0:P.titleSN)+'px';
  if(o.i===0||o.i===2||o.i===4)o.el.style.color='#8A3A24';
});

/* ---------- beat, masterplan mentor (lantai depan, tak menembus properti) ---------- */
const IMP=[0.6,4.0,6.6,20.4,26.0,32.7,40.6,44.3];
const SPARKS=[[4.0,5.6],[47.7,49.6]];
const GESTS=[
  [1.4,0.8,'nod',3],
  [8.0,0.7,'tilt',5],
  [11.2,0.7,'nod',3],
  [17.8,0.7,'nod',3],
  [20.5,0.7,'tilt',5],
  [23.2,0.7,'nod',3],
  [26.2,0.7,'tilt',5],
  [28.9,0.7,'nod',3],
  [33.6,0.7,'tilt',5],
  [36.6,0.8,'nod',3],
  [41.0,0.7,'tilt',4],
  [45.1,0.8,'nod',3]
];
function imp(t){
  let a=0;
  for(const bt of IMP){
    const d=t-bt;
    if(d>=0&&d<0.5){ const p=d/0.5; a=Math.max(a,(1-p)*0.85); }
  }
  return a;
}
const WAY = ORIENT==='portrait'
  ? [[0.55,175],[6.6,705],[17.3,640],[32.7,640],[40.6,705],[44.2,600]]
  : [[0.55,260],[6.6,1270],[17.3,1200],[32.7,1200],[40.6,1270],[44.2,1100]];

/* ---------- RENDER PER FRAME ---------- */
const world=document.getElementById('world');
const flash=document.getElementById('flash');
const fade=document.getElementById('fade');
const tilesun=document.getElementById('tilesun');
let _roll=0,_mxPrev=null;
function renderFrame(t){
  /* pustaka makin hangat menjelang penutup: lampu kuningan menyala lembut */
  const nk=seg(t,36.0,8.0);
  tilesun.style.background=`rgba(58,38,26,${(nk*0.22).toFixed(3)})`;
  for(const L of LAMPS){
    const sw=Math.sin(t*0.8+L.ph)*1.6;
    L.lw.style.transform=`rotate(${sw.toFixed(2)}deg)`;
  }
  /* penutup bersih (aturan 28): konten keluar di 49.8 */
  const exo=1-seg(t,49.8,0.5);
  /* hook: peta terbuka di meja, pita pi menumbuhkan digit, titik titik besar */
  const mapO=clamp(seg(t,0.9,0.5)*exo,0,1);
  mapEl.style.opacity=String(mapO);
  mapEl.style.transform=`scale(${(1+0.05*Math.sin(clamp(seg(t,0.9,0.7),0,1)*Math.PI)).toFixed(3)})`;
  const dg=ribbonEl.querySelector('.digits');
  const dots=ribbonEl.querySelector('.dots');
  const nDig=Math.floor(seg(t,1.2,2.2)*PI_DIGITS.length+0.0001);
  dg.textContent=PI_DIGITS.slice(0,nDig);
  dots.style.opacity=(seg(t,4.0,0.4)*(1-seg(t,6.4,0.3))).toFixed(3);
  ribbonEl.style.opacity=String(clamp(seg(t,1.2,0.4)*exo,0,1));
  popA(stamp,t,4.6,0.55,7,0,6.4);
  /* panel 1: definisi irasional */
  popA(panel1,t,7.0,0.6,5,0,17.0);
  for(const r of ROWS1){ r.el.style.opacity=seg(t,r.t0,0.45).toFixed(3); }
  for(const c of P1CHIPS){
    c.el.style.opacity=(clamp(seg(t,c.t0,0.35),0,1)*(1-seg(t,17.0,0.3))).toFixed(3);
  }
  popA(p1Note,t,10.8,0.5,5,0,17.0);
  /* panel 2: kartu akar dibalik satu per satu */
  popA(panel2,t,17.5,0.55,5,0,32.5);
  for(const c of R1C){
    const inA=seg(t,c.tf-0.8,0.3);
    const fl=t>=c.tf;
    c.v.textContent=fl?c.val:c.q;
    c.tg.textContent=fl?c.tag:'?';
    const bounce=1+0.1*Math.sin(clamp(seg(t,c.tf,0.4),0,1)*Math.PI)*(fl?1:0);
    c.el.style.opacity=(clamp(inA,0,1)*exo).toFixed(3);
    c.el.style.transform=`scale(${bounce.toFixed(3)})`;
    c.el.style.color=fl?c.col:'#3A2C1E';
    c.el.style.borderColor=fl?c.bd:'#B98A3C';
  }
  {
    const inA=seg(t,20.0-0.8,0.3);
    const fl=t>=20.4;
    v2.textContent=fl?'1,414...':'√2';
    tg2.textContent=fl?'IRASIONAL':'?';
    const bounce=1+0.1*Math.sin(clamp(seg(t,20.4,0.4),0,1)*Math.PI)*(fl?1:0);
    c2.style.opacity=(clamp(inA,0,1)*exo).toFixed(3);
    c2.style.transform=`scale(${bounce.toFixed(3)})`;
    c2.style.color=fl?'#8A3A24':'#3A2C1E';
    c2.style.borderColor=fl?'#D98F7E':'#B98A3C';
    series.textContent=t>=23.0?'1,4142135623...':'1,414213...';
    series.style.opacity=(seg(t,23.0,0.4)*exo).toFixed(3);
  }
  for(const c of R3C){
    const inA=seg(t,c.tf-0.7,0.3);
    const fl=t>=c.tf;
    c.v.textContent=fl?c.val:c.q;
    c.tg.textContent=fl?c.tag:'?';
    const bounce=1+0.1*Math.sin(clamp(seg(t,c.tf,0.4),0,1)*Math.PI)*(fl?1:0);
    c.el.style.opacity=(clamp(inA,0,1)*exo).toFixed(3);
    c.el.style.transform=`scale(${bounce.toFixed(3)})`;
    c.el.style.color=fl?c.col:'#3A2C1E';
    c.el.style.borderColor=fl?c.bd:'#B98A3C';
  }
  popA(p2Note,t,24.2,0.45,5,0,32.5);
  if(t>=26.7)p2Note.textContent='LIHAT HASILNYA, BUKAN TANDANYA';
  /* panel 3: kompas keliling dan rumus */
  popA(panel3,t,33.0,0.55,5,0,40.5);
  popA(pcomp,t,33.2,0.5,6,0,40.5);
  popA(formula,t,33.4,0.5,6,0,40.5);
  for(const r of ROWS3P){ r.el.style.opacity=seg(t,r.t0,0.4).toFixed(3); }
  popA(p3Note,t,36.8,0.45,5,0,40.5);
  /* panel 4: dua keluarga */
  popA(panel4,t,40.9,0.55,5,0,44.3);
  for(const k of KCOLS){
    k.col.style.opacity=(clamp(seg(t,k.t0,0.45),0,1)*(1-seg(t,44.3,0.3))).toFixed(3);
    for(const r of k.rows){ r.el.style.opacity=seg(t,k.t0+0.25,0.4).toFixed(3); }
  }
  popA(p4Note,t,42.6,0.45,5,0,44.3);
  /* kartu uji: enam kartu katalog, dibalik satu per satu tanpa membocorkan kelompok */
  tagUji.style.opacity=(seg(t,45.0,0.4)*exo).toFixed(3);
  for(const c of CARDS){
    const inA=seg(t,44.7,0.3);
    const fl=t>=c.flip;
    if(c.el.textContent!==(fl?c.val:'?'))c.el.textContent=fl?c.val:'?';
    const bounce=1+0.11*Math.sin(clamp(seg(t,c.flip,0.4),0,1)*Math.PI)*(fl?1:0);
    c.el.style.opacity=(inA*exo).toFixed(3);
    c.el.style.transform=`scale(${bounce.toFixed(3)})`;
    c.el.style.borderColor=fl&&t<c.flip+0.5?'#D98F2E':'#B98A3C';
  }
  popA(pil,t,47.7,0.6,6,0,49.8);
  /* penutup bersih (aturan 28): peta, pita, rak katalog keluar di 49.8 */
  tableEl.style.opacity=exo.toFixed(3);
  cabEl.style.opacity=exo.toFixed(3);
  /* mentor: menggelinding antar stasiun di karpet dan papan kayu */
  let bx=WAY[WAY.length-1][1];
  for(let k=0;k<WAY.length-1;k++){
    const [w0,x0]=WAY[k],[w1,x1]=WAY[k+1];
    if(t>=w0&&t<w1){ bx=lerp(x0,x1,eio(seg(t,w0,w1-w0))); break; }
  }
  if(t>=WAY[WAY.length-1][0])bx=WAY[WAY.length-1][1];
  if(_mxPrev===null)_mxPrev=bx;
  _roll+=(bx-_mxPrev)/(P.ballD/2)*(180/Math.PI);
  _mxPrev=bx;
  const ep=seg(t,0.6,0.55);
  let hy2=0, lrot=0, drot=0, txj=0;
  for(const [gs,gd,gt,ga] of GESTS){
    const d2=t-gs;
    if(d2>=0&&d2<gd){
      const p=d2/gd, w=Math.sin(p*Math.PI);
      if(gt==='tilt'||gt==='lean'){ lrot+=ga*w; }
      else if(gt==='nod'){ lrot+=ga*Math.sin(p*2*Math.PI); }
      else if(gt==='shiver'){ txj=ga*Math.sin(p*40)*(1-p); }
      else if(gt==='spin'){ drot+=ga*eio(p); }
    }
  }
  mentor.el.style.left=bx.toFixed(1)+'px';
  mentor.el.style.opacity=String(clamp(ep*3,0,1)*exo);
  mentor.el.style.top=(P.groundY-P.ballD+hy2).toFixed(1)+'px';
  mentor.el.style.transform=`translateX(${txj.toFixed(1)}px) rotate(${(_roll+lrot+drot).toFixed(2)}deg) scale(1)`;
  msh.style.left=bx.toFixed(1)+'px';
  msh.style.top=(P.groundY-10)+'px';
  msh.style.opacity=String(clamp(ep*3,0,1)*exo*clamp(0.42+hy2*0.006,0.18,0.5));
  msh.style.transform=`scaleX(${clamp((1+hy2*0.004),0.4,1.08).toFixed(3)})`;
  /* percikan bintang */
  let spo=0;
  for(const [sa,sb] of SPARKS){
    if(t>=sa&&t<sb) spo=smz(t,sa,sb,0.35)*(0.65+0.2*Math.sin(t*7));
  }
  spark.style.opacity=String(clamp(spo,0,1));
  spark.style.left=(bx+62).toFixed(1)+'px';
  spark.style.top=(P.groundY-150+Math.sin(t*2)*4).toFixed(1)+'px';
  spark.style.transform=`rotate(${((t*28)%360).toFixed(0)}deg) scale(${(0.8+0.15*Math.sin(t*7)).toFixed(3)})`;
  /* judul bab (judul terakhir ikut keluar saat penutup agar endcard sendirian) */
  for(let i=0;i<TITLES.length;i++){
    const o=TITLES[i];
    const tEnd=i+1<TITLES.length?TITLES[i+1].t0:50.2;
    const oin=seg(t,o.t0,0.35)*(1-seg(t,tEnd-0.25,0.3));
    const sc2=1+0.035*Math.sin(clamp(seg(t,o.t0,0.7),0,1)*Math.PI);
    o.el.style.opacity=oin.toFixed(3);
    o.el.style.transform=`scale(${sc2.toFixed(3)})`;
  }
  /* endcard penutup bersih: AKIOMIDA.COM muncul SENDIRIAN di ruang yang tenang */
  const eci=eio(seg(t,50.2,0.7));
  endcard.style.opacity=eci.toFixed(3);
  endcard.style.transform=`translateY(${((1-eci)*16).toFixed(1)}px) scale(${(0.94+0.06*eci).toFixed(3)})`;
  fBar.style.width=(seg(t,50.9,0.5)*P.barW).toFixed(0)+'px';
  renderSub(t);
  /* kamera tenang */
  const im=imp(t);
  const shx=Math.sin(t*47)*2.5*im, shy=Math.sin(t*39+1.7)*1.8*im;
  world.style.transform=`translate(${shx.toFixed(2)}px,${(shy+Math.sin(t*0.35)*3).toFixed(2)}px)`;
  flash.style.opacity=(im*0.07).toFixed(3);
  fade.style.opacity=String(clamp(1-seg(t,0.05,0.5),0,1)*0.96+clamp(seg(t,51.4,0.6),0,1));
}
renderFrame(0);
window.__ready=true;
</script>
