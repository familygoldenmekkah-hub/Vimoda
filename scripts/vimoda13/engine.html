<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
/*__FONTS__*/
*{box-sizing:border-box}
body{margin:0;background:#120C08;font-family:'Poppins','Noto Sans',sans-serif;-webkit-font-smoothing:antialiased}
#stage{position:relative;overflow:hidden}
#world{position:absolute;inset:0}
#flash{position:absolute;inset:0;background:#FFFFFF;opacity:0;pointer-events:none}
#fade{position:absolute;inset:0;background:#120C08;opacity:0;pointer-events:none}
.center{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.mono{font-family:'JetBrains Mono','DejaVu Sans Mono',monospace}
/* GUDANG PAPASAN: gudang sepatu dinding crate teal hangat - rak pasangan
   sepatu terpasang di dinding (ikon dunia: sepatu berdua rapi, satu nanggung),
   bangku sortir dengan tumpukan shoebox kardus, tanda PAPASAN di dinding,
   lampu dome industri, lantai beton sejuk dengan marka safety kuning.
   Panel konten plum gelap berbingkai kuning safety (aturan 26: latar BERBEDA
   TOTAL dari Bengkel Tapali, Kota Bilangan, dan semua episode lain).
   Karakter: HANYA bola emas mentor, bulat sejati, tanpa mata (aturan 23).
   Pedagogi pemula aturan 29 dan papan tugas kuis aturan 30 dipatuhi sejak
   rendering pertama. Subjudul zona aman maksimal dua baris (aturan 27);
   watermark AKIOMIDA di tepi paling bawah (aturan 24); penutup bersih
   (aturan 28). */
#shopwall{position:absolute;left:0;top:0;width:100%;
  background:repeating-linear-gradient(90deg,rgba(56,86,76,.16) 0 4px,transparent 4px 118px),
  linear-gradient(180deg,#E6E9DA 0%,#D4DAC6 100%)}
#tilesun{position:absolute;inset:0;background:rgba(58,38,26,0);will-change:background}
#ceiling{position:absolute;left:0;top:0;width:100%}
#ceiling .beam{position:absolute;background:linear-gradient(180deg,#9FB8AC,#7E9A8C);border-radius:0 0 8px 8px;box-shadow:0 4px 10px rgba(60,40,10,.22)}
.lampW{position:absolute;will-change:opacity}
.lampW .cord{position:absolute;width:4px;background:#3A2C1E}
.lampW .dome{position:absolute;border-radius:50% 50% 12px 12px;background:linear-gradient(180deg,#F4F1E8,#CFC9B8);box-shadow:0 8px 18px rgba(60,40,10,.3)}
.lampW .glow{position:absolute;border-radius:50%;background:radial-gradient(circle,rgba(255,244,200,.8),rgba(255,244,200,0) 70%)}
/* penggaris raksasa: garis bilangan di dinding */
#ruler{position:absolute;will-change:opacity}
#ruler .body{position:absolute;background:linear-gradient(180deg,#C8B58C,#A8946A);border:3px solid #8A6A3A;border-radius:6px;box-shadow:0 8px 20px rgba(60,40,10,.28)}
#ruler .axis{position:absolute;background:#6B4E2E}
#ruler .tick{position:absolute;background:#6B4E2E}
#ruler .num{position:absolute;font-family:'JetBrains Mono','DejaVu Sans Mono',monospace;font-weight:800;color:#6B4E2E}
#ruler .hl{position:absolute;border-radius:4px;background:linear-gradient(90deg,#E8B32E,#D97A2E);opacity:0;box-shadow:0 0 16px rgba(232,179,46,.6)}
#concrete{position:absolute;left:0;width:100%;background:linear-gradient(180deg,#BCC2C6 0%,#A9B0B7 100%)}
#marker{position:absolute;border-radius:999px;background:repeating-linear-gradient(90deg,#E8B32E 0 46px,#3A2C1E 46px 58px);box-shadow:0 4px 10px rgba(60,40,10,.3);will-change:opacity}
#baseboard{position:absolute;left:0;width:100%;background:#7E9A8C}
#tableT{position:absolute;will-change:opacity}
#tableT .slab{position:absolute;background:linear-gradient(180deg,#C8B58C,#A8946A);border-radius:10px;box-shadow:0 10px 22px rgba(60,40,10,.32)}
#tableT .leg{position:absolute;background:#8A7A5A;border-radius:4px;width:26px}
#boardSheet{position:absolute;will-change:opacity}
#boardSheet .board{position:absolute;background:linear-gradient(180deg,#D9A85E,#C08E48);border:3px solid #8A6A3A;border-radius:6px;box-shadow:0 8px 20px rgba(60,40,10,.3)}
#boardSheet .pline{position:absolute;background:#8A6A3A;border-radius:2px}
#boardSheet .plab{position:absolute;font-family:'JetBrains Mono','DejaVu Sans Mono',monospace;font-weight:800;color:#5E4A26}
#boardSheet .tri{position:absolute;width:0;height:0;border-left:12px solid transparent;border-right:12px solid transparent;border-bottom:22px solid #4CAF7A}
#pegboard{position:absolute;will-change:opacity}
#pegboard .board{position:absolute;background:#EFE8D0;border:3px solid #8A9A8C;border-radius:8px;
  background-image:radial-gradient(circle,#C2C6AE 1.6px,transparent 1.8px);background-size:16px 16px;box-shadow:0 12px 26px rgba(60,40,10,.35)}
#pegboard .tool .metal{position:absolute;background:linear-gradient(180deg,#9AA6B4,#6E7A8A);border-radius:3px}
#pegboard .tool .wood{position:absolute;background:linear-gradient(180deg,#D9B87C,#B89456);border-radius:3px}
.shelf{position:absolute;background:linear-gradient(180deg,#C8B58C,#A8946A);border:3px solid #8A6A3A;border-radius:6px;box-shadow:0 6px 14px rgba(30,18,4,.3);will-change:opacity}
.shoe{position:absolute;will-change:transform,opacity}
.shoe .bd{position:absolute;border-radius:16px 12px 5px 5px;background:linear-gradient(180deg,#E8843A,#C85E20);box-shadow:0 6px 14px rgba(30,18,4,.35)}
.shoe .sol{position:absolute;background:#FFFDF6;border-radius:5px}
.shoe.lone .bd{background:linear-gradient(180deg,#9AA6B4,#6E7A8A)}
.panelI{position:absolute;background:linear-gradient(180deg,#3A2A50,#2A1E38);border-radius:16px;border:4px solid #E8B32E;box-shadow:0 16px 38px rgba(30,18,4,.5);will-change:transform,opacity}
.tapeC{position:absolute;background:rgba(232,179,46,.5);border-radius:3px;box-shadow:0 2px 5px rgba(30,18,4,.25)}
.pHd{font-weight:800;color:#FFF6E6;letter-spacing:.10em;text-align:center}
.pBig{font-family:'JetBrains Mono','DejaVu Sans Mono',monospace;font-weight:800;color:#F2CE8E;text-align:center;opacity:0;will-change:opacity}
.pRow{display:flex;align-items:center;opacity:0}
.pDot{border-radius:50%;flex:none}
.pName{font-weight:800;color:#FFF6E6;flex:none}
.pNote{display:flex;align-items:center;justify-content:center;background:rgba(232,179,46,.22);border:2px solid rgba(232,179,46,.6);border-radius:10px;color:#F2CE8E;font-weight:800;letter-spacing:.05em;text-align:center;opacity:0;will-change:opacity}
.chipA{display:flex;align-items:center;justify-content:center;border-radius:12px;font-family:'JetBrains Mono','DejaVu Sans Mono',monospace;font-weight:800;color:#FFF6E6;background:#4A3A62;box-shadow:0 8px 18px rgba(30,18,4,.4);opacity:0;will-change:opacity}
.stamp{position:absolute;display:flex;align-items:center;justify-content:center;border-radius:999px;background:linear-gradient(92deg,#7FA6BF 0%,#D97A2E 52%,#E8B32E 100%);color:#22160C;font-weight:800;letter-spacing:.06em;box-shadow:0 12px 26px rgba(30,18,4,.45);will-change:transform,opacity}
.kcol{position:absolute;border-radius:12px;border:3px solid;background:rgba(255,253,246,.06);opacity:0;will-change:opacity}
.kcol .kh{font-weight:800;text-align:center;letter-spacing:.08em}
.kcol .kd{font-weight:700;color:#FFF6E6;text-align:center}
.kcol .cwrap{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.kcol .chipA{background:#4A3A62}
#divider{position:absolute;background:linear-gradient(180deg,rgba(232,179,46,0),#E8B32E,rgba(232,179,46,0));opacity:0;will-change:opacity}
.numline{position:absolute;will-change:opacity}
.numline .bar{position:absolute;background:#F2CE8E;border-radius:3px}
.numline .tickm{position:absolute;background:rgba(242,206,142,.7)}
.numline .dot{position:absolute;border-radius:50%;background:#D97A2E;box-shadow:0 0 12px rgba(217,122,46,.7);opacity:0;will-change:opacity}
.numline .lab{position:absolute;font-family:'JetBrains Mono','DejaVu Sans Mono',monospace;font-weight:800;color:#F2CE8E;opacity:0;will-change:opacity}
.vrow{display:flex;align-items:center;opacity:0}
.vrow .vd{border-radius:50%;flex:none}
.vrow .vt{font-weight:700;color:#FFF6E6}
.valCard{position:absolute;display:flex;align-items:center;justify-content:center;border-radius:10px;background:linear-gradient(180deg,#FFFDF6,#F2E6C6);border:3px solid #C8A86E;font-family:'JetBrains Mono','DejaVu Sans Mono',monospace;font-weight:800;color:#3A2C1E;box-shadow:0 8px 18px rgba(30,18,4,.35);will-change:transform,opacity}
.lead{position:absolute;background:#C8A86E;opacity:0;will-change:opacity}
.qmark{position:absolute;color:#D97A2E;font-weight:800;text-shadow:0 5px 0 rgba(0,0,0,.25);will-change:transform,opacity}
.title{position:absolute;left:0;width:100%;text-align:center;font-weight:800;color:#3A2E20;letter-spacing:.04em;text-shadow:0 5px 0 rgba(255,255,255,.45),0 12px 26px rgba(90,50,10,.22);will-change:transform,opacity}
#pil{position:absolute;border-radius:999px;background:linear-gradient(92deg,#7FA6BF 0%,#D97A2E 52%,#E8B32E 100%);color:#22160C;font-weight:800;display:flex;align-items:center;justify-content:center;will-change:transform,opacity;box-shadow:0 10px 24px rgba(30,18,4,.4)}
#endcard{position:absolute;left:0;width:100%;opacity:0;will-change:transform,opacity}
#fplate{background:rgba(26,16,10,.62);border-radius:28px;padding:14px 44px;width:max-content;margin:0 auto;box-shadow:0 14px 34px rgba(30,18,4,.4)}
#f_url{font-weight:800;text-align:center}
#f_bar{height:7px;border-radius:4px;background:linear-gradient(90deg,#7FA6BF,#D97A2E,#E8B32E)}
#subbar{position:absolute;left:50%;transform:translateX(-50%);background:rgba(26,16,10,.86);border-radius:20px;padding:18px 32px;text-align:center;box-shadow:0 14px 34px rgba(30,18,4,.5);will-change:transform,opacity}
#sub_id{font-weight:800;color:#FFFFFF;line-height:1.26}
#sub_en{color:#D9C8B4;font-weight:600}
#wm{position:absolute;font-weight:800;letter-spacing:.34em;color:#F6EFE2;font-family:'JetBrains Mono','DejaVu Sans Mono',monospace;border:1.5px solid rgba(246,239,226,.42);will-change:transform}
.bchar{position:absolute;will-change:transform,opacity}
.bchar .core{position:absolute;border-radius:100%}
.bchar .shine{position:absolute;border-radius:50%;background:rgba(255,255,255,.72);filter:blur(2px)}
.bsh{position:absolute;border-radius:50%;background:rgba(40,24,8,.4);filter:blur(2px)}
.spark{position:absolute;width:34px;height:34px;opacity:0}
.spark .sa{position:absolute;background:#FFE9A8;border-radius:3px}
</style>
</head>
<body>
<div id="stage">
  <div id="world">
    <div id="shopwall"></div>
    <div id="tilesun"></div>
    <div id="ceiling"></div>
    <div class="lampW"><div class="cord"></div><div class="dome"></div><div class="glow"></div></div>
    <div class="lampW"><div class="cord"></div><div class="dome"></div><div class="glow"></div></div>
    <div id="ruler"><div class="body"></div><div class="hl"></div><div class="axis"></div></div>
    <div id="concrete"></div>
    <div id="marker"></div>
    <div id="baseboard"></div>
    <div id="tableT"><div class="slab"></div><div class="leg"></div><div class="leg"></div></div>
    <div id="boardSheet"><div class="board"></div><div class="tri"></div></div>
    <div id="pegboard"><div class="board"></div></div>
    <div id="props"></div>
    <div id="chars"></div>
  </div>
  <div id="flash"></div>
  <div id="fade"></div>
  <div id="pil">KIRIM JAWABANMU DI KOMENTAR YA</div>
  <div id="endcard">
    <div id="fplate"><div id="f_url">AKIOMIDA.COM</div></div>
    <div id="f_bar"></div>
  </div>
  <div class="title" id="t0">GENAP ATAU GANJIL?</div>
  <div class="title" id="t1">APA ITU GENAP?</div>
  <div class="title" id="t2">APA ITU GANJIL?</div>
  <div class="title" id="t3">ANGKA AKHIRNYA</div>
  <div class="title" id="t4">POLA PENJUMLAHAN</div>
  <div class="title" id="t5">GILIRANMU!</div>
  <div id="subbar"><div id="sub_id"></div><div id="sub_en"></div></div>
  <div id="wm">AKIOMIDA</div>
</div>
<script>
const Q=new URLSearchParams(location.search);
const ORIENT=Q.get('o')||'landscape';
const W=ORIENT==='portrait'?1080:1920;
const H=ORIENT==='portrait'?1920:1080;
const P = ORIENT==='portrait' ? {
  floorY:1080, bbY:1064, ceilH:110,
  tableX:50, tableW:330, slabY:830, slabH:52, legBot:1080,
  bdW:300, bdH:96, bdCX:215, bdCY:778,
  rulerX:40, rulerY:120, rulerW:1000, rulerH:46, rulFS:14,
  stampX:470, stampY:690, stampW:480, stampH:60, stampFS:26,
  panelX:400, panelY:470, panelW:610, panelH:360,
  pilX:260, pilY:850, pilW:560, pilH:64, pilFS:23,
  ecY:830, barW:420,
  titleY:300, titleS0:80, titleSN:74,
  subTop:1170, subId:40, subEn:22, subMax:880,
  ballD:110, groundY:1120, wmY:1800, wmFS:20,
  lampsX:[340,700], lampsY:[168,150], lampsD:[74,62],
  markX:220, markY:1096, markW:640, markH:16,
  pegX:830, pegY:870, pegW:180, pegH:140,
  cardW:150, cardH:64, cardFS:26
} : {
  floorY:508, bbY:494, ceilH:70,
  tableX:140, tableW:360, slabY:540, slabH:40, legBot:700,
  bdW:340, bdH:82, bdCX:320, bdCY:494,
  rulerX:140, rulerY:78, rulerW:600, rulerH:34, rulFS:12,
  stampX:960, stampY:440, stampW:560, stampH:56, stampFS:24,
  panelX:760, panelY:250, panelW:1020, panelH:290,
  pilX:680, pilY:600, pilW:560, pilH:60, pilFS:22,
  ecY:400, barW:520,
  titleY:150, titleS0:88, titleSN:72,
  subTop:740, subId:38, subEn:20, subMax:1360,
  ballD:96, groundY:660, wmY:1010, wmFS:18,
  lampsX:[560,1000], lampsY:[112,100], lampsD:[62,52],
  markX:620, markY:672, markW:680, markH:14,
  pegX:1450, pegY:560, pegW:220, pegH:130,
  cardW:128, cardH:56, cardFS:24
};
const stage=document.getElementById('stage');
stage.style.width=W+'px';stage.style.height=H+'px';

/* ---------- util & easing ---------- */
const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,p)=>a+(b-a)*p;
const seg=(t,a,d)=>clamp((t-a)/d,0,1);
const eio=p=>p<0.5?2*p*p:1-Math.pow(-2*p+2,2)/2;
const eoe=p=>1-Math.pow(1-p,3);
const smz=(t,a,b,f)=>f?clamp((t-a)/f,0,1)*clamp((b-t)/f,0,1):(t>=a&&t<b?1:0);
function popA(el,t,t0,d,ov,op0,op1){
  const o=clamp(seg(t,t0,0.3)*(1-seg(t,op1,0.35)),0,1);
  const s2=1+(ov/100)*Math.sin(clamp(seg(t,t0,d),0,1)*Math.PI)*(1-seg(t,op1,0.35));
  el.style.opacity=String(o);
  el.style.transform=`scale(${s2.toFixed(3)})`;
}
let _seed=20261120;
const rnd=()=>{_seed|=0;_seed=_seed+0x6D2B79F5|0;let z=Math.imul(_seed^_seed>>>15,1|_seed);
  z=z+Math.imul(z^z>>>7,61|z)^z;return((z^z>>>14)>>>0)/4294967296;};

/* ---------- dinding gudang, plafon, lampu dome industri, lantai beton sejuk ---------- */
const wallEl=document.getElementById('shopwall');
wallEl.style.cssText+=`height:${P.floorY}px;`;
const floorEl=document.getElementById('concrete');
floorEl.style.cssText+=`top:${P.floorY}px;height:${H-P.floorY}px;`;
const bbEl=document.getElementById('baseboard');
bbEl.style.cssText+=`top:${P.bbY}px;height:${P.floorY-P.bbY}px;`;
const ceilEl=document.getElementById('ceiling');
ceilEl.style.cssText+=`height:${P.ceilH}px;`;
{
  const band=document.createElement('div');
  band.className='beam';
  band.style.cssText+=`left:0;top:0;width:100%;height:${Math.round(P.ceilH*0.32)}px;`;
  ceilEl.appendChild(band);
  const nb=ORIENT==='portrait'?3:4;
  for(let i=0;i<nb;i++){
    const bx=lerp(W*0.08,W*0.92,i/(nb-1));
    const bm=document.createElement('div');
    bm.className='beam';
    const bw=Math.round(P.ceilH*0.20);
    bm.style.cssText+=`left:${bx-bw/2}px;top:0;width:${bw}px;height:${P.ceilH}px;border-radius:${bw/2}px ${bw/2}px 8px 8px;`;
    ceilEl.appendChild(bm);
  }
}
const LAMPS=[];
document.querySelectorAll('.lampW').forEach((lw,i)=>{
  const lx=P.lampsX[i], ly=P.lampsY[i], ld=P.lampsD[i];
  const cord=lw.querySelector('.cord');
  cord.style.cssText+=`left:${lx-2}px;top:${Math.round(P.ceilH*0.9)}px;height:${ly-Math.round(P.ceilH*0.9)}px;`;
  const dome=lw.querySelector('.dome');
  dome.style.cssText+=`left:${lx-ld/2}px;top:${ly}px;width:${ld}px;height:${Math.round(ld*0.52)}px;`;
  const glow=lw.querySelector('.glow');
  glow.style.cssText+=`left:${lx-ld*0.9}px;top:${ly+Math.round(ld*0.2)}px;width:${ld*1.8}px;height:${ld*1.8}px;`;
  LAMPS.push({lw,ph:i*2.1});
});
/* marka safety kuning di lantai gudang */
const markEl=document.getElementById('marker');
markEl.style.cssText+=`left:${P.markX}px;top:${P.markY}px;width:${P.markW}px;height:${P.markH}px;`;

/* ---------- rak pasangan sepatu di dinding (ikon dunia Gudang Papasan) ---------- */
function makeShoe(parent,x,y,w,h,lone){
  const s=document.createElement('div');
  s.className='shoe'+(lone?' lone':'');
  s.style.cssText+=`left:${x}px;top:${y}px;width:${w}px;height:${h+8}px;`;
  const bd=document.createElement('div');
  bd.className='bd';
  bd.style.cssText+=`left:0;top:0;width:${w}px;height:${h}px;`;
  const sol=document.createElement('div');
  sol.className='sol';
  sol.style.cssText+=`left:-3px;top:${h}px;width:${w+6}px;height:7px;`;
  s.appendChild(bd);s.appendChild(sol);
  parent.appendChild(s);
  return {root:s,bd};
}
const rackEl=document.getElementById('ruler');
rackEl.querySelector('.hl').remove();
rackEl.querySelector('.axis').remove();
{
  const RW=ORIENT==='portrait'?44:36, RH=ORIENT==='portrait'?24:20;
  const planks=ORIENT==='portrait'?[120,186,252]:[260,306,352];
  const body=rackEl.querySelector('.body');
  body.style.cssText+=`left:${P.rulerX}px;top:${planks[0]}px;width:${P.rulerW}px;height:14px;`;
  planks.slice(1).forEach((py,i)=>{
    const pk=document.createElement('div');
    pk.className='body';
    pk.style.cssText+=`left:${P.rulerX}px;top:${py}px;width:${P.rulerW}px;height:14px;`;
    rackEl.appendChild(pk);
  });
  /* sepatu dekoratif: dua rak penuh pasangan, rak bawah ada yang nanggung */
  const spots=ORIENT==='portrait'
    ? [[100,0,0],[100+RW+6,0,1],[320,1,0],[320+RW+6,1,1],[470,1,2],[660,2,0],[660+RW+6,2,1],[820,2,2]]
    : [[200,0,0],[200+RW+6,0,1],[360,1,0],[360+RW+6,1,1],[480,1,2],[260,2,0],[260+RW+6,2,1],[420,2,2]];
  spots.forEach(([sx,si,li])=>{
    makeShoe(rackEl,sx,planks[si]-RH-4,RW,RH,li===2);
  });
}

/* ---------- bangku sortir dan tumpukan shoebox ---------- */
const tableEl=document.getElementById('tableT');
{
  const slab=tableEl.querySelector('.slab');
  slab.style.cssText+=`left:${P.tableX}px;top:${P.slabY}px;width:${P.tableW}px;height:${P.slabH}px;`;
  const legs=tableEl.querySelectorAll('.leg');
  legs[0].style.cssText+=`left:${P.tableX+26}px;top:${P.slabY+P.slabH}px;height:${P.legBot-P.slabY-P.slabH}px;`;
  legs[1].style.cssText+=`left:${P.tableX+P.tableW-52}px;top:${P.slabY+P.slabH}px;height:${P.legBot-P.slabY-P.slabH}px;`;
}
const boardEl=document.getElementById('boardSheet');
{
  const bwx=P.bdCX-P.bdW/2, bwy=P.bdCY-P.bdH/2;
  const board=boardEl.querySelector('.board');
  board.style.cssText+=`left:${bwx}px;top:${bwy}px;width:${P.bdW}px;height:${P.bdH}px;`;
  const tri=boardEl.querySelector('.tri');
  tri.remove();
  const lid=document.createElement('div');
  lid.className='pline';
  lid.style.cssText+=`left:${bwx}px;top:${bwy+Math.round(P.bdH*0.30)}px;width:${P.bdW}px;height:4px;`;
  boardEl.appendChild(lid);
  const lb=document.createElement('div');
  lb.className='plab';
  lb.style.cssText+=`left:${bwx}px;top:${bwy+Math.round(P.bdH*0.48)}px;width:${P.bdW}px;text-align:center;font-size:${ORIENT==='portrait'?17:15}px;letter-spacing:.2em;`;
  lb.textContent='PAPASAN';
  boardEl.appendChild(lb);
}

/* ---------- tanda PAPASAN di dinding ---------- */
const pegEl=document.getElementById('pegboard');

  [3.1,'Berdua-berdua rapi. Tapi tujuh? Nanggung satu.','Pairs are neat. But seven? One is left out.','#FFFFFF'],
  [6.6,'Yang bisa berpasangan rapi itu namanya genap.','Numbers that pair up neatly are called even.','#FFFFFF'],
  [9.6,'Genap: habis dibagi dua, tanpa sisa.','Even: divisible by two, with no remainder.','#FFFFFF'],
  [13.0,'Delapan dibagi dua? Empat pasang, sisa nol.','Eight over two? Four pairs, zero left.','#FFFFFF'],
  [16.4,'Kalau dibagi dua masih nyisa satu?','What if dividing by two leaves one?','#FFFFFF'],
  [19.3,'Namanya ganjil: 7 dibagi 2 = 3 sisa 1.','That is odd: 7 over 2 is 3 with 1 left.','#FFFFFF'],
  [22.5,'Sebelas juga: lima sisa satu. Selalu nyisa.','Eleven too: five, one left. Always one.','#FFFFFF'],
  [25.5,'Terus... 0 masuk mana, dong?','So where does 0 belong, anyway?','#FFFFFF'],
  [28.5,'Nol dibagi dua = nol, tanpa sisa. GENAP!','Zero over two is zero, no remainder. Even!','#D97A2E'],
  [32.7,'Cara cepat: cuma lihat angka terakhirnya.','Quick trick: just look at the last digit.','#FFFFFF'],
  [35.1,'Akhiran 0 2 4 6 8? Pasti genap.','Ending 0 2 4 6 8? Definitely even.','#FFFFFF'],
  [38.6,'Akhiran 1 3 5 7 9? Pasti ganjil.','Ending 1 3 5 7 9? Definitely odd.','#FFFFFF'],
  [41.5,'Pola keren: ganjil plus ganjil = genap!','Cool pattern: odd plus odd gives even!','#D97A2E'],
  [44.9,'Empat soal, kirim jawabanmu di komentar.','Four questions: send your answers below.','#FFFFFF'],
  [50.07,'Terima kasih sudah menonton.','Thanks for watching.','#FFE9A8'],
];
let subIdx=-1;
function renderSub(t){
  let i=0;
  for(let k=0;k<SUBS.length;k++){ if(t>=SUBS[k][0]-0.001) i=k; }
  const nxt=i+1<SUBS.length?SUBS[i+1][0]:52.4;
  const o=clamp(Math.min(seg(t,SUBS[i][0],0.25), 1-seg(t,nxt-0.14,0.14)),0,1);
  if(i!==subIdx){
    subIdx=i;
    subId.textContent=SUBS[i][1];
    subId.style.color=SUBS[i][3];
    subEn.textContent=SUBS[i][2];
  }
  subbar.style.opacity=(o*0.98).toFixed(3);
  const pop=1+0.018*Math.sin(clamp(seg(t,SUBS[i][0],0.45),0,1)*Math.PI);
  subbar.style.transform=`translateX(-50%) scale(${pop.toFixed(3)})`;
}

/* ---------- judul bab (rata tengah, aturan 28) ---------- */
const TITLES=[['t0',0.35],['t1',6.6],['t2',17.3],['t3',32.7],['t4',40.6],['t5',44.3]]
  .map(([id,t0],i)=>({el:document.getElementById(id),t0:t0,i:i}));
TITLES.forEach((o)=>{
  o.el.style.top=(o.i===0?P.titleY:P.titleY+14)+'px';
  o.el.style.fontSize=(o.i===0?P.titleS0:P.titleSN)+'px';
  if(o.i===0||o.i===2||o.i===4)o.el.style.color='#2E5A8A';
});

/* ---------- beat, masterplan mentor (lantai depan, tak menembus properti) ---------- */
const IMP=[0.6,4.0,6.6,26.0,32.7,38.6,44.3];
const SPARKS=[[4.0,5.6],[47.7,49.6]];
const GESTS=[
  [1.4,0.8,'nod',3],
  [8.0,0.7,'tilt',5],
  [11.5,0.7,'nod',3],
  [17.8,0.7,'nod',3],
  [20.6,0.7,'tilt',5],
  [26.2,0.7,'nod',3],
  [33.4,0.7,'tilt',5],
  [36.8,0.7,'nod',3],
  [41.0,0.7,'tilt',4],
  [45.1,0.8,'nod',3]
];
function imp(t){
  let a=0;
  for(const bt of IMP){
    const d=t-bt;
    if(d>=0&&d<0.5){ const p=d/0.5; a=Math.max(a,(1-p)*0.85); }
  }
  return a;
}
const WAY = ORIENT==='portrait'
  ? [[0.55,175],[6.6,705],[17.3,640],[32.7,640],[40.6,705],[44.2,600]]
  : [[0.55,260],[6.6,1270],[17.3,1200],[32.7,1200],[40.6,1270],[44.2,1100]];

/* ---------- RENDER PER FRAME ---------- */
const world=document.getElementById('world');
const flash=document.getElementById('flash');
const fade=document.getElementById('fade');
const tilesun=document.getElementById('tilesun');
let _roll=0,_mxPrev=null;
function renderFrame(t){
  /* gudang makin hangat menjelang penutup: lampu dome menyala lembut */
  const nk=seg(t,36.0,8.0);
  tilesun.style.background=`rgba(58,38,26,${(nk*0.22).toFixed(3)})`;
  for(const L of LAMPS){
    const sw=Math.sin(t*0.8+L.ph)*1.6;
    L.lw.style.transform=`rotate(${sw.toFixed(2)}deg)`;
  }
  /* penutup bersih (aturan 28): konten keluar di 49.8 */
  const exo=1-seg(t,49.8,0.5);
  /* hook: sepatu berpasangan muncul, pasangan merapat, ada yang nanggung */
  for(const s of HOOK){
    const o=clamp(seg(t,s.t0,0.3)*(1-seg(t,6.4,0.3)),0,1);
    const burst=t>=4.0?1+0.07*Math.sin(clamp(seg(t,4.0,0.4),0,1)*Math.PI):1;
    s.root.style.opacity=o.toFixed(3);
    s.root.style.transform=`translateX(${(s.snap?(-8*clamp(seg(t,2.1,0.7),0,1)*(1-seg(t,6.4,0.3))):0).toFixed(1)}px) scale(${burst.toFixed(3)})`;
    if(s.bd)s.bd.style.boxShadow=t>=4.0?'0 0 20px rgba(232,179,46,.6)':'0 6px 14px rgba(30,18,4,.35)';
  }
  {
    const qo=clamp(seg(t,3.55,0.4)*(1-seg(t,6.4,0.3)),0,1);
    QM.el.style.opacity=qo.toFixed(3);
    QM.el.style.transform=`translateY(${(-6+6*Math.sin(t*3)).toFixed(1)}px)`;
  }
  popA(stamp,t,4.6,0.55,7,0,6.4);
  /* panel 1: bilangan genap */
  popA(panel1,t,7.0,0.6,5,0,17.0);
  popA(p1Big,t,7.3,0.5,5,0,17.0);
  for(const r of P1ROWS){ r.el.style.opacity=seg(t,r.t0,0.45).toFixed(3); }
  for(const c of P1CHIPS){
    c.el.style.opacity=(clamp(seg(t,c.t0,0.35),0,1)*(1-seg(t,17.0,0.3))).toFixed(3);
  }
  popA(p1Note,t,13.0,0.5,5,0,17.0);
  /* panel 2: bilangan ganjil */
  popA(panel2,t,17.5,0.55,5,0,25.8);
  popA(p2Big,t,17.8,0.5,5,0,25.8);
  for(const r of P2ROWS){ r.el.style.opacity=seg(t,r.t0,0.45).toFixed(3); }
  for(const c of P2CHIPS){
    c.el.style.opacity=(clamp(seg(t,c.t0,0.35),0,1)*(1-seg(t,25.8,0.3))).toFixed(3);
  }
  popA(p2Note,t,22.5,0.5,5,0,25.8);
  /* panel kejutan nol: beat emas 26.0 */
  popA(panelN,t,26.2,0.55,5,0,32.5);
  popA(pNBig,t,26.5,0.5,6,0,32.5);
  for(const r of NROWS){ r.el.style.opacity=seg(t,r.t0,0.4).toFixed(3); }
  popA(nNote,t,29.4,0.45,5,0,32.5);
  /* panel 3: cara cepat angka akhir */
  popA(panel3,t,33.0,0.55,5,0,40.5);
  for(const r of P3ROWS){ r.el.style.opacity=seg(t,r.t0,0.45).toFixed(3); }
  for(const c of P3CHIPS){
    c.el.style.opacity=(clamp(seg(t,c.t0,0.35),0,1)*(1-seg(t,40.5,0.3))).toFixed(3);
  }
  popA(p3Note,t,37.8,0.45,5,0,40.5);
  /* panel 4: pola penjumlahan */
  popA(panel4,t,40.9,0.55,5,0,44.3);
  for(const r of P4ROWS){ r.el.style.opacity=seg(t,r.t0,0.4).toFixed(3); }
  popA(p4Note,t,42.8,0.45,5,0,44.3);
  popA(p4Note2,t,43.2,0.45,5,0,44.3);
  /* papan tugas uji (aturan 30): soal bernomor + kartu besar */
  popA(panelUji,t,44.4,0.55,5,0,49.8);
  ujiHd.style.opacity=(seg(t,44.55,0.35)*exo).toFixed(3);
  for(const rr of UJIS){ rr.el.style.opacity=seg(t,rr.t0,0.35).toFixed(3); }
  for(let i=0;i<CARDS.length;i++){
    const cc=CARDS[i];
    const inA=clamp(seg(t,cc.pop,0.3),0,1);
    cc.el.style.opacity=(inA*exo).toFixed(3);
    const s2=1+0.09*Math.sin(clamp(seg(t,cc.pop,0.4),0,1)*Math.PI);
    cc.el.style.transform=`scale(${s2.toFixed(3)})`;
    cc.el.style.borderColor=inA>0.9&&t<cc.pop+0.45?'#E8B32E':'#C8A86E';
  }
  popA(ujiNote,t,46.4,0.45,5,0,49.8);
  popA(pil,t,47.7,0.6,6,0,49.8);
  /* penutup bersih (aturan 28): bangku, shoebox, tanda keluar di 49.8 */
  tableEl.style.opacity=exo.toFixed(3);
  boardEl.style.opacity=exo.toFixed(3);
  pegEl.style.opacity=exo.toFixed(3);
  markEl.style.opacity=String(clamp(0.96*exo+0.04,0.04,1));
  /* mentor: menggelinding antar stasiun di marka safety */
  let bx=WAY[WAY.length-1][1];
  for(let k=0;k<WAY.length-1;k++){
    const [w0,x0]=WAY[k],[w1,x1]=WAY[k+1];
    if(t>=w0&&t<w1){ bx=lerp(x0,x1,eio(seg(t,w0,w1-w0))); break; }
  }
  if(t>=WAY[WAY.length-1][0])bx=WAY[WAY.length-1][1];
  if(_mxPrev===null)_mxPrev=bx;
  _roll+=(bx-_mxPrev)/(P.ballD/2)*(180/Math.PI);
  _mxPrev=bx;
  const ep=seg(t,0.6,0.55);
  let hy2=0, lrot=0, drot=0, txj=0;
  for(const [gs,gd,gt,ga] of GESTS){
    const d2=t-gs;
    if(d2>=0&&d2<gd){
      const p=d2/gd, w=Math.sin(p*Math.PI);
      if(gt==='tilt'||gt==='lean'){ lrot+=ga*w; }
      else if(gt==='nod'){ lrot+=ga*Math.sin(p*2*Math.PI); }
      else if(gt==='shiver'){ txj=ga*Math.sin(p*40)*(1-p); }
      else if(gt==='spin'){ drot+=ga*eio(p); }
    }
  }
  mentor.el.style.left=bx.toFixed(1)+'px';
  mentor.el.style.opacity=String(clamp(ep*3,0,1)*exo);
  mentor.el.style.top=(P.groundY-P.ballD+hy2).toFixed(1)+'px';
  mentor.el.style.transform=`translateX(${txj.toFixed(1)}px) rotate(${(_roll+lrot+drot).toFixed(2)}deg) scale(1)`;
  msh.style.left=bx.toFixed(1)+'px';
  msh.style.top=(P.groundY-10)+'px';
  msh.style.opacity=String(clamp(ep*3,0,1)*exo*clamp(0.42+hy2*0.006,0.18,0.5));
  msh.style.transform=`scaleX(${clamp((1+hy2*0.004),0.4,1.08).toFixed(3)})`;
  /* percikan bintang */
  let spo=0;
  for(const [sa,sb] of SPARKS){
    if(t>=sa&&t<sb) spo=smz(t,sa,sb,0.35)*(0.65+0.2*Math.sin(t*7));
  }
  spark.style.opacity=String(clamp(spo,0,1));
  spark.style.left=(bx+62).toFixed(1)+'px';
  spark.style.top=(P.groundY-150+Math.sin(t*2)*4).toFixed(1)+'px';
  spark.style.transform=`rotate(${((t*28)%360).toFixed(0)}deg) scale(${(0.8+0.15*Math.sin(t*7)).toFixed(3)})`;
  /* judul bab (judul terakhir ikut keluar saat penutup agar endcard sendirian) */
  for(let i=0;i<TITLES.length;i++){
    const o=TITLES[i];
    const tEnd=i+1<TITLES.length?TITLES[i+1].t0:50.2;
    const oin=seg(t,o.t0,0.35)*(1-seg(t,tEnd-0.25,0.3));
    const sc2=1+0.035*Math.sin(clamp(seg(t,o.t0,0.7),0,1)*Math.PI);
    o.el.style.opacity=oin.toFixed(3);
    o.el.style.transform=`scale(${sc2.toFixed(3)})`;
  }
  /* endcard penutup bersih: AKIOMIDA.COM muncul SENDIRIAN di gudang yang tenang */
  const eci=eio(seg(t,50.2,0.7));
  endcard.style.opacity=eci.toFixed(3);
  endcard.style.transform=`translateY(${((1-eci)*16).toFixed(1)}px) scale(${(0.94+0.06*eci).toFixed(3)})`;
  fBar.style.width=(seg(t,50.9,0.5)*P.barW).toFixed(0)+'px';
  renderSub(t);
  /* kamera tenang */
  const im=imp(t);
  const shx=Math.sin(t*47)*2.5*im, shy=Math.sin(t*39+1.7)*1.8*im;
  world.style.transform=`translate(${shx.toFixed(2)}px,${(shy+Math.sin(t*0.35)*3).toFixed(2)}px)`;
  flash.style.opacity=(im*0.07).toFixed(3);
  fade.style.opacity=String(clamp(1-seg(t,0.05,0.5),0,1)*0.96+clamp(seg(t,51.4,0.6),0,1));
}
renderFrame(0);
window.__ready=true;
</script>
</body>
</html>
