<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
/*__FONTS__*/
*{box-sizing:border-box}
body{margin:0;background:#0B1220;font-family:'Poppins','Noto Sans',sans-serif;-webkit-font-smoothing:antialiased}
#stage{position:relative;overflow:hidden;background:linear-gradient(180deg,#7EC3EA 0%,#A8DCF2 46%,#DCEFF6 100%)}
#world{position:absolute;inset:0}
#flash{position:absolute;inset:0;background:#FFFFFF;opacity:0;pointer-events:none}
#fade{position:absolute;inset:0;background:#0B1220;opacity:0;pointer-events:none}
.center{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.mono{font-family:'JetBrains Mono','DejaVu Sans Mono',monospace}
#skydusk{position:absolute;inset:0;background:linear-gradient(180deg,#232C63 0%,#5A3E7A 42%,#C05A72 72%,#E9975E 100%);opacity:0;will-change:opacity}
#stars{position:absolute;inset:0}
#stars i{position:absolute;border-radius:50%;background:#FFF7D6;box-shadow:0 0 6px rgba(255,247,214,.9)}
.cloud{position:absolute;will-change:transform,opacity}
.cloud b{position:absolute;border-radius:999px;background:rgba(255,255,255,.94);box-shadow:0 10px 30px rgba(120,160,200,.25)}
#town{position:absolute;left:0;top:0;width:100%;will-change:opacity}
.bld{position:absolute;border-radius:6px 6px 0 0}
.win{position:absolute;border-radius:3px;background:#39638B;box-shadow:inset 0 3px 0 rgba(0,0,0,.18)}
.plaque{position:absolute;border-radius:12px;background:#FFF9E8;border:3px solid #35507A;box-shadow:0 6px 0 rgba(0,0,0,.14);display:flex;align-items:center;justify-content:center;will-change:transform,opacity}
.plaque b{font-family:'JetBrains Mono','DejaVu Sans Mono',monospace;color:#1B2437;font-weight:800}
.shopwin{position:absolute;border-radius:12px;background:rgba(255,253,244,.96);box-shadow:0 12px 30px rgba(30,45,80,.25),inset 0 0 0 3px #E7D9B8;will-change:transform,opacity}
.sit{position:absolute;inset:0}
.awn{position:absolute;border-radius:10px 10px 0 0;background:repeating-linear-gradient(90deg,#E15B5B 0 24px,#FFFFFF 24px 48px);box-shadow:0 8px 18px rgba(30,45,80,.22);will-change:transform,opacity}
.chip{position:absolute;border-radius:9px;background:rgba(20,28,48,.82);color:#FFFFFF;font-weight:800;font-family:'JetBrains Mono','DejaVu Sans Mono',monospace;will-change:transform,opacity;box-shadow:0 5px 14px rgba(0,0,0,.3);text-align:center}
#road{position:absolute;left:0;width:100%;background:linear-gradient(180deg,#3A4656 0,#2E3847 100%)}
#roadmark{position:absolute;left:0;width:100%;height:8px;background:repeating-linear-gradient(90deg,#F2D57E 0 70px,transparent 70px 130px);opacity:.75}
#curb{position:absolute;left:0;width:100%;background:#C9D3DA;border-radius:4px}
#walk{position:absolute;left:0;width:100%;background:linear-gradient(180deg,#D8CDB4 0,#CBBFA2 100%)}
#plaza{position:absolute;left:0;width:100%;background:linear-gradient(180deg,#E4D9BC 0,#D8CCAB 100%);box-shadow:inset 0 10px 0 rgba(255,255,255,.35);will-change:opacity}
#cars{position:absolute;inset:0}
.car{position:absolute;will-change:transform,opacity}
.car .body{position:absolute;inset:0;border-radius:10px 14px 6px 6px;box-shadow:inset 0 -8px 0 rgba(0,0,0,.18)}
.car .top{position:absolute;border-radius:8px 10px 0 0}
.car .wh{position:absolute;bottom:-6px;width:30px;height:30px;border-radius:50%;background:#1B2437;box-shadow:inset 0 0 0 6px #55627A}
.tree{position:absolute;will-change:transform,opacity}
.tree .trunk{position:absolute;left:50%;bottom:0;width:14px;margin-left:-7px;border-radius:6px;background:linear-gradient(180deg,#8B5A2B,#6E4420)}
.tree .leaf{position:absolute;border-radius:50%;background:radial-gradient(circle at 35% 30%,#7CC66B 0%,#3F9B4F 70%,#2E7A3C 100%);box-shadow:0 8px 18px rgba(30,80,40,.25)}
.lamp{position:absolute;will-change:opacity}
.lamp .pole{position:absolute;left:50%;bottom:0;width:10px;margin-left:-5px;border-radius:5px;background:linear-gradient(180deg,#39445A,#222C3D)}
.lamp .head{position:absolute;left:50%;top:0;width:44px;height:16px;margin-left:-22px;border-radius:8px;background:#2E3847}
.lamp .glow{position:absolute;left:50%;top:-70px;width:150px;height:110px;margin-left:-75px;border-radius:50%;background:radial-gradient(circle,rgba(255,214,130,.55) 0%,rgba(255,214,130,0) 70%);opacity:0;will-change:opacity}
.board{position:absolute;border-radius:16px;box-shadow:0 14px 36px rgba(0,0,0,.28)}
.slate{background:linear-gradient(180deg,#20303F,#16222E);border:6px solid #6E4420;will-change:transform,opacity}
.fam{position:absolute;border-radius:22px;background:rgba(13,20,38,.9);will-change:transform,opacity;box-shadow:0 14px 40px rgba(0,0,0,.4);padding:20px 30px}
/* properti khusus bulina: keranjang nol, chip nol, kelereng, tanda tanya */
.zchip{position:absolute;border-radius:10px;background:rgba(13,20,38,.88);color:#FFE9A8;font-weight:800;letter-spacing:.1em;display:flex;align-items:center;justify-content:center;will-change:transform,opacity;box-shadow:0 8px 20px rgba(0,0,0,.32);text-align:center}
.zpart{position:absolute}
.marble{position:absolute;border-radius:50%;will-change:transform,opacity;box-shadow:0 4px 10px rgba(0,0,0,.28)}
.qmark{position:absolute;color:#FCD34D;font-weight:800;text-shadow:0 6px 0 rgba(0,0,0,.25);will-change:transform,opacity}
.bchar{position:absolute;will-change:transform,opacity}
.bchar .core{position:absolute;border-radius:50%}
.bchar .shine{position:absolute;border-radius:50%;background:rgba(255,255,255,.72);filter:blur(2px)}
.bsh{position:absolute;border-radius:50%;background:rgba(15,25,45,.28);filter:blur(2px)}
#fireflies{position:absolute;inset:0}
.title{position:absolute;left:0;width:100%;font-weight:800;color:#FFFFFF;letter-spacing:.04em;text-shadow:0 6px 0 rgba(0,0,0,.22),0 14px 30px rgba(0,0,0,.28);will-change:transform,opacity}
#cta{position:absolute;border-radius:18px;background:linear-gradient(180deg,rgba(19,28,48,.96),rgba(14,22,40,.96));box-shadow:0 18px 44px rgba(0,0,0,.4);will-change:transform,opacity}
#f_url{font-weight:800;text-align:center}
#f_bar{height:7px;border-radius:4px;background:linear-gradient(90deg,#22D3EE,#A78BFA,#FBBF24)}
#f_pill{position:absolute;border-radius:999px;background:linear-gradient(92deg,#22D3EE 0%,#A78BFA 52%,#FBBF24 100%);color:#0B1220;font-weight:800;display:flex;align-items:center;justify-content:center;will-change:transform,opacity;box-shadow:0 10px 24px rgba(0,0,0,.35)}
#subbar{position:absolute;left:50%;transform:translateX(-50%);background:rgba(13,20,38,.86);border-radius:20px;padding:20px 34px;text-align:center;box-shadow:0 14px 34px rgba(0,0,0,.38);will-change:transform,opacity}
#sub_id{font-weight:800;color:#FFFFFF;line-height:1.24}
#sub_en{color:#B9C7DC;font-weight:600}
#wm{position:absolute;font-weight:800;letter-spacing:.34em;color:#E7EDF6;font-family:'JetBrains Mono','DejaVu Sans Mono',monospace;border:1.5px solid rgba(231,237,246,.4);will-change:transform}
</style>
</head>
<body>
<div id="stage">
  <div id="world">
    <div id="skydusk"></div>
    <div id="stars"></div>
    <div id="clouds"></div>
    <div id="town"></div>
    <div id="road"></div>
    <div id="roadmark"></div>
    <div id="curb"></div>
    <div id="walk"></div>
    <div id="plaza"></div>
    <div id="cars"></div>
    <div id="streetprops"></div>
    <div id="fireflies"></div>
    <div id="chars"></div>
  </div>
  <div id="flash"></div>
  <div id="fade"></div>
  <div class="title" id="t0">MULAI DARI 1?</div>
  <div class="title" id="t1">BILANGAN ASLI</div>
  <div class="title" id="t2">KENAPA NOL?</div>
  <div class="title" id="t3">BILANGAN CACAH</div>
  <div class="title" id="t4">PERAN NOL</div>
  <div class="title" id="t5">LATIHAN KELERENG</div>
  <div id="cta">
    <div id="f_open">8 KELERENG, SEMUA DIBERIKAN.</div>
    <div id="f_open_e">All given away. How many are left? Comment your answer!</div>
    <div id="f_url">AKIOMIDA.COM</div>
    <div id="f_bar"></div>
    <div id="f_pill">TULIS DI KOMEN</div>
  </div>
  <div id="subbar"><div id="sub_id"></div><div id="sub_en"></div></div>
  <div id="wm">AKIOMIDA</div>
</div>
<script>
const Q=new URLSearchParams(location.search);
const ORIENT=Q.get('o')||'landscape';
const W=ORIENT==='portrait'?1080:1920;
const H=ORIENT==='portrait'?1920:1080;

/* v08 "Bulina: Bilangan Asli & Bilangan Cacah" - dunia Kota Bilangan
   (gedung, kedai berjendela, jalan raya berisi mobil, trotoar, pohon, lampu;
   siang menuju senja). Karakter: HANYA bola emas mentor, BULAT SEJATI,
   tanpa mata (aturan 23). Copy selalu soft selling, tanpa kalimat intimidasi
   (aturan 25). Subjudul di zona aman sosmed (aturan 24); watermark AKIOMIDA
   wajib selalu terlihat di tepi paling bawah tanpa menutupi konten apa pun. */
const P = ORIENT==='portrait' ? {
  bldBot:950, roadTop:950, roadBot:1028, walkTop:1032, walkBot:1152,
  groundY:1120, backY:1050,
  shopY:560, shopH:256, shopW:200, shopX:[70,310,550,790], awnY:518, awnH:44,
  plqY:420, plqS:66, plqX0:407, plqGap:82,
  titleY:300, titleS0:104, titleSN:82,
  zbX:410, zbY:560, zbW:260, zbH:200,
  zcY:600, zcW:250, zcH:48, zcFS:21, zc1X:130, zc2X:700,
  famX:150, famY:430, famW:780, famH:300, famHd:54, famRow:74, famName:30, famMem:26,
  slateX:30, slateBot:1140, slateW:300, slateH:196, eqFS:46, labFS:17,
  ctaX:80, ctaY:430, ctaW:920, ctaH:540, ctaOff:[64,124,196], ctaPillB:44,
  openFS:36, openEFS:16, urlFS:92,
  pillW:430, pillH:74, pillFS:32,
  subTop:1170, subId:50, subEn:24, subMax:760,
  ballD:110, wmY:1800, wmFS:20,
  marD:40, marGap:10, marX0:345, marY:758,
  qmX:516, qmY:740, qmFS:84,
  treeX:[36,1060], treeS:1.0, lampX:[80,1000], lampH:210,
  carY:962, carW:210, carH:64, carH2:52,
  plazaY:1032
} : {
  bldBot:430, roadTop:430, roadBot:505, walkTop:508, walkBot:630,
  groundY:660, backY:600,
  shopY:270, shopH:150, shopW:230, shopX:[130,630,1130,1630], awnY:234, awnH:34,
  plqY:238, plqS:56, plqX0:870, plqGap:74,
  titleY:150, titleS0:88, titleSN:72,
  zbX:810, zbY:270, zbW:300, zbH:220,
  zcY:330, zcW:210, zcH:44, zcFS:17, zc1X:490, zc2X:1230,
  famX:560, famY:240, famW:800, famH:216, famHd:40, famRow:46, famName:24, famMem:22,
  slateX:250, slateBot:680, slateW:330, slateH:164, eqFS:40, labFS:15,
  ctaX:530, ctaY:240, ctaW:860, ctaH:320, ctaOff:[40,90,130], ctaPillB:30,
  openFS:30, openEFS:14, urlFS:80,
  pillW:400, pillH:66, pillFS:28,
  subTop:740, subId:50, subEn:24, subMax:1300,
  ballD:96, wmY:1010, wmFS:18,
  marD:36, marGap:8, marX0:160, marY:380,
  qmX:300, qmY:372, qmFS:64,
  treeX:[110,1810], treeS:0.9, lampX:[120,1800], lampH:170,
  carY:442, carW:190, carH:56, carH2:46,
  plazaY:508
};
const MX=60;
const stage=document.getElementById('stage');
stage.style.width=W+'px';stage.style.height=H+'px';

/* ---------- util & easing ---------- */
const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,p)=>a+(b-a)*p;
const seg=(t,a,d)=>clamp((t-a)/d,0,1);
const eio=p=>p<0.5?2*p*p:1-Math.pow(-2*p+2,2)/2;
const eoe=p=>1-Math.pow(1-p,3);
const smz=(t,a,b,f)=>f?clamp((t-a)/f,0,1)*clamp((b-t)/f,0,1):(t>=a&&t<b?1:0);
function popA(el,t,t0,d,ov,op0,op1){
  const o=clamp(seg(t,t0,0.3)*(1-seg(t,op1,0.35)),0,1);
  const s2=1+(ov/100)*Math.sin(clamp(seg(t,t0,d),0,1)*Math.PI)*(1-seg(t,op1,0.35));
  el.style.opacity=String(o);
  el.style.transform=`scale(${s2.toFixed(3)})`;
}
/* RNG berbenih (deterministik antar render) */
let _seed=20261116;
const rnd=()=>{_seed|=0;_seed=_seed+0x6D2B79F5|0;let z=Math.imul(_seed^_seed>>>15,1|_seed);
  z=z+Math.imul(z^z>>>7,61|z)^z;return((z^z>>>14)>>>0)/4294967296;};

/* ---------- langit: bintang + awan ---------- */
const starsEl=document.getElementById('stars');
const ST=[];
for(let i=0;i<64;i++){
  const s=document.createElement('i');
  const sz=(rnd()*2.4+1.2).toFixed(1);
  s.style.cssText+=`width:${sz}px;height:${sz}px;left:${(rnd()*W).toFixed(0)}px;top:${(rnd()*P.bldBot*0.72).toFixed(0)}px;opacity:0;`;
  starsEl.appendChild(s);
  ST.push({el:s,sp:rnd()*1.4+0.6,ph:rnd()*6.28});
}
const cloudsEl=document.getElementById('clouds');
const CL=[];
for(let i=0;i<3;i++){
  const c=document.createElement('div');
  c.className='cloud';
  const cw=[260,200,320][i], ch=76;
  c.style.cssText+=`left:${(rnd()*W*0.8).toFixed(0)}px;top:${[120,250,90][i]*(ORIENT==='portrait'?1:0.8)}px;width:${cw}px;height:${ch}px;`;
  [[0,22,110,54],[70,0,120,64],[150,30,100,44]].forEach(([bx,by,bw,bh])=>{
    const b=document.createElement('b');
    b.style.cssText+=`left:${bx}px;top:${by}px;width:${bw}px;height:${bh}px;`;
    c.appendChild(b);
  });
  cloudsEl.appendChild(c);
  CL.push({el:c,x:parseFloat(c.style.left),y:parseFloat(c.style.top),sp:rnd()*7+5,w:cw});
}

/* ---------- kota: deretan gedung berjendela ---------- */
const townEl=document.getElementById('town');
const WINS=[]; /* jendela yang menyala saat senja */
{
  const cols=ORIENT==='portrait'
    ? [[0,200,'#F3E2C7',430],[200,200,'#E8D3F0',560],[400,220,'#D8ECF4',500],[620,200,'#F6D5D0',620],[820,260,'#E7EFE0',470]]
    : [[0,300,'#F3E2C7',420],[300,340,'#E8D3F0',500],[640,300,'#D8ECF4',400],[940,360,'#F6D5D0',540],[1300,320,'#E7EFE0',430],[1620,300,'#EFD9B8',470]];
  cols.forEach(([bx,bw,col,bh],bi)=>{
    const b=document.createElement('div');
    b.className='bld';
    b.style.cssText+=`left:${bx}px;width:${bw}px;height:${bh}px;background:${col};
      box-shadow:inset 0 -14px 0 rgba(0,0,0,.10);top:${P.bldBot-bh}px;`;
    const nx=Math.max(2,Math.floor(bw/110)), ny=Math.max(2,Math.floor(bh/190));
    for(let i=0;i<nx;i++)for(let j=0;j<ny;j++){
      const w=document.createElement('div');
      w.className='win';
      const wx=bx+22+i*((bw-44-(nx-1)*26)/nx)+i*26, wy=P.bldBot-bh+30+j*((bh-60-(ny-1)*40)/ny)+j*40;
      w.style.cssText+=`left:${wx}px;top:${wy}px;width:${(bw-44-(nx-1)*26)/nx}px;height:${Math.min(64,(bh-60-(ny-1)*40)/ny)}px;`;
      townEl.appendChild(w);
      if((i+j*nx)%3===1)WINS.push(w);
    }
    townEl.appendChild(b);
  });
}
/* plak nomor pintu 1 2 3 (hook: menghitung mulai dari 1) */
const PLQ=[];
['1','2','3'].forEach((g,i)=>{
  const p=document.createElement('div');
  p.className='plaque';
  p.style.cssText+=`left:${P.plqX0+i*P.plqGap}px;top:${P.plqY}px;width:${P.plqS}px;height:${P.plqS+8}px;opacity:0;`;
  const b=document.createElement('b');
  b.style.fontSize=Math.round(P.plqS*0.62)+'px';b.textContent=g;
  p.appendChild(b);townEl.appendChild(p);
  PLQ.push({el:p,t0:0.9+i*0.22});
});

/* ---------- empat jendela kedai berisi situasi bilangan asli ---------- */
const SHOPS=[];
{
  const defs=[
    {x:P.shopX[0],t0:6.9,kind:'books'},
    {x:P.shopX[1],t0:8.85,kind:'students'},
    {x:P.shopX[2],t0:10.35,kind:'apples'},
    {x:P.shopX[3],t0:10.45,kind:'endless'}
  ];
  defs.forEach((d,i)=>{
    const w=document.createElement('div');
    w.className='shopwin';
    w.style.cssText+=`left:${d.x}px;top:${P.shopY}px;width:${P.shopW}px;height:${P.shopH}px;opacity:0;`;
    const awn=document.createElement('div');
    awn.className='awn';
    awn.style.cssText+=`left:${d.x-8}px;top:${P.awnY}px;width:${P.shopW+16}px;height:${P.awnH}px;opacity:0;`;
    const chip=document.createElement('div');
    chip.className='chip';
    chip.style.cssText+=`left:${d.x+P.shopW*0.14}px;top:${P.shopY+P.shopH-40}px;width:${P.shopW*0.72}px;height:34px;
      font-size:${ORIENT==='portrait'?20:16}px;line-height:34px;opacity:0;`;
    townEl.appendChild(w);townEl.appendChild(awn);townEl.appendChild(chip);
    const sit=document.createElement('div');
    sit.className='sit';
    w.appendChild(sit);
    SHOPS.push({win:w,awn,sit,chip,t0:d.t0,kind:d.kind});
  });
  const [bw,bh]=[P.shopW,P.shopH];
  const S=SHOPS;
  /* kedai buku: tiga buku bertumpuk (ada 3 buku di meja) */
  {
    const cols=['#E15B5B','#5B8FE1','#4FA35C'];
    cols.forEach((c,i)=>{
      const b=document.createElement('div');
      b.style.cssText=`position:absolute;left:${bw*0.32-(i%2)*8}px;top:${bh-58-(i+1)*26}px;width:${bw*0.4-(i%2)*6}px;height:22px;
        border-radius:4px;background:${c};box-shadow:inset 0 -5px 0 rgba(0,0,0,.2);`;
      S[0].sit.appendChild(b);
    });
    S[0].chip.textContent='3 BUKU';
  }
  /* kedai siswa: lima sosok kecil (ada 5 siswa di ruangan) */
  {
    const cols=['#5B8FE1','#A78BFA','#4FA35C','#F2C230','#E15B5B'];
    cols.forEach((c,i)=>{
      const px=bw*(0.13+i*0.155);
      const hd=document.createElement('div');
      hd.style.cssText=`position:absolute;left:${px}px;top:${bh*0.24}px;width:${bw*0.09}px;height:${bw*0.09}px;
        border-radius:50%;background:${c};`;
      S[1].sit.appendChild(hd);
      const bd=document.createElement('div');
      bd.style.cssText=`position:absolute;left:${px-bw*0.008}px;top:${bh*0.24+bw*0.11}px;width:${bw*0.106}px;height:${bh*0.2}px;
        border-radius:${bw*0.05}px;background:${c};opacity:.85;`;
      S[1].sit.appendChild(bd);
    });
    S[1].chip.textContent='5 SISWA';
  }
  /* kedai apel: dua baris dua belas apel di atas keranjang */
  {
    for(let r=0;r<2;r++)for(let j=0;j<6;j++){
      const a=document.createElement('div');
      a.style.cssText=`position:absolute;left:${bw*(0.1+j*0.135)}px;top:${bh*(0.16+r*0.18)}px;width:${bw*0.1}px;height:${bw*0.1}px;
        border-radius:50%;background:radial-gradient(circle at 35% 30%,#F08A7A 0%,#D3452F 70%,#A82A1A 100%);`;
      S[2].sit.appendChild(a);
    }
    const bk=document.createElement('div');
    bk.style.cssText=`position:absolute;left:${bw*0.2}px;top:${bh*0.52}px;width:${bw*0.6}px;height:${bh*0.24}px;
      border-radius:0 0 60px 60px;background:linear-gradient(180deg,#A96F35,#8B5A2B);box-shadow:inset 0 -8px 0 rgba(0,0,0,.2);`;
    S[2].sit.appendChild(bk);
    S[2].chip.textContent='12 APEL';
  }
  /* kedai tanpa batas: hitung terus 1 2 3 4 5 ... */
  {
    const num=document.createElement('div');
    num.className='mono';
    num.style.cssText=`position:absolute;left:0;top:${bh*0.24}px;width:100%;text-align:center;font-weight:800;
      color:#35507A;font-size:${Math.round(bw*0.14)}px;`;
    num.textContent='1 2 3 4 5';
    S[3].sit.appendChild(num);
    const dots=document.createElement('div');
    dots.className='mono';
    dots.style.cssText=`position:absolute;left:0;top:${bh*0.5}px;width:100%;text-align:center;font-weight:800;
      color:#F2C230;font-size:${Math.round(bw*0.2)}px;`;
    dots.textContent='...';
    S[3].sit.appendChild(dots);
    S[3].chip.textContent='TANPA BATAS';

/* ---------- RENDER PER FRAME ---------- */
const world=document.getElementById('world');
const flash=document.getElementById('flash');

const skydusk=document.getElementById('skydusk');
let _roll=0,_mxPrev=null;
function renderFrame(t){
  const dk=seg(t,34.0,9.0);
  skydusk.style.opacity=dk.toFixed(3);
  /* bintang */
  for(const s of ST){
    s.el.style.opacity=(dk*(0.35+0.5*(0.5+0.5*Math.sin(t*s.sp+s.ph)))).toFixed(3);
  }
  /* awan drift */
  for(const c of CL){
    c.x+=c.sp*(1/30);
    if(c.x>W+c.w)c.x=-c.w-40;
    c.el.style.transform=`translateX(${c.x.toFixed(1)}px)`;
    c.el.style.opacity=(0.92*(1-dk*0.8)).toFixed(3);
  }
  /* kota & plaza */
  const plazaK=seg(t,16.6,0.6)*(1-seg(t,32.5,0.6))+seg(t,40.0,0.6);
  const pk=clamp(plazaK,0,1);
  plaza.style.opacity=(pk*0.9).toFixed(3);
  const townDim=1-0.62*pk;
  townEl.style.opacity=townDim.toFixed(3);
  TREES.forEach(tr=>{ tr.el.style.opacity=(1-0.5*pk).toFixed(3);
    tr.el.style.transform=`rotate(${(Math.sin(t*0.9+tr.ph)*1.2).toFixed(2)}deg)`; });
  /* lampu jalan menyala saat senja */
  LAMPS.forEach(l=>{
    l.glow.style.opacity=(dk*(0.55+0.2*Math.sin(t*2+l.ph))).toFixed(3);
  });
  /* jendela menyala hangat saat senja */
  if(WINS.length){
    const warm=dk*0.85;
    const r=Math.round(lerp(57,255,warm)), g=Math.round(lerp(80,217,warm)), b=Math.round(lerp(107,138,warm));
    const col=`rgb(${r},${g},${b})`;
    for(const w of WINS){ w.style.background=col; }
  }
  /* mobil lewat */
  for(const [p0,p1,dir,ci] of PASSES){
    const c=CARS[ci];
    const p=seg(t,p0,p1-p0);
    const on=t>=p0&&t<=p1?1:0;
    c.el.style.opacity=on;
    if(on){
      const x=dir>0?lerp(-c.w-60,W+60,p):lerp(W+60,-c.w-60,p);
      c.el.style.transform=`translateX(${x.toFixed(1)}px)`;
    }
  }
  /* plak 1 2 3 (hook) */
  for(const p of PLQ){ popA(p.el,t,p.t0,0.5,8,0,6.5); }

  /* jendela kedai (pasangan 1 pergi 13.4, pasangan 2 pergi 16.6) */
  const pOut=1-seg(t,13.4,0.35), pOut2=1-seg(t,16.6,0.4);
  SHOPS.forEach((s,i)=>{
    const o=seg(t,s.t0,0.45)*(i<2?pOut:pOut2);
    s.win.style.opacity=o.toFixed(3);
    s.win.style.transform=`translateY(${((1-eio(seg(t,s.t0,0.45)))*26).toFixed(1)}px)`;
    s.awn.style.opacity=o.toFixed(3);
    s.chip.style.opacity=(seg(t,s.t0+0.25,0.35)*(i<2?pOut:pOut2)).toFixed(3);
  });

  /* keranjang kosong + dua situasi nol (S3) */
  popA(zb,t,19.9,0.55,6,0,25.9);
  for(const z of ZCHIPS){ popA(z.el,t,z.t0,0.5,7,0,25.9); }

  /* panel ASLI vs CACAH (S4) + catatan emas yang berganti */
  popA(famEl,t,25.9,0.55,5,0,32.9);
  for(const r of CMP_ROWS){
    r.el.style.opacity=seg(t,r.t0,0.45).toFixed(3);
  }
  famNote.textContent = t>=32.86 ? 'NOL TIDAK MASUK ASLI' : 'SEMUA ASLI ADA DI CACAH';
  popA(famNote,t,29.65,0.5,5,0,32.9);

  /* papan tulis kafe (S5) */
  popA(slate,t,36.7,0.6,6,0,40.15);

  /* mentor: menggelinding di trotoar antar stasiun */
  let bx=WAY[WAY.length-1][1];
  for(let k=0;k<WAY.length-1;k++){
    const [w0,x0]=WAY[k],[w1,x1]=WAY[k+1];
    if(t>=w0&&t<w1){ bx=lerp(x0,x1,eio(seg(t,w0,w1-w0))); break; }
  }
  if(t>=WAY[WAY.length-1][0])bx=WAY[WAY.length-1][1];
  if(_mxPrev===null)_mxPrev=bx;
  _roll+=(bx-_mxPrev)/(P.ballD/2)*(180/Math.PI);
  _mxPrev=bx;
  const ep=seg(t,0.6,0.55);
  let hy2=0, lrot=0, drot=0, txj=0;
  for(const [gs,gd,gt,ga] of GESTS){
    const d2=t-gs;
    if(d2>=0&&d2<gd){
      const p=d2/gd, w=Math.sin(p*Math.PI);
      if(gt==='tilt'||gt==='lean'){ lrot+=ga*w; }
      else if(gt==='nod'){ lrot+=ga*Math.sin(p*2*Math.PI); }
      else if(gt==='spin'){ drot+=ga*eio(p); }
      else if(gt==='count'){ hy2-=ga*Math.abs(Math.sin(p*5*Math.PI))*(1-p*0.2); }
      else if(gt==='shiver'){ txj=ga*Math.sin(p*40)*(1-p); }
      else if(gt==='jump'){ hy2-=ga*4*p*(1-p); }
    }
  }
  const bsa=1;
  mentor.el.style.left=bx.toFixed(1)+'px';
  mentor.el.style.opacity=String(clamp(ep*3,0,1));
  mentor.el.style.top=(P.groundY-P.ballD+hy2).toFixed(1)+'px';
  mentor.el.style.transform=`translateX(${txj.toFixed(1)}px) rotate(${(_roll+lrot+drot).toFixed(2)}deg) scale(${bsa.toFixed(3)})`;
  msh.style.left=bx.toFixed(1)+'px';
  msh.style.top=(P.groundY-10)+'px';
  msh.style.opacity=String(clamp(ep*3,0,1)*clamp(0.42+hy2*0.006,0.18,0.5)*bsa);
  msh.style.transform=`scaleX(${clamp((1+hy2*0.004)*bsa,0.4,1.08).toFixed(3)})`;
  ballB.style.opacity='0';
  /* percikan bintang */
  let spo=0;
  for(const sa in []) void sa;
  for(const [sa,sb] of SPARKS){
    if(t>=sa&&t<sb) spo=smz(t,sa,sb,0.35)*(0.65+0.2*Math.sin(t*7));
  }
  spark.style.opacity=String(clamp(spo,0,1));
  spark.style.left=(bx+62).toFixed(1)+'px';
  spark.style.top=(P.groundY-150+Math.sin(t*2)*4).toFixed(1)+'px';
  spark.style.transform=`rotate(${((t*28)%360).toFixed(0)}deg) scale(${(0.8+0.15*Math.sin(t*7)).toFixed(3)})`;

  /* kelereng latihan: muncul satu per satu, lalu diberikan satu per satu */
  MARBLES.forEach((m,i)=>{
    const inO=seg(t,44.25+i*0.06,0.3);
    const xp=seg(t,45.55+i*0.15,0.42);
    const op=clamp(inO*(1-xp),0,1);
    m.el.style.opacity=op.toFixed(3);
    m.el.style.transform=`translate(${(320*eio(xp)).toFixed(1)}px,${(70*xp).toFixed(1)}px) rotate(${(xp*160).toFixed(0)}deg) scale(${(0.7+0.3*inO).toFixed(3)})`;
  });
  popA(qmark,t,47.3,0.5,8,0,51.6);

  /* kunang-kunang senja */
  const fz=seg(t,40.5,1.0)*(1-seg(t,51.2,0.6));
  for(const f of FF){
    const ox=Math.sin(t*f.sp+f.ph)*f.amp, oy=Math.cos(t*f.sp*0.8+f.ph)*f.amp*0.6;
    f.el.style.transform=`translate(${(f.x+ox).toFixed(1)}px,${(f.y+oy).toFixed(1)}px)`;
    f.el.style.opacity=(fz*(0.35+0.65*(0.5+0.5*Math.sin(t*2.2+f.ph)))).toFixed(3);
  }

  /* judul bab */
  for(let i=0;i<TITLES.length;i++){
    const o=TITLES[i];
    const tEnd=i+1<TITLES.length?TITLES[i+1].t0:51.4;
    const oin=seg(t,o.t0,0.35)*(1-seg(t,tEnd-0.25,0.3));
    const sc=1+0.035*Math.sin(clamp(seg(t,o.t0,0.7),0,1)*Math.PI);
    o.el.style.opacity=oin.toFixed(3);
    o.el.style.transform=`scale(${sc.toFixed(3)})`;
  }

  /* CTA: AKIOMIDA.COM hanya menyala di akhir, reveal tenang */
  popA(cta,t,40.9,0.7,6,0,51.6);
  const uo=seg(t,45.8,1.4);
  fUrl.style.opacity=uo.toFixed(3);
  fUrl.style.transform=`translateY(${((1-eio(uo))*14).toFixed(1)}px)`;
  fBar.style.width=(seg(t,48.6,1.8)*Math.max(0,P.ctaW-80)).toFixed(0)+'px';
  popA(fPill,t,47.5,0.6,6,0,51.6);

  renderSub(t);

  /* kamera tenang */
  const im=imp(t);
  const shx=Math.sin(t*47)*2.5*im, shy=Math.sin(t*39+1.7)*1.8*im;
  world.style.transform=`translate(${shx.toFixed(2)}px,${(shy+Math.sin(t*0.35)*3).toFixed(2)}px)`;
  flash.style.opacity=(im*0.07).toFixed(3);
  fade.style.opacity=String(clamp(1-seg(t,0.05,0.5),0,1)*0.96+clamp(seg(t,51.4,0.6),0,1));
}
renderFrame(0);
window.__ready=true;
</script>
</body>
</html>
