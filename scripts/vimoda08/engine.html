/* v08 revisi 2 "Bulina" - DUNIA BARU: RUMAH BULINA (ruang bermain hangat):

   Copy soft selling tanpa kalimat intimidasi (aturan 25); subjudul di zona aman
   sosmed dan dijaga maksimal dua baris (aturan 27); watermark AKIOMIDA selalu
   terlihat di tepi paling bawah tanpa menutupi konten (aturan 24). */
const P = ORIENT==='portrait' ? {

  shelfX:1380, shelfY:150, shelfW:400,
  jarX:1400, jarY:74, jarW:60, jarH:76,
  plantX:1480, plantY:112, plantW:36,
  blkS:46, blkX:[1540,1592,1644], blkY:104,

  easX:140, easBrdY:470, easBrdW:260, easBrdH:140, easFoot:610, chT:46, chL:14,

  titleY:150, titleS0:88, titleSN:72,

  openFS:30, openEFS:14, urlFS:80,

};
const MX=60;

stage.style.width=W+'px';stage.style.height=H+'px';

/* ---------- util & easing ---------- */
const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,p)=>a+(b-a)*p;
const seg=(t,a,d)=>clamp((t-a)/d,0,1);
const eio=p=>p<0.5?2*p*p:1-Math.pow(-2*p+2,2)/2;
const eoe=p=>1-Math.pow(1-p,3);
const smz=(t,a,b,f)=>f?clamp((t-a)/f,0,1)*clamp((b-t)/f,0,1):(t>=a&&t<b?1:0);
function popA(el,t,t0,d,ov,op0,op1){
  const o=clamp(seg(t,t0,0.3)*(1-seg(t,op1,0.35)),0,1);
  const s2=1+(ov/100)*Math.sin(clamp(seg(t,t0,d),0,1)*Math.PI)*(1-seg(t,op1,0.35));
  el.style.opacity=String(o);
  el.style.transform=`scale(${s2.toFixed(3)})`;
}
let _seed=20261116;
const rnd=()=>{_seed|=0;_seed=_seed+0x6D2B79F5|0;let z=Math.imul(_seed^_seed>>>15,1|_seed);
  z=z+Math.imul(z^z>>>7,61|z)^z;return((z^z>>>14)>>>0)/4294967296;};

/* ---------- ruangan: dinding, wainscot, papan kayu, karpet ---------- */
const wall=document.getElementById('wall');
const wainscot=document.getElementById('wainscot');
wainscot.style.cssText+=`top:${P.wainY}px;height:${P.wainH}px;`;
const bbEl=document.getElementById('baseboard');
bbEl.style.cssText+=`top:${P.bbY}px;height:${P.floorY-P.bbY}px;`;

floorEl.style.cssText+=`top:${P.floorY}px;height:${H-P.floorY}px;`;
const rug=document.getElementById('rug');
rug.style.cssText+=`left:${P.rugX}px;top:${P.rugY}px;width:${P.rugW}px;height:${P.rugH}px;`;

/* ---------- jendela dengan langit siang ke senja ---------- */
const winEl=document.getElementById('winframe');
const winDusks=[];
{
  const {winX:wx,winY:wy,winW:ww,winH:wh}=P;
  const fr=14;
  const parts=[
    [0,0,ww,fr],[0,wh-fr,ww,fr],[0,0,fr,wh],[ww-fr,0,fr,wh],
    [ww/2-fr/2,fr,fr,wh-2*fr],[fr,wh/2-fr/2,ww-2*fr,fr]
  ];
  parts.forEach(([px,py,pw,ph])=>{
    const f=document.createElement('div');
    f.className='wf';
    f.style.cssText+=`left:${wx+px}px;top:${wy+py}px;width:${pw}px;height:${ph}px;`;
    winEl.appendChild(f);
  });
  const panes=[[fr,fr,ww/2-fr*1.5,wh/2-fr*1.5],[ww/2+fr/2,fr,ww/2-fr*1.5,wh/2-fr*1.5],
               [fr,wh/2+fr/2,ww/2-fr*1.5,wh/2-fr*1.5],[ww/2+fr/2,wh/2+fr/2,ww/2-fr*1.5,wh/2-fr*1.5]];
  panes.forEach(([px,py,pw,ph],i)=>{
    const p=document.createElement('div');
    p.className='pane';
    p.style.cssText+=`left:${wx+px}px;top:${wy+py}px;width:${pw}px;height:${ph}px;`;
    const dk=document.createElement('div');
    dk.className='dusk';
    p.appendChild(dk);
    winDusks.push(dk);
    if(i===0){
      const puff=document.createElement('div');
      puff.className='puff';
      puff.style.cssText+=`left:${pw*0.2}px;top:${ph*0.45}px;width:${pw*0.5}px;height:${ph*0.32}px;`;
      p.appendChild(puff);
      const puff2=document.createElement('div');
      puff2.className='puff';
      puff2.style.cssText+=`left:${pw*0.42}px;top:${ph*0.22}px;width:${pw*0.36}px;height:${ph*0.26}px;`;
      p.appendChild(puff2);
    }
    winEl.appendChild(p);
  });
  const sill=document.createElement('div');
  sill.className='sill';
  sill.style.cssText+=`left:${wx-14}px;top:${wy+wh}px;width:${ww+28}px;height:${Math.round(fr*1.05)}px;`;
  winEl.appendChild(sill);
}

/* ---------- rak: toples kelereng, pot tanaman, balok angka 1 2 3 ---------- */
const shelfEl=document.getElementById('shelf');
{
  const sb=document.createElement('div');
  sb.className='shelfb';
  sb.style.cssText+=`left:${P.shelfX}px;top:${P.shelfY}px;width:${P.shelfW}px;height:${Math.round(P.blkS*0.3)}px;`;
  shelfEl.appendChild(sb);
  /* toples kelereng */
  const jar=document.createElement('div');
  jar.className='jarglass';
  jar.style.cssText+=`left:${P.jarX}px;top:${P.jarY}px;width:${P.jarW}px;height:${P.jarH}px;`;
  const cols=['#E15B5B','#5B8FE1','#4FA35C','#F2C230','#A78BFA','#38BDF8','#F472B6','#FBBF24'];
  cols.forEach((c,i)=>{
    const d=document.createElement('div');
    d.className='mdot';
    const r=Math.round(P.jarW*0.16);
    const cx=P.jarW*(0.22+(i%4)*0.19), cy=P.jarH*(i<4?0.62:0.34);
    d.style.cssText+=`left:${cx-r/2}px;top:${cy-r/2}px;width:${r}px;height:${r}px;background:${c};`;
    jar.appendChild(d);

  shelfEl.appendChild(jar);
  const lid=document.createElement('div');
  lid.className='jarlid';
  lid.style.cssText+=`left:${P.jarX-4}px;top:${P.jarY-10}px;width:${P.jarW+8}px;height:${Math.round(P.jarH*0.16)}px;`;
  shelfEl.appendChild(lid);
  /* pot tanaman kecil */
  const pot=document.createElement('div');
  pot.className='plantpot';
  pot.style.cssText+=`left:${P.plantX}px;top:${P.plantY}px;width:${P.plantW}px;height:${Math.round(P.plantW*0.8)}px;`;
  shelfEl.appendChild(pot);
  [[0.1,-0.5,0],[0.55,-0.7,40],[0.3,-0.95,-20]].forEach(([fx,fy,rot])=>{
    const lf=document.createElement('div');
    lf.className='plantleaf';

    shelfEl.appendChild(lf);
  });
}
/* balok angka 1 2 3 (hook) - pop bergantian */
const BLOCKS=['1','2','3'].map((g,i)=>{
  const b=document.createElement('div');
  b.className='block3';
  b.style.cssText+=`left:${P.blkX[i]}px;top:${P.blkY}px;width:${P.blkS}px;height:${P.blkS}px;opacity:0;`;
  const num=document.createElement('b');
  num.style.fontSize=Math.round(P.blkS*0.62)+'px';
  num.textContent=g;
  b.appendChild(num);
  shelfEl.appendChild(b);
  return {el:b,t0:0.9+i*0.22};
});

/* ---------- bendera bunting melengkung ---------- */
const bunEl=document.getElementById('bunting');
const FLAGS=[];

  [50.07,'Terima kasih sudah menonton.','Thanks for watching.','#FFE9A8']
];
let subIdx=-1;
function renderSub(t){
  let i=0;
  for(let k=0;k<SUBS.length;k++){ if(t>=SUBS[k][0]-0.001) i=k; }
  const nxt=i+1<SUBS.length?SUBS[i+1][0]:52.4;
  const o=clamp(Math.min(seg(t,SUBS[i][0],0.25), 1-seg(t,nxt-0.14,0.14)),0,1);
  if(i!==subIdx){
    subIdx=i;
    subId.textContent=SUBS[i][1];
    subId.style.color=SUBS[i][3];
    subEn.textContent=SUBS[i][2];
  }
  subbar.style.opacity=(o*0.98).toFixed(3);
  const pop=1+0.018*Math.sin(clamp(seg(t,SUBS[i][0],0.45),0,1)*Math.PI);
  subbar.style.transform=`translateX(-50%) scale(${pop.toFixed(3)})`;
}

const WAY = ORIENT==='portrait'
  ? [[0.55,540],[9.0,660],[13.76,540],[19.9,440],[25.9,540],[51.9,540]]
  : [[0.55,960],[9.0,1100],[13.76,960],[19.9,820],[25.9,960],[51.9,960]];

/* ---------- RENDER PER FRAME ---------- */
const world=document.getElementById('world');
const flash=document.getElementById('flash');
const fade=document.getElementById('fade');
let _roll=0,_mxPrev=null;
function renderFrame(t){
  /* senja: langit jendela berubah, lampu menyala, dinding menghangat */
  const dk=seg(t,34.0,9.0);
  for(const d of winDusks){ d.style.opacity=dk.toFixed(3); }
  lampGlow.style.opacity=(dk*(0.75+0.15*Math.sin(t*2.2))).toFixed(3);
  /* bendera bunting berayun lembut */
  for(const f of FLAGS){
    f.el.style.transform=`rotate(${(Math.sin(t*0.8+f.ph)*3.5).toFixed(2)}deg)`;
  }
  /* debu cahaya melayang saat senja */
  const fz=seg(t,38.0,1.2)*(1-seg(t,51.2,0.6));
  for(const f of DUST){
    const ox=Math.sin(t*f.sp+f.ph)*f.amp, oy=Math.cos(t*f.sp*0.8+f.ph)*f.amp*0.7;
    f.el.style.transform=`translate(${(f.x+ox).toFixed(1)}px,${(f.y+oy).toFixed(1)}px)`;
    f.el.style.opacity=(fz*(0.30+0.55*(0.5+0.5*Math.sin(t*2.4+f.ph)))).toFixed(3);
  }
  /* balok angka 1 2 3 di rak (hook) */
  for(const b of BLOCKS){ popA(b.el,t,b.t0,0.5,10,0,6.5); }
  /* bingkai gambar (pasangan pertama pergi 13.4, kedua 16.6) */
  const pOut=1-seg(t,13.4,0.35), pOut2=1-seg(t,16.6,0.4);
  FRAMES.forEach((f,i)=>{
    const o=seg(t,f.t0,0.45)*(i<2?pOut:pOut2);
    f.win.style.opacity=o.toFixed(3);
    f.win.style.transform=`translateY(${((1-eio(seg(t,f.t0,0.45)))*22).toFixed(1)}px)`;
    f.tag.style.opacity=(seg(t,f.tag0,0.35)*(i<2?pOut:pOut2)).toFixed(3);
  });
  /* keranjang kosong + sticky notes (bab NOL) */
  popA(basket,t,19.9,0.55,6,0,25.9);
  for(const s of STICKS){ popA(s.el,t,s.t0,0.5,7,0,25.9); }
  /* chart kertas (bab CACAH) + catatan stabilo yang berganti */
  popA(chart,t,25.9,0.55,5,0,32.9);
  for(const r of CH_ROWS){
    r.el.style.opacity=seg(t,r.t0,0.45).toFixed(3);
  }
  chNote.textContent = t>=32.86 ? 'NOL TIDAK MASUK ASLI' : 'SEMUA ASLI ADA DI CACAH';
  popA(chNote,t,29.65,0.5,5,0,32.9);
  /* papan kapur easel (bab PERAN NOL) */
  popA(easel,t,36.7,0.6,6,0,40.15);
  /* mentor: menggelinding di lantai depan */
  let bx=WAY[WAY.length-1][1];
  for(let k=0;k<WAY.length-1;k++){
    const [w0,x0]=WAY[k],[w1,x1]=WAY[k+1];
    if(t>=w0&&t<w1){ bx=lerp(x0,x1,eio(seg(t,w0,w1-w0))); break; }
  }
  if(t>=WAY[WAY.length-1][0])bx=WAY[WAY.length-1][1];
  if(_mxPrev===null)_mxPrev=bx;
  _roll+=(bx-_mxPrev)/(P.ballD/2)*(180/Math.PI);
  _mxPrev=bx;
  const ep=seg(t,0.6,0.55);
  let hy2=0, lrot=0, drot=0, txj=0;
  for(const [gs,gd,gt,ga] of GESTS){
    const d2=t-gs;
    if(d2>=0&&d2<gd){
      const p=d2/gd, w=Math.sin(p*Math.PI);
      if(gt==='tilt'||gt==='lean'){ lrot+=ga*w; }
      else if(gt==='nod'){ lrot+=ga*Math.sin(p*2*Math.PI); }
      else if(gt==='spin'){ drot+=ga*eio(p); }
      else if(gt==='count'){ hy2-=ga*Math.abs(Math.sin(p*5*Math.PI))*(1-p*0.2); }
      else if(gt==='shiver'){ txj=ga*Math.sin(p*40)*(1-p); }
      else if(gt==='jump'){ hy2-=ga*4*p*(1-p); }
    }
  }
  const bsa=1;
  mentor.el.style.left=bx.toFixed(1)+'px';
  mentor.el.style.opacity=String(clamp(ep*3,0,1));
  mentor.el.style.top=(P.groundY-P.ballD+hy2).toFixed(1)+'px';
  mentor.el.style.transform=`translateX(${txj.toFixed(1)}px) rotate(${(_roll+lrot+drot).toFixed(2)}deg) scale(${bsa.toFixed(3)})`;
  msh.style.left=bx.toFixed(1)+'px';
  msh.style.top=(P.groundY-10)+'px';
  msh.style.opacity=String(clamp(ep*3,0,1)*clamp(0.42+hy2*0.006,0.18,0.5)*bsa);
  msh.style.transform=`scaleX(${clamp((1+hy2*0.004)*bsa,0.4,1.08).toFixed(3)})`;
  /* percikan bintang */
  let spo=0;
  for(const [sa,sb] of SPARKS){
    if(t>=sa&&t<sb) spo=smz(t,sa,sb,0.35)*(0.65+0.2*Math.sin(t*7));
  }
  spark.style.opacity=String(clamp(spo,0,1));
  spark.style.left=(bx+62).toFixed(1)+'px';
  spark.style.top=(P.groundY-150+Math.sin(t*2)*4).toFixed(1)+'px';
  spark.style.transform=`rotate(${((t*28)%360).toFixed(0)}deg) scale(${(0.8+0.15*Math.sin(t*7)).toFixed(3)})`;
  /* kelereng latihan: muncul, lalu diberikan satu per satu ke kanan */
  MARBLES.forEach((m,i)=>{
    const inO=seg(t,44.25+i*0.06,0.3);
    const xp=seg(t,45.55+i*0.15,0.42);
    const op=clamp(inO*(1-xp),0,1);
    m.el.style.opacity=op.toFixed(3);
    m.el.style.transform=`translate(${(320*eio(xp)).toFixed(1)}px,${(-40*xp).toFixed(1)}px) rotate(${(xp*160).toFixed(0)}deg) scale(${(0.7+0.3*inO).toFixed(3)})`;
  });
  popA(qmark,t,47.3,0.5,8,0,51.6);
  /* judul bab */
  for(let i=0;i<TITLES.length;i++){
    const o=TITLES[i];
    const tEnd=i+1<TITLES.length?TITLES[i+1].t0:51.4;
    const oin=seg(t,o.t0,0.35)*(1-seg(t,tEnd-0.25,0.3));
    const sc=1+0.035*Math.sin(clamp(seg(t,o.t0,0.7),0,1)*Math.PI);
    o.el.style.opacity=oin.toFixed(3);
    o.el.style.transform=`scale(${sc.toFixed(3)})`;
  }
  /* CTA poster: AKIOMIDA.COM reveal tenang */
  popA(cta,t,40.9,0.7,6,0,51.6);
  const uo=seg(t,45.8,1.4);
  fUrl.style.opacity=uo.toFixed(3);
  fUrl.style.transform=`translateY(${((1-eio(uo))*14).toFixed(1)}px)`;
  fBar.style.width=(seg(t,48.6,1.8)*Math.max(0,P.ctaW-80)).toFixed(0)+'px';
  popA(fPill,t,47.5,0.6,6,0,51.6);
  renderSub(t);
  /* kamera tenang */
  const im=imp(t);
  const shx=Math.sin(t*47)*2.5*im, shy=Math.sin(t*39+1.7)*1.8*im;
  world.style.transform=`translate(${shx.toFixed(2)}px,${(shy+Math.sin(t*0.35)*3).toFixed(2)}px)`;
  flash.style.opacity=(im*0.07).toFixed(3);
  fade.style.opacity=String(clamp(1-seg(t,0.05,0.5),0,1)*0.96+clamp(seg(t,51.4,0.6),0,1));
}
renderFrame(0);
window.__ready=true;
</script>
</body>
</html>
