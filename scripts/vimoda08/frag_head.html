<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
/*__FONTS__*/
*{box-sizing:border-box}
body{margin:0;background:#14100A;font-family:'Poppins','Noto Sans',sans-serif;-webkit-font-smoothing:antialiased}
#stage{position:relative;overflow:hidden}
#world{position:absolute;inset:0}
#flash{position:absolute;inset:0;background:#FFFFFF;opacity:0;pointer-events:none}
#fade{position:absolute;inset:0;background:#14100A;opacity:0;pointer-events:none}
.center{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.mono{font-family:'JetBrains Mono','DejaVu Sans Mono',monospace}
/* RUMAH BULINA: ruang bermain hangat - dinding krem, wainscot, lantai kayu, karpet */
#wall{position:absolute;inset:0;background:linear-gradient(180deg,#FBF1DB 0%,#F5E5C3 62%,#F1DEB6 100%)}
#wainscot{position:absolute;left:0;width:100%;background:repeating-linear-gradient(90deg,#EDD8AB 0 84px,#E7D2A1 84px 92px);box-shadow:inset 0 6px 0 #DBC18F,inset 0 -14px 0 rgba(0,0,0,.05)}
#bunting{position:absolute;left:0;top:0;width:100%}
#shelf{position:absolute;left:0;top:0;width:100%}
#winframe{position:absolute;left:0;top:0;width:100%}
#frames{position:absolute;left:0;top:0;width:100%}
#props{position:absolute;left:0;top:0;width:100%}
#dust{position:absolute;inset:0}
#chars{position:absolute;inset:0}
#floorplank{position:absolute;left:0;width:100%;background:repeating-linear-gradient(180deg,transparent 0 34px,rgba(90,50,20,.20) 34px 37px),repeating-linear-gradient(90deg,rgba(255,236,200,.10) 0 120px,transparent 120px 260px),linear-gradient(180deg,#C9925C 0,#B47C46 100%)}
#baseboard{position:absolute;left:0;width:100%;background:#B98A54}
#rug{position:absolute;border-radius:999px;background:radial-gradient(ellipse at 50% 38%,rgba(255,255,255,.16),transparent 62%),repeating-linear-gradient(90deg,#3E8E8C 0 56px,#49A09C 56px 112px);border:10px solid #2F6F6D;box-shadow:0 12px 26px rgba(60,35,10,.25);will-change:opacity}
#winframe .wf{position:absolute;background:#8B5A2B;border-radius:6px;box-shadow:0 8px 18px rgba(60,35,10,.30)}
#winframe .pane{position:absolute;background:linear-gradient(180deg,#8FCBEA 0%,#C8E8F4 100%);overflow:hidden;border-radius:3px}
#winframe .dusk{position:absolute;inset:0;background:linear-gradient(180deg,#2A2F63 0%,#7A4670 52%,#D97A5A 100%);opacity:0}
#winframe .puff{position:absolute;border-radius:50%;background:rgba(255,255,255,.85)}
#winframe .sill{position:absolute;background:#A9713C;border-radius:5px;box-shadow:0 5px 10px rgba(60,35,10,.25)}
.shelfb{position:absolute;background:#A9713C;border-radius:6px;box-shadow:0 6px 0 rgba(0,0,0,.12)}
.jarglass{position:absolute;border-radius:14px;background:rgba(216,238,246,.55);border:4px solid rgba(120,150,160,.55);overflow:hidden;box-shadow:0 6px 14px rgba(60,35,10,.18)}
.jarlid{position:absolute;background:#8B5A2B;border-radius:6px}
.mdot{position:absolute;border-radius:50%}
.block3{position:absolute;border-radius:8px;background:linear-gradient(180deg,#F7DA8C,#E9BC5F);box-shadow:0 5px 0 rgba(0,0,0,.15),inset 0 3px 0 rgba(255,255,255,.55);display:flex;align-items:center;justify-content:center;will-change:transform,opacity}
.block3 b{font-family:'JetBrains Mono','DejaVu Sans Mono',monospace;color:#7A4A1E;font-weight:800}
.plantpot{position:absolute;background:#C96A4A;border-radius:6px 6px 10px 10px}
.plantleaf{position:absolute;border-radius:50% 50% 50% 0;background:#4FA35C}
.bunting .flag{position:absolute;width:0;height:0;border-left:14px solid transparent;border-right:14px solid transparent;border-top:26px solid #E15B5B}
.wallframe{position:absolute;background:#FFFDF4;border:10px solid #8B5A2B;border-radius:8px;box-shadow:0 10px 22px rgba(60,35,10,.28);will-change:transform,opacity}
.wallframe .paper{position:absolute;inset:0}
.tapeS{position:absolute;background:rgba(120,200,190,.78);border-radius:3px;transform:rotate(-4deg);box-shadow:0 2px 4px rgba(0,0,0,.12)}
.stickyN{position:absolute;background:linear-gradient(180deg,#FFE08A,#F7CE5B);border-radius:4px;box-shadow:0 6px 14px rgba(60,35,10,.22);display:flex;align-items:center;justify-content:center;font-weight:800;color:#5A3A12;will-change:transform,opacity;text-align:center}
.chartP{position:absolute;background:#FFFDF4;border-radius:10px;box-shadow:0 14px 30px rgba(60,35,10,.28);will-change:transform,opacity;padding:22px 34px}
.chartHd{font-weight:800;color:#1B2437;letter-spacing:.10em;text-align:center}
.chartRow{display:flex;align-items:center;opacity:0}
.chartNote{display:flex;align-items:center;justify-content:center;background:rgba(247,206,91,.55);border-radius:8px;color:#5A3A12;font-weight:800;letter-spacing:.06em;opacity:0}
.easel{position:absolute;will-change:transform,opacity}
.easel .leg{position:absolute;width:16px;background:linear-gradient(180deg,#A9713C,#8B5A2B);border-radius:8px}
.easel .brd{position:absolute;background:#2E4A3F;border:10px solid #8B5A2B;border-radius:8px;box-shadow:0 10px 22px rgba(60,35,10,.30)}
.easel .tray{position:absolute;height:10px;background:#8B5A2B;border-radius:5px}
.chalkT{font-family:'JetBrains Mono','DejaVu Sans Mono',monospace;color:#F2EFE6;font-weight:800}
.chalkL{font-family:'JetBrains Mono','DejaVu Sans Mono',monospace;color:#D8D2C0;font-weight:600}
.basketW{position:absolute;will-change:transform,opacity}
.basketW .bd{position:absolute;border-radius:0 0 60px 60px/0 0 40px 40px;background:repeating-linear-gradient(45deg,#C98F55 0 12px,#B87F4A 12px 24px);box-shadow:inset 0 -10px 0 rgba(0,0,0,.15)}
.basketW .rim{position:absolute;background:#8B5A2B;border-radius:10px}
.basketW .hd{position:absolute;border:10px solid #8B5A2B;border-radius:50%}
.lampf{position:absolute;will-change:opacity}
.lampf .pole2{position:absolute;left:50%;bottom:0;width:12px;margin-left:-6px;background:#5A4632;border-radius:6px}
.lampf .shade2{position:absolute;left:50%;top:0;width:110px;margin-left:-55px;height:44px;background:linear-gradient(180deg,#E9B45C,#D69A3E);border-radius:16px 16px 8px 8px;box-shadow:0 6px 14px rgba(60,35,10,.25)}
.lampf .glow2{position:absolute;left:50%;top:30px;width:220px;height:170px;margin-left:-110px;border-radius:50%;background:radial-gradient(circle,rgba(255,214,130,.50),rgba(255,214,130,0) 70%);opacity:0;will-change:opacity}
.dustp{position:absolute;border-radius:50%;background:#FFE9A8;box-shadow:0 0 10px rgba(255,233,168,.80);opacity:0;will-change:transform,opacity}
.marble{position:absolute;border-radius:50%;will-change:transform,opacity;box-shadow:0 4px 10px rgba(0,0,0,.28)}
.qmark{position:absolute;color:#D69A3E;font-weight:800;text-shadow:0 5px 0 rgba(0,0,0,.18);will-change:transform,opacity}
.bchar{position:absolute;will-change:transform,opacity}
.bchar .core{position:absolute;border-radius:50%}
.bchar .shine{position:absolute;border-radius:50%;background:rgba(255,255,255,.72);filter:blur(2px)}
.bsh{position:absolute;border-radius:50%;background:rgba(90,50,20,.30);filter:blur(2px)}
.title{position:absolute;left:0;width:100%;font-weight:800;color:#3A2A14;letter-spacing:.04em;text-shadow:0 5px 0 rgba(255,255,255,.35),0 12px 26px rgba(90,50,20,.18);will-change:transform,opacity}
#cta{position:absolute;border-radius:16px;background:linear-gradient(180deg,#22304E,#18233B);box-shadow:0 16px 38px rgba(40,22,8,.42);will-change:transform,opacity}
.tapeC{position:absolute;background:rgba(120,200,190,.60);border-radius:3px;box-shadow:0 2px 5px rgba(0,0,0,.18)}
#f_url{font-weight:800;text-align:center}
#f_bar{height:7px;border-radius:4px;background:linear-gradient(90deg,#2BB3A6,#8A6FC6,#E9B45C)}
#f_pill{position:absolute;border-radius:999px;background:linear-gradient(92deg,#2BB3A6 0%,#8A6FC6 52%,#E9B45C 100%);color:#14100A;font-weight:800;display:flex;align-items:center;justify-content:center;will-change:transform,opacity;box-shadow:0 10px 24px rgba(0,0,0,.35)}
#subbar{position:absolute;left:50%;transform:translateX(-50%);background:rgba(24,18,10,.86);border-radius:20px;padding:18px 32px;text-align:center;box-shadow:0 14px 34px rgba(40,22,8,.42);will-change:transform,opacity}
#sub_id{font-weight:800;color:#FFFFFF;line-height:1.26}
#sub_en{color:#C9BBA4;font-weight:600}
#wm{position:absolute;font-weight:800;letter-spacing:.34em;color:#F4EDE0;font-family:'JetBrains Mono','DejaVu Sans Mono',monospace;border:1.5px solid rgba(244,237,224,.42);will-change:transform}
</style>
</head>
<body>
<div id="stage">
  <div id="world">
    <div id="wall"></div>
    <div id="wainscot"></div>
    <div id="bunting"></div>
    <div id="shelf"></div>
    <div id="winframe"></div>
    <div id="frames"></div>
    <div id="props"></div>
    <div id="dust"></div>
    <div id="floorplank"></div>
    <div id="baseboard"></div>
    <div id="rug"></div>
    <div id="chars"></div>
  </div>
  <div id="flash"></div>
  <div id="fade"></div>
  <div class="title" id="t0">MULAI DARI 1?</div>
  <div class="title" id="t1">BILANGAN ASLI</div>
  <div class="title" id="t2">KENAPA NOL?</div>
  <div class="title" id="t3">BILANGAN CACAH</div>
  <div class="title" id="t4">PERAN NOL</div>
  <div class="title" id="t5">LATIHAN KELERENG</div>
  <div id="cta">
    <div id="f_open">8 KELERENG, SEMUA DIBERIKAN.</div>
    <div id="f_open_e">All given away. How many are left? Comment your answer!</div>
    <div id="f_url">AKIOMIDA.COM</div>
    <div id="f_bar"></div>
    <div id="f_pill">TULIS DI KOMEN</div>
  </div>
  <div id="subbar"><div id="sub_id"></div><div id="sub_en"></div></div>
  <div id="wm">AKIOMIDA</div>
</div>
<script>
