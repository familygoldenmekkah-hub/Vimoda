/* KIOS PERMEN rev3 - MISTERI PEMBAGI RAPI: alur detektif yang sepenuhnya
   positif (tanpa kejahatan) - seseorang diam-diam menata permen dengan
   rata di malam hari, detektif angka menyusuri petunjuk faktor dan
   kelipatan, twist memberdayakan: cara berbagi terbatas, peluang tanpa
   batas, dan penutup moral berbagi itu seru dan baik. Malam ajaib: overlay
   biru gelap, kunang-kunang emas, genangan cahaya lampion di lantai,
   vignette sinematik; fajar hangat saat ucapan terima kasih. Panel konten
   plum gelap berbingkai kuning safety dengan tab merah PETUNJUK/MISI ala
   berkas dan lingkaran petunjuk merah, plus garis aksen emas per header.
   Tanpa label episode (keputusan pemilik). Karakter: HANYA bola emas
   mentor, bulat sejati, tanpa mata (aturan 23). Dramaturgi anime aturan
   34: jeda ma, speedlines twist, jurus bernama, kartu formasi, transisi
   panel meluncur agar mengalir. Subjudul zona aman maksimal dua baris
   (aturan 27); watermark AKIOMIDA di tepi paling bawah (aturan 24);
   penutup bersih (aturan 28). */
#candywall{position:absolute;left:0;top:0;width:100%;
  background:repeating-linear-gradient(90deg,rgba(255,255,255,.38) 0 6px,transparent 6px 150px),
  linear-gradient(180deg,#FBEFE0 0%,#F3D2B8 100%)}
#tilesun{position:absolute;inset:0;background:rgba(58,38,26,0);will-change:background}
#awning{position:absolute;left:0;top:0;width:100%;will-change:opacity}
#awning .band{position:absolute;left:0;top:0;width:100%;
  background:repeating-linear-gradient(90deg,#C9524A 0 64px,#FFF4E4 64px 128px);
  box-shadow:0 6px 14px rgba(90,40,20,.28)}
#awning .scal{position:absolute;border-radius:0 0 999px 999px}
.lant{position:absolute;will-change:transform,opacity}
.lant .cord{position:absolute;width:3px;background:#7A4A2E}
.lant .body{position:absolute;border-radius:50%;

.lant .glow{position:absolute;border-radius:50%;
  background:radial-gradient(circle,rgba(255,224,160,.75),rgba(255,224,160,0) 70%)}
#shelf{position:absolute;will-change:opacity}
#shelf .plank{position:absolute;background:linear-gradient(180deg,#C9784A,#A85E38);border-radius:6px;box-shadow:0 6px 14px rgba(90,40,20,.3)}
.jar{position:absolute;will-change:transform,opacity}
.jar .glass{position:absolute;border-radius:10px 10px 14px 14px;

.jar .lid{position:absolute;border-radius:8px;background:linear-gradient(180deg,#C9784A,#A85E38)}
.jar .candy{position:absolute;border-radius:50%;will-change:transform,opacity}
#floorwood{position:absolute;left:0;width:100%;

#runner{position:absolute;border-radius:999px;

#baseboard{position:absolute;left:0;width:100%;background:#8A5638}
#counter{position:absolute;will-change:opacity}

#etalase{position:absolute;will-change:opacity}

  border:3px solid rgba(150,96,60,.55);box-shadow:0 8px 18px rgba(90,40,20,.25)}
#etalase .shelfL{position:absolute;background:rgba(150,96,60,.4);border-radius:2px}
#sign{position:absolute;will-change:opacity}

.panelI{position:absolute;background:linear-gradient(180deg,#3A2A50,#2A1E38);border-radius:16px;border:4px solid #E8B32E;box-shadow:0 16px 38px rgba(30,18,4,.5);will-change:transform,opacity}
.tapeC{position:absolute;background:rgba(232,179,46,.5);border-radius:3px;box-shadow:0 2px 5px rgba(30,18,4,.25)}
.pHd{font-weight:800;color:#FFF6E6;letter-spacing:.10em;text-align:center}
.pBig{font-family:'JetBrains Mono','DejaVu Sans Mono',monospace;font-weight:800;color:#F2CE8E;text-align:center;opacity:0;will-change:opacity}
.pRow{display:flex;align-items:center;opacity:0}
.pDot{border-radius:50%;flex:none}

.pNote{display:flex;align-items:center;justify-content:center;background:rgba(232,179,46,.22);border:2px solid rgba(232,179,46,.6);border-radius:10px;color:#F2CE8E;font-weight:800;letter-spacing:.05em;text-align:center;opacity:0;will-change:opacity}
.chipA{display:flex;align-items:center;justify-content:center;border-radius:12px;font-family:'JetBrains Mono','DejaVu Sans Mono',monospace;font-weight:800;color:#FFF6E6;background:#4A3A62;box-shadow:0 8px 18px rgba(30,18,4,.4);opacity:0;will-change:opacity}
.stamp{position:absolute;display:flex;align-items:center;justify-content:center;border-radius:999px;background:linear-gradient(92deg,#7FA6BF 0%,#D97A2E 52%,#E8B32E 100%);color:#22160C;font-weight:800;letter-spacing:.06em;box-shadow:0 12px 26px rgba(30,18,4,.45);will-change:transform,opacity}
.vrow{display:flex;align-items:center;opacity:0}
.vrow .vd{border-radius:50%;flex:none}
.vrow .vt{font-weight:700;color:#FFF6E6}
.valCard{position:absolute;box-sizing:border-box;display:flex;align-items:center;justify-content:center;border-radius:10px;background:linear-gradient(180deg,#FFFDF6,#F2E6C6);border:3px solid #C8A86E;font-family:'JetBrains Mono','DejaVu Sans Mono',monospace;font-weight:800;color:#3A2C1E;box-shadow:0 8px 18px rgba(30,18,4,.35);will-change:transform,opacity}
.qmark{position:absolute;color:#C9524A;font-weight:800;text-shadow:0 5px 0 rgba(0,0,0,.25);will-change:transform,opacity}
.evtab{position:absolute;font-family:'JetBrains Mono','DejaVu Sans Mono',monospace;font-weight:800;
  color:#FFF6E6;background:#C9524A;border-radius:6px;letter-spacing:.10em;
  box-shadow:0 6px 14px rgba(60,20,10,.4);transform:rotate(-3deg)}
.ringR{position:absolute;border:4px solid #D93A3A;border-radius:50%;
  box-shadow:0 0 14px rgba(217,58,58,.45);will-change:transform,opacity}
.vig{position:absolute;inset:0;pointer-events:none;opacity:.55;
  background:radial-gradient(ellipse at 50% 44%,transparent 52%,rgba(22,12,6,.42) 100%)}
.fire{position:absolute;border-radius:50%;background:#FFE9A8;pointer-events:none;
  box-shadow:0 0 12px rgba(255,233,168,.9);will-change:transform,opacity}
.pool{position:absolute;border-radius:50%;pointer-events:none;will-change:opacity;
  background:radial-gradient(ellipse,rgba(255,196,110,.30),rgba(255,196,110,0) 70%)}
.glowh{position:absolute;border-radius:50%;pointer-events:none;will-change:transform,opacity;
  background:radial-gradient(circle,rgba(255,236,190,.95) 0%,rgba(255,214,130,.55) 38%,rgba(255,214,130,0) 70%)}
.orb2{position:absolute;border-radius:50%;background:#FFF6DC;pointer-events:none;
  box-shadow:0 0 10px rgba(255,240,200,.95);will-change:transform,opacity}
.hdLine{height:4px;border-radius:2px;background:linear-gradient(90deg,transparent,#E8B32E,transparent);opacity:0}
.panelI::after{content:'';position:absolute;inset:6px;border-radius:12px;
  border:1px solid rgba(255,244,214,.18);pointer-events:none}
.uline{position:absolute;height:5px;border-radius:3px;background:#D93A3A;box-shadow:0 0 10px rgba(217,58,58,.5);will-change:transform,opacity}
.xbar{position:absolute;background:#D93A3A;border-radius:4px;box-shadow:0 0 12px rgba(217,58,58,.55);will-change:transform,opacity}
.sil{position:absolute;border-radius:12px 12px 16px 16px;background:linear-gradient(180deg,#1C1210,#0C0705);
  border:3px solid #060403;box-shadow:0 14px 30px rgba(10,5,2,.55);will-change:transform,opacity}
.sil .lid2{position:absolute;border-radius:6px;background:#060403}
.plate{position:absolute;border-radius:50%;background:linear-gradient(180deg,#FFF6EA,#EFD9BC);border:4px solid #C9784A;box-shadow:0 12px 26px rgba(90,40,20,.3);will-change:opacity}
.cd{position:absolute;border-radius:50%;will-change:transform,opacity;box-shadow:0 3px 8px rgba(90,40,20,.3)}
.title{position:absolute;left:0;width:100%;text-align:center;font-weight:800;color:#3A2E20;letter-spacing:.04em;text-shadow:0 5px 0 rgba(255,255,255,.45),0 12px 26px rgba(90,40,10,.22);will-change:transform,opacity}
#pil{position:absolute;border-radius:999px;background:linear-gradient(92deg,#7FA6BF 0%,#D97A2E 52%,#E8B32E 100%);color:#22160C;font-weight:800;display:flex;align-items:center;justify-content:center;will-change:transform,opacity;box-shadow:0 10px 24px rgba(30,18,4,.4)}
#endcard{position:absolute;left:0;width:100%;opacity:0;will-change:transform,opacity}
#fplate{background:rgba(26,16,10,.62);border-radius:28px;padding:14px 44px;width:max-content;margin:0 auto;box-shadow:0 14px 34px rgba(30,18,4,.4)}
#f_url{font-weight:800;text-align:center}
#f_bar{height:7px;border-radius:4px;background:linear-gradient(90deg,#7FA6BF,#D97A2E,#E8B32E)}
#subbar{position:absolute;left:50%;transform:translateX(-50%);background:rgba(26,16,10,.86);border-radius:20px;padding:18px 32px;text-align:center;box-shadow:0 14px 34px rgba(30,18,4,.5);will-change:transform,opacity}
#sub_id{font-weight:800;color:#FFFFFF;line-height:1.26}
#sub_en{color:#D9C8B4;font-weight:600}
#wm{position:absolute;font-weight:800;letter-spacing:.34em;color:#F6EFE2;font-family:'JetBrains Mono','DejaVu Sans Mono',monospace;border:1.5px solid rgba(246,239,226,.42);will-change:transform}
.bchar{position:absolute;will-change:transform,opacity}
.bchar .core{position:absolute;border-radius:100%}
.bchar .shine{position:absolute;border-radius:50%;background:rgba(255,255,255,.72);filter:blur(2px)}
.bsh{position:absolute;border-radius:50%;background:rgba(40,24,8,.4);filter:blur(2px)}
.spark{position:absolute;width:34px;height:34px;opacity:0}
.spark .sa{position:absolute;background:#FFE9A8;border-radius:3px}
</style>
</head>
<body>
<div id="stage">
  <div id="world">
    <div id="candywall"></div>
    <div id="tilesun"></div>
    <div id="awning"><div class="band"></div></div>
    <div class="lant"><div class="cord"></div><div class="body"></div><div class="glow"></div></div>
    <div class="lant"><div class="cord"></div><div class="body"></div><div class="glow"></div></div>
    <div id="shelf"></div>
    <div id="floorwood"></div>
    <div id="baseboard"></div>
    <div id="runner"></div>
    <div id="counter"><div class="slab"></div><div class="leg"></div><div class="leg"></div></div>
    <div id="etalase"><div class="box"></div></div>
    <div id="sign"><div class="board"></div></div>
    <div id="props"></div>
    <div id="chars"></div>
  </div>
  <div id="speedlines"></div>
  <div id="spotlight"></div>
  <div id="vig"></div>
  <div id="flash"></div>
  <div id="fade"></div>
  <div id="pil">JAWAB DI KOLOM KOMENTAR YA</div>
  <div id="endcard">
    <div id="fplate"><div id="f_url">AKIOMIDA.COM</div></div>
    <div id="f_bar"></div>
  </div>
  <div class="title" id="t0">MISTERI PEMBAGI RAPI</div>
  <div class="title" id="t1">PETUNJUK PERTAMA: FAKTOR</div>
  <div class="title" id="t2">PETUNJUK KEDUA: KELIPATAN</div>
  <div class="title" id="t3">TERBATAS VS TANPA BATAS</div>
  <div class="title" id="t4">JURUS BAGI RATA</div>
  <div class="title" id="t5">TERIMA KASIH!</div>
  <div class="title" id="t6">MISI BARU UNTUKMU!</div>
  <div id="subbar"><div id="sub_id"></div><div id="sub_en"></div></div>
  <div id="wm">AKIOMIDA</div>
</div>
<script>
const Q=new URLSearchParams(location.search);
const ORIENT=Q.get('o')||'landscape';
const W=ORIENT==='portrait'?1080:1920;
const H=ORIENT==='portrait'?1920:1080;
const P = ORIENT==='portrait' ? {
  floorY:1080, bbY:1064,
  tableX:50, tableW:330, slabY:830, slabH:52, legBot:1080,
  bdW:300, bdH:96, bdCX:215, bdCY:778,
  shelfX:80, shelfW:920,
  stampX:445, stampY:690, stampW:520, stampH:64, stampFS:26,
  panelX:400, panelY:470, panelW:610, panelH:360,
  pilX:250, pilY:850, pilW:580, pilH:66, pilFS:26,
  ecY:830, barW:420,
  titleY:300, titleS0:80, titleSN:74,
  subTop:1170, subId:46, subEn:25, subMax:880,
  ballD:110, groundY:1120, wmY:1800, wmFS:22,
  lampsX:[340,700], lampsY:[168,150], lampsD:[74,62],
  markX:220, markY:1096, markW:640, markH:16,
  signX:800, signY:848, signW:240, signH:150,
  cardW:132, cardH:62, cardFS:30,
  jarW:120, jarH:150, candyD:26,
  bigJarX:620, bigJarY:830, bigJarW:170, bigJarH:200,
  plateX:420, plateY:850, plateW:320, plateH:170, plateD:14
} : {
  floorY:508, bbY:494,
  tableX:140, tableW:360, slabY:540, slabH:40, legBot:700,
  bdW:340, bdH:82, bdCX:320, bdCY:494,
  shelfX:140, shelfW:600,
  stampX:940, stampY:440, stampW:600, stampH:58, stampFS:23,
  panelX:760, panelY:250, panelW:1020, panelH:290,
  pilX:670, pilY:620, pilW:580, pilH:62, pilFS:25,
  ecY:400, barW:520,
  titleY:150, titleS0:88, titleSN:72,
  subTop:740, subId:46, subEn:25, subMax:1360,
  ballD:96, groundY:660, wmY:1010, wmFS:22,
  lampsX:[560,1000], lampsY:[112,100], lampsD:[62,52],
  markX:620, markY:672, markW:680, markH:14,
  signX:1440, signY:556, signW:240, signH:140,
  cardW:112, cardH:50, cardFS:26,
  jarW:100, jarH:115, candyD:20,
  bigJarX:940, bigJarY:560, bigJarW:140, bigJarH:135,
  plateX:860, plateY:555, plateW:260, plateH:110, plateD:11
};
const stage=document.getElementById('stage');
stage.style.width=W+'px';stage.style.height=H+'px';

/* ---------- util & easing ---------- */
const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,p)=>a+(b-a)*p;
const seg=(t,a,d)=>clamp((t-a)/d,0,1);
const eio=p=>p<0.5?2*p*p:1-Math.pow(-2*p+2,2)/2;
const eoe=p=>1-Math.pow(1-p,3);
const smz=(t,a,b,f)=>f?clamp((t-a)/f,0,1)*clamp((b-t)/f,0,1):(t>=a&&t<b?1:0);
function popA(el,t,t0,d,ov,op0,op1){
  const o=clamp(seg(t,t0,0.3)*(1-seg(t,op1,0.35)),0,1);
  const s2=1+(ov/100)*Math.sin(clamp(seg(t,t0,d),0,1)*Math.PI)*(1-seg(t,op1,0.35));
  el.style.opacity=String(o);
  el.style.transform=`scale(${s2.toFixed(3)})`;
}
let _seed=20261122;
const rnd=()=>{_seed|=0;_seed=_seed+0x6D2B79F5|0;let z=Math.imul(_seed^_seed>>>15,1|_seed);
  z=z+Math.imul(z^z>>>7,61|z)^z;return((z^z>>>14)>>>0)/4294967296;};

/* ---------- dinding kios krem pink, lantai papan kayu, baseboard ---------- */
const wallEl=document.getElementById('candywall');
wallEl.style.cssText+=`height:${P.floorY}px;`;
const floorEl=document.getElementById('floorwood');
floorEl.style.cssText+=`top:${P.floorY}px;height:${H-P.floorY}px;`;
const bbEl=document.getElementById('baseboard');
bbEl.style.cssText+=`top:${P.bbY}px;height:${P.floorY-P.bbY}px;`;

/* ---------- awning scallop merah-krem di tepi atas ---------- */
const awnEl=document.getElementById('awning');
const CANDY=['#E85D5D','#F2A03D','#5CA85C','#5A8AD8','#C97BCA','#F2C14E'];
{
  const bh=ORIENT==='portrait'?52:36;
  const band=awnEl.querySelector('.band');
  band.style.cssText+=`height:${bh}px;`;
  const n=Math.ceil(W/64)+1;
  for(let i=0;i<n;i++){
    const sc=document.createElement('div');
    sc.className='scal';
    sc.style.cssText+=`left:${i*64-8}px;top:${bh-13}px;width:80px;height:26px;
      background:${i%2===0?'#C9524A':'#FFF4E4'};`;
    awnEl.appendChild(sc);
  }
}
/* ---------- dua lampion kertas bulat hangat (redup saat malam kasus) ---------- */
const LAMPS=[];
document.querySelectorAll('.lant').forEach((lw,i)=>{
  const lx=P.lampsX[i], ly=P.lampsY[i], ld=P.lampsD[i];
  const cord=lw.querySelector('.cord');
  cord.style.cssText+=`left:${lx-1.5}px;top:0;height:${ly}px;`;
  const body=lw.querySelector('.body');
  body.style.cssText+=`left:${lx-ld/2}px;top:${ly}px;width:${ld}px;height:${ld}px;`;
  const glow=lw.querySelector('.glow');
  glow.style.cssText+=`left:${lx-ld*0.9}px;top:${ly-ld*0.15}px;width:${ld*1.8}px;height:${ld*1.8}px;`;
  LAMPS.push({lw,glow,ph:i*2.1,ly:ly});
});
/* ---------- rak kayu berisi stoples permen di dinding (ikon dunia) ---------- */
function makeJar(parent,x,y,w,h,small){
  const root=document.createElement('div');
  root.className='jar';
  root.style.cssText+=`left:${x}px;top:${y}px;width:${w}px;height:${h}px;`;
  const lid=document.createElement('div');
  lid.className='lid';
  lid.style.cssText+=`left:${Math.round(w*0.12)}px;top:0;width:${Math.round(w*0.76)}px;height:${Math.round(h*0.16)}px;`;
  const glass=document.createElement('div');
  glass.className='glass';
  glass.style.cssText+=`left:0;top:${Math.round(h*0.14)}px;width:${w}px;height:${Math.round(h*0.86)}px;`;
  root.appendChild(lid);root.appendChild(glass);
  parent.appendChild(root);
  const cd=small?(ORIENT==='portrait'?18:15):P.candyD;
  const gx=Math.round(w*0.14), gy=Math.round(h*0.30);
  return {root,cd,gx,gy};
}
const shelfEl=document.getElementById('shelf');
{
  const planks=ORIENT==='portrait'?[168,238]:[264,318];
  planks.forEach(py=>{
    const pk=document.createElement('div');
    pk.className='plank';
    pk.style.cssText+=`left:${P.shelfX}px;top:${py}px;width:${P.shelfW}px;height:14px;`;
    shelfEl.appendChild(pk);
  });
  const JW=ORIENT==='portrait'?84:70, JH=ORIENT==='portrait'?76:62;
  const spots=ORIENT==='portrait'
    ? [[150,0],[260,0],[370,0],[480,0],[560,1],[670,1],[780,1],[890,1]]
    : [[210,0],[300,0],[390,0],[250,1],[340,1],[430,1]];
  spots.forEach(([sx,si])=>{
    const jr=makeJar(shelfEl,sx,planks[si]-JH+2,JW,JH,true);
    for(let k=0;k<3;k++){
      const c=document.createElement('div');
      c.className='candy';
      c.style.cssText+=`left:${jr.gx+ (k%2)*Math.round(jr.cd*1.25)}px;top:${jr.gy+Math.floor(k/2)*Math.round(jr.cd*1.15)}px;
        width:${jr.cd}px;height:${jr.cd}px;background:${CANDY[(si*3+k)%CANDY.length]};opacity:.9;`;
      jr.root.appendChild(c);
    }
  });
}
/* ---------- meja kios dan etalase kaca ---------- */
const counterEl=document.getElementById('counter');

  const o=clamp(Math.min(seg(t,SUBS[i][0],0.3), 1-seg(t,nxt-0.16,0.16)),0,1);

  const ty=34*(1-eio(seg(t,t0,0.5)))-26*eio(seg(t,op1,0.4))+Math.sin(t*1.1+floatPh)*2;

  }

    pl.el.style.opacity=(0.5*darkP+0.26*(1-darkP)).toFixed(3);
  }
  for(const f of FF){
    const fx=f.bx+Math.sin(t*0.45+f.ph)*34;
    const fy=f.by+Math.cos(t*0.37+f.ph)*26;
    const tw=Math.max(0,Math.sin(t*1.6+f.ph));

    f.el.style.left=fx.toFixed(1)+'px';
    f.el.style.top=fy.toFixed(1)+'px';

  /* penutup bersih (aturan 28): konten keluar di 71.6 */
  const exo=1-seg(t,71.6,0.5);

    const burst=t>=5.2?1+0.07*Math.sin(clamp(seg(t,5.2,0.5),0,1)*Math.PI):1;

    jj.root.style.transform=`translateY(${Math.sin(t*1.6+jj.jx)*1.5}px) scale(${burst.toFixed(3)})`;
  }
  for(const hc of HK){
    const p=seg(t,hc.t0,0.5);

  for(const r of P2ROWS){ r.el.style.opacity=seg(t,r.t0,0.45).toFixed(3); }
  for(const c of P2CHIPS){
    c.el.style.opacity=(clamp(seg(t,c.t0,0.35),0,1)*(1-seg(t,33.7,0.3))).toFixed(3);
    if(c.ev){
      const hot=t<c.t0+0.9&&t>=c.t0;
      c.el.style.borderColor=hot?'#D93A3A':'rgba(232,179,46,0)';
      c.el.style.boxShadow=hot?'0 0 16px rgba(217,58,58,.55)':'0 8px 18px rgba(30,18,4,.4)';
    }
  }
  popA(p2Note,t,31.0,0.5,5,0,33.7);
  popA(p2Note2,t,32.0,0.5,5,0,33.7);
  popA(JARBIG.root,t,24.2,0.55,5,0,33.7);
  for(const bc of BIGC){
    const p=seg(t,bc.t0,0.35);
    const py=lerp(P.bigJarY-100,bc.slotTop,eio(p));
    bc.el.style.opacity=clamp(seg(t,bc.t0,0.15)*(1-seg(t,33.7,0.3)),0,1).toFixed(3);
    bc.el.style.top=(py)+'px';
    bc.el.style.transform=`scale(${(1+0.15*(1-p)).toFixed(3)})`;
  }
  /* JEDA DRAMATIS (ma) 33.6-34.4: layar kosong, mentor ke tengah, audio hening */
  /* DEDUKSI TWIST memberdayakan: speedlines anime */
  slideY(panelS,t,35.0,40.6,2.2);
  popA(sBig,t,35.4,0.5,7,0,40.6);
  for(const r of SROWS){ r.el.style.opacity=seg(t,r.t0,0.4).toFixed(3); }
  popA(sNote,t,39.2,0.45,5,0,40.6);
  /* RENCANA TERIMA KASIH: prediksi 24 + jurus bagi rata + meja sambutan */
  slideY(panel4,t,42.2,56.1,3.1);
  popA(p4Big,t,42.6,0.5,5,0,56.1);
  {
    const uw=160*eio(seg(t,43.8,0.5));
    ul24.style.opacity=seg(t,43.8,0.3).toFixed(3);
    ul24.style.width=uw.toFixed(1)+'px';
    ul24.style.left=(P.panelW/2-uw/2)+'px';
  }
  for(const r of P4ROWS){ r.el.style.opacity=seg(t,r.t0,0.45).toFixed(3); }
  popA(jurus,t,46.4,0.5,9,0,56.1);
  popA(p4Note,t,49.0,0.45,5,0,56.1);
  popA(p4Note2,t,49.8,0.45,5,0,56.1);
  popA(plateEl,t,42.2,0.55,5,0,56.1);
  let pi2=0;
  for(let i=0;i<PLATED.length;i++){
    const pd=PLATED[i];
    let g=PLATE_G[0], prev=null;
    for(let k=1;k<PLATE_G.length;k++){
      if(t>=PLATE_T[k]){ prev=[PLATE_G[k-1],PLATE_T[k]]; g=PLATE_G[k]; }
    }
    let px,py;
    if(prev){
      const p2=eio(seg(t,prev[1],0.9));
      const [ax,ay]=platePos(prev[0],i);
      const [bx,by]=platePos(g,i);
      px=lerp(ax,bx,p2); py=lerp(ay,by,p2);
    }else{
      const [ax,ay]=platePos(g,i);
      px=ax; py=ay;
    }
    const po=clamp(seg(t,pd.t0,0.25)*(1-seg(t,56.1,0.3)),0,1);
    pd.el.style.opacity=po.toFixed(3);
    pd.el.style.left=(px-P.plateD/2)+'px';
    pd.el.style.top=(py-P.plateD/2)+'px';
    pd.el.style.transform=`translateY(${(Math.sin(t*2+pi2*0.35)*2).toFixed(1)}px)`;
    pi2++;
  }
  /* MISI BARU: papan uji (aturan 30 + framing battle 34) */
  slideY(panelUji,t,62.2,71.6,4.2);
  ujiHd.style.opacity=(seg(t,62.4,0.35)*exo).toFixed(3);
  for(const rr of UJIS){ rr.el.style.opacity=seg(t,rr.t0,0.35).toFixed(3); }
  for(let i=0;i<CARDS.length;i++){
    const cc=CARDS[i];
    const inA=clamp(seg(t,cc.pop,0.35),0,1);
    const dir=i%2===0?-1:1;
    const off=(1-inA)*46*dir;
    const rot=(1-inA)*10*dir;
    const s2=1+0.09*Math.sin(clamp(seg(t,cc.pop,0.4),0,1)*Math.PI);
    cc.el.style.opacity=(inA*exo).toFixed(3);
    cc.el.style.transform=`translateX(${off.toFixed(1)}px) rotate(${rot.toFixed(2)}deg) scale(${s2.toFixed(3)})`;
    cc.el.style.borderColor=inA>0.9&&t<cc.pop+0.45?'#E8B32E':'#C8A86E';
  }
  popA(ujiNote,t,66.2,0.45,5,0,71.6);
  popA(pil,t,67.8,0.6,6,0,71.6);
  /* penutup bersih (aturan 28) */
  counterEl.style.opacity=exo.toFixed(3);
  etalaseEl.style.opacity=exo.toFixed(3);
  signEl.style.opacity=exo.toFixed(3);
  markEl.style.opacity=String(clamp(0.96*exo+0.04,0.04,1));
  /* mentor menggelinding di karpet festival, bernapas pelan saat diam */
  let bx=WAY[WAY.length-1][1];
  for(let k=0;k<WAY.length-1;k++){
    const [w0,x0]=WAY[k],[w1,x1]=WAY[k+1];
    if(t>=w0&&t<w1){ bx=lerp(x0,x1,eio(seg(t,w0,w1-w0))); break; }
  }
  if(t>=WAY[WAY.length-1][0])bx=WAY[WAY.length-1][1];
  if(_mxPrev===null)_mxPrev=bx;
  _roll+=(bx-_mxPrev)/(P.ballD/2)*(180/Math.PI);
  _mxPrev=bx;
  const ep=seg(t,0.7,0.55);
  let hy2=-(0.5+0.5*Math.sin(t*2.1))*3, lrot=0, drot=0, txj=0;
  for(const [gs,gd,gt,ga] of GESTS){
    const d2=t-gs;
    if(d2>=0&&d2<gd){
      const p=d2/gd, w=Math.sin(p*Math.PI);
      if(gt==='tilt'||gt==='lean'){ lrot+=ga*w; }
      else if(gt==='nod'){ lrot+=ga*Math.sin(p*2*Math.PI); }
      else if(gt==='shiver'){ txj=ga*Math.sin(p*40)*(1-p); }
      else if(gt==='spin'){ drot+=ga*eio(p); }
      else if(gt==='hop'){ hy2-=ga*Math.sin(p*Math.PI); }
      else if(gt==='brace'){ lrot-=11*w; }
    }
  }
  mentor.el.style.left=bx.toFixed(1)+'px';
  mentor.el.style.opacity=String(clamp(ep*3,0,1)*exo);
  mentor.el.style.top=(P.groundY-P.ballD+hy2).toFixed(1)+'px';
  mentor.el.style.transform=`translateX(${txj.toFixed(1)}px) rotate(${(_roll+lrot+drot).toFixed(2)}deg) scale(1)`;
  msh.style.left=bx.toFixed(1)+'px';
  msh.style.top=(P.groundY-10)+'px';
  msh.style.opacity=String(clamp(ep*3,0,1)*exo*clamp(0.42+hy2*0.006,0.18,0.5));
  msh.style.transform=`scaleX(${clamp((1+hy2*0.004),0.4,1.08).toFixed(3)})`;
  /* power-up ala anime saat menyiapkan kejutan terima kasih */
  const pu=smz(t,45.6,48.0,0.35);
  const glowPx=P.ballD*0.55+pu*(30+18*Math.sin(t*10));
  mentorCore.style.boxShadow=`0 0 ${glowPx.toFixed(0)}px rgba(251,191,36,${(0.5+0.3*pu).toFixed(2)})`;
  /* percikan bintang */
  let spo=0;
  for(const [sa,sb] of SPARKS){
    if(t>=sa&&t<sb) spo=smz(t,sa,sb,0.35)*(0.65+0.2*Math.sin(t*7));
  }
  spark.style.opacity=String(clamp(spo,0,1));
  spark.style.left=(bx+62).toFixed(1)+'px';
  spark.style.top=(P.groundY-150+Math.sin(t*2)*4).toFixed(1)+'px';
  spark.style.transform=`rotate(${((t*28)%360).toFixed(0)}deg) scale(${(0.8+0.15*Math.sin(t*7)).toFixed(3)})`;
  /* judul bab: slide-up + fade mengalir */
  for(let i=0;i<TITLES.length;i++){
    const o=TITLES[i];
    const tEnd=i+1<TITLES.length?TITLES[i+1].t0:71.8;
    const oin=seg(t,o.t0,0.35)*(1-seg(t,tEnd-0.2,0.35));
    const sc2=1+0.035*Math.sin(clamp(seg(t,o.t0,0.7),0,1)*Math.PI);
    const ty2=16*(1-eio(seg(t,o.t0,0.4)));
    o.el.style.opacity=oin.toFixed(3);
    o.el.style.transform=`translateY(${ty2.toFixed(1)}px) scale(${sc2.toFixed(3)})`;
  }
  /* TWIST anime: speedlines 34.4 + spotlight deduksi dan ucapan terima kasih */
  {
    const iv=Math.max(0,(1-seg(t,34.4,0.55))*clamp(seg(t,34.4,0.06),0,1));
    speedEl.style.opacity=(iv*0.85).toFixed(3);
    const isc=1+0.14*Math.sin(clamp(seg(t,34.4,0.5),0,1)*Math.PI);
    speedEl.style.transform=`scale(${isc.toFixed(3)})`;
    const spotTwist=clamp(seg(t,35.0,0.3)*(1-seg(t,38.2,1.0)),0,1)*0.75;
    const spotReveal=clamp(seg(t,56.6,0.3)*(1-seg(t,59.0,1.0)),0,1)*0.8;
    spotEl.style.opacity=Math.max(spotTwist,spotReveal).toFixed(3);
  }
  /* endcard penutup bersih + teaser tersisip (aturan 32) */
  const eci=eio(seg(t,71.8,0.8));
  endcard.style.opacity=eci.toFixed(3);
  endcard.style.transform=`translateY(${((1-eci)*16).toFixed(1)}px) scale(${(0.94+0.06*eci).toFixed(3)})`;
  fBar.style.width=(seg(t,77.4,0.8)*P.barW).toFixed(0)+'px';
  renderSub(t);
  /* kamera: hanyut pelan terus-menerus + impact punch + push-in momen kunci */
  const im=imp(t);
  let push=0;
  for(const [pa,pb] of PUSHES){ push+=0.05*smz(t,pa,pb,0.35); }
  const shx=Math.sin(t*47)*2.5*im+Math.sin(t*0.21)*5;
  const shy=Math.sin(t*39+1.7)*1.8*im+Math.cos(t*0.15)*3.5+Math.sin(t*0.35)*2;
  world.style.transform=`translate(${shx.toFixed(2)}px,${shy.toFixed(2)}px) scale(${(1+push).toFixed(4)})`;
  flash.style.opacity=clamp(im*0.07+smz(t,56.4,56.7,0.05)*0.4,0,1).toFixed(3);
  fade.style.opacity=String(clamp(1-seg(t,0.05,0.5),0,1)*0.96+clamp(seg(t,79.8,0.8),0,1));
}
renderFrame(0);
window.__ready=true;
</script>
</body>
</html>
