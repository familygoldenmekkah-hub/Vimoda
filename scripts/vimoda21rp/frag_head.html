<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
/* GRUP RESEP GAGAL - VIDEO 21, MODEL FOKUS + SISTEM DESAIN GLOW v3
   (otak/DESAIN-GLOW.md) - ROMBAK TOTAL per penolakan pemilik (nilai 1/10
   untuk sistem sebelumnya). Bahasa visual baru: gradien pastel HIDUP (blob bokeh
   coral-rose-lilac-aqua drift + sparkle), permukaan KACA buram
   (glassmorphism) dengan ring gradien + glow warna karakter, 4 HERO SCENE
   sinematik ilustrasi AI (buka judul + 2 poster materi + CTA penutup)
   dengan Ken Burns + judul display, bar progres cerita 5 segmen, teks
   plum #43304F (bukan hitam pekat), fade ke gradien terang. NOL permukaan
   datar membosankan, NOL panel gelap. MODEL FOKUS tetap: SATU bubble
   besar di tengah (pesan lama memudar), sisipan meme hard-cut. Materi:
   BILANGAN di dapur (presisi takaran 200 vs 20 gram, urutan langkah 1-5,
   dobel porsi 4->8). Formula v1 F1-F8. Produksi 9:16 SAJA (L1 revisi). */
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;
  font-family:'Poppins','Noto Color Emoji','DejaVu Sans','Noto Sans SC',sans-serif;
  -webkit-font-smoothing:antialiased}
body{background:linear-gradient(160deg,#FFEDD9 0%,#FFD9E8 34%,#E8DCFF 68%,#D6F1FF 100%)}
/* lapisan GLOW: blob bokeh + sparkle (diisi frag_scene.js) */
#glowlayer{position:absolute;inset:0;overflow:hidden;z-index:0}
.blob{position:absolute;border-radius:50%;filter:blur(72px);opacity:.5;will-change:transform}
.spark{position:absolute;border-radius:50%;will-change:transform,opacity}
.glownum{position:absolute;font-weight:800;color:rgba(255,255,255,.5);
  will-change:transform,opacity;text-shadow:0 2px 18px rgba(255,150,180,.35)}
#bgdoodle{position:absolute;inset:0;z-index:0}
.doodle{position:absolute;color:rgba(255,255,255,.42);font-weight:800;will-change:transform,opacity}
.dperm{position:absolute;border-radius:50%;will-change:transform,opacity}
#vig{position:absolute;inset:0;pointer-events:none;opacity:.55;z-index:1;
  background:radial-gradient(ellipse at 50% 42%,transparent 55%,rgba(150,100,180,.14) 100%)}
#rig{position:absolute;inset:0;z-index:2;will-change:transform}
/* header kaca + bar progres cerita */
#phead{position:absolute;left:0;right:0;top:0;height:118px;
  background:rgba(255,255,255,.52);backdrop-filter:blur(18px) saturate(1.25);
  border-bottom:1.5px solid rgba(255,255,255,.75);display:flex;align-items:center;
  padding:0 44px;z-index:30;box-shadow:0 10px 30px rgba(150,90,160,.14)}
.havatar{position:relative;width:74px;height:74px;flex:0 0 74px;margin-right:24px}
.havatar div{position:absolute;border-radius:50%;border:3px solid rgba(255,255,255,.95);
  box-shadow:0 6px 16px rgba(150,90,160,.25)}
.havatar .a1{left:0;top:8px;width:48px;height:48px;background:linear-gradient(135deg,#FFC94D,#FF6B8A)}
.havatar .a2{left:30px;top:0;width:44px;height:44px;background:linear-gradient(135deg,#FF6B8A,#B79CFF)}
.havatar .a3{left:18px;top:30px;width:38px;height:38px;background:linear-gradient(135deg,#4DD6A8,#5BA8F5)}
#htitle{color:#43304F;font-weight:800;letter-spacing:.02em}
#prog{position:absolute;left:44px;right:44px;top:132px;height:7px;z-index:30;
  display:flex;gap:9px}
.pseg{flex:1;border-radius:5px;background:rgba(255,255,255,.55);
  box-shadow:0 2px 8px rgba(150,90,160,.14);overflow:hidden}
.pfill{height:100%;width:0;border-radius:5px;
  background:linear-gradient(90deg,#FF6B8A,#FFC94D);
  box-shadow:0 0 12px rgba(255,140,110,.55);will-change:width}
#chatwrap{position:absolute;left:0;right:0;top:118px;bottom:0;overflow:hidden}
#pchat{position:absolute;left:0;right:0;top:0;will-change:transform}
/* bubble KACA gaya chat asli: nama + waktu + Dibaca v-v DI DALAM bubble;
   warna karakter = ring + glow; teks plum */
.msg{display:flex;margin:18px 44px;opacity:0;will-change:transform,opacity;align-items:flex-end}
.msg.you{justify-content:flex-end}
.avatar{width:64px;height:64px;border-radius:50%;flex:0 0 64px;margin-right:16px;
  border:3px solid rgba(255,255,255,.95);display:flex;align-items:center;justify-content:center;
  font-size:32px;color:#43304F;font-weight:800;will-change:box-shadow;
  box-shadow:0 10px 24px rgba(150,90,160,.28)}
.bwrap{max-width:880px}
.bubble{position:relative;background:rgba(255,255,255,.74);
  backdrop-filter:blur(18px) saturate(1.3);color:#43304F;border:none;
  border-radius:10px 28px 28px 28px;padding:20px 28px 16px;font-weight:700;line-height:1.24;
  border-left:4px solid rgba(255,255,255,.9);
  box-shadow:0 18px 44px rgba(150,90,160,.18);will-change:transform,opacity}
.mname{font-size:31px;font-weight:800;letter-spacing:.08em;margin:0 0 6px 2px}
.act{font-style:italic;color:#A08FB8;font-weight:600}
.say{font-weight:700}
.meta{display:flex;justify-content:flex-end;align-items:baseline;gap:12px;margin-top:6px}
.mtime{font-size:26px;color:#8A7BA0;font-weight:700;letter-spacing:.04em}
.ticks{font-size:27px;color:#12A57E;font-weight:800;letter-spacing:.04em}
.msg.you .bubble{background:linear-gradient(135deg,rgba(255,158,94,.88),rgba(255,107,138,.85));
  color:#FFFFFF;border-radius:28px 10px 28px 28px;border-left:none;border-right:4px solid rgba(255,255,255,.85);
  box-shadow:0 18px 44px rgba(255,120,120,.32),0 0 0 1.5px rgba(255,255,255,.5) inset}
.msg.you .act{color:rgba(255,255,255,.85)}
.msg.you .mtime{color:rgba(255,255,255,.8)}
.msg.myst .bubble{background:linear-gradient(135deg,rgba(255,222,89,.9),rgba(255,201,77,.86));
  color:#5C3A12;border-radius:28px;border-left:none;
  box-shadow:0 18px 44px rgba(255,180,70,.35),0 0 0 1.5px rgba(255,255,255,.6) inset}
.msg.myst .mtime{color:#A67C2E}
.msg.myst .act{color:#B08A3E}
.bubble.photo{padding:14px;background:rgba(255,255,255,.82);border-radius:22px;border-left:none}
.psvg{display:block;width:100%;height:auto;border-radius:14px}
.pcap{font-size:40px;color:#43304F;font-weight:700;padding:12px 8px 4px;line-height:1.25}
.bubble.sticker{background:rgba(255,255,255,.8);color:#7A4A12;border:3px solid #FFC94D;
  border-radius:28px;padding:22px 30px;text-align:center;border-left:none;
  box-shadow:0 20px 48px rgba(255,158,94,.38),0 0 0 2px rgba(255,255,255,.55) inset}
.stk{font-size:52px;font-weight:800;letter-spacing:.05em;
  background:linear-gradient(120deg,#F0417C,#FF9E5E);-webkit-background-clip:text;
  background-clip:text;color:transparent}
.stks{font-size:36px;color:#7A4A12;font-weight:600;margin-top:10px}
/* sisipan meme GLOW: hard cut full-screen gradien, ilustrasi bingkai
   putih glow, mata menyala coral saat kejutan */
#memewrap{position:absolute;inset:0;z-index:45;pointer-events:none}
.meme{position:absolute;inset:0;background:linear-gradient(160deg,#FFEDD9,#FFD9E8 45%,#E8DCFF);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  opacity:0;will-change:transform,opacity}
.mstage{position:relative;display:inline-block;line-height:0;will-change:transform}
.mglyph{border-radius:34px;overflow:hidden;will-change:transform;
  box-shadow:0 0 0 7px #FFFFFF,0 30px 70px rgba(150,90,160,.4),0 0 60px rgba(255,140,110,.35)}
.mglyph img{display:block;width:100%;height:100%;object-fit:cover}
.meyes{position:absolute;left:0;top:0;pointer-events:none}
.meyes i{position:absolute;width:15%;height:10%;border-radius:12px;opacity:0;
  background:#FF5C7A;box-shadow:0 0 26px 10px rgba(255,92,122,.7);
  will-change:opacity,transform}
.meyes i:nth-child(1){left:25%;top:41%}
.meyes i:nth-child(2){left:60%;top:41%}
.mdigits{position:absolute;inset:0;pointer-events:none}
.mdigit{position:absolute;font-family:'JetBrains Mono','DejaVu Sans Mono',monospace;
  font-weight:800;color:rgba(240,65,124,.5);opacity:0;will-change:transform,opacity}
.mtext{margin-top:34px;font-weight:800;letter-spacing:.08em;text-align:center;padding:0 40px;
  opacity:0;will-change:opacity,transform;
  background:linear-gradient(120deg,#F0417C,#FF9E5E,#9B7BF5);-webkit-background-clip:text;
  background-clip:text;color:transparent}
.msub{margin-top:14px;color:rgba(90,60,110,.72);font-weight:600;text-align:center;
  opacity:0;will-change:opacity}
#dim{position:absolute;inset:0;background:rgba(90,50,110,.34);opacity:0;z-index:40;will-change:opacity}
/* diagram menyala: kartu kaca besar */
#flash{position:absolute;inset:26px;z-index:55;border-radius:30px;
  background:rgba(255,255,255,.8);backdrop-filter:blur(20px) saturate(1.3);
  opacity:0;border:1.5px solid rgba(255,255,255,.95);
  box-shadow:0 26px 66px rgba(150,90,160,.3);overflow:hidden;will-change:transform,opacity}
#flash .speed{position:absolute;inset:0;opacity:.6;
  background:repeating-linear-gradient(115deg,transparent 0 26px,rgba(255,140,110,.08) 26px 30px)}
.fkick{position:absolute;top:22px;left:50%;transform:translateX(-50%);
  background:linear-gradient(120deg,#FF6B8A,#FF9E5E,#FFC94D);color:#FFFFFF;
  border-radius:999px;padding:8px 34px;font-weight:800;letter-spacing:.12em;font-size:32px;
  box-shadow:0 10px 26px rgba(255,120,120,.4)}
.ftitle{position:absolute;left:0;right:0;top:74px;text-align:center;font-weight:800;letter-spacing:.03em;
  background:linear-gradient(120deg,#F0417C,#9B7BF5);-webkit-background-clip:text;
  background-clip:text;color:transparent}
.fen{position:absolute;left:0;right:0;text-align:center;color:rgba(90,60,110,.62);font-weight:600;font-size:34px}
.fbody{position:absolute;left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:12px}
.fline{color:#43304F;font-weight:600;opacity:0;will-change:opacity;display:flex;align-items:center;gap:12px}
.fline .dot{width:18px;height:18px;border-radius:50%;flex:0 0 18px;
  background:linear-gradient(135deg,#4DD6A8,#5BA8F5);box-shadow:0 4px 12px rgba(77,214,168,.5)}
.fnote{color:#E8506E;font-weight:700;opacity:0;will-change:opacity}
.fglow{position:absolute;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle,rgba(255,140,110,.3) 0%,rgba(255,140,110,0) 70%);will-change:transform,opacity}
/* papan misi: kartu kaca besar */
#quiz{position:absolute;inset:20px;z-index:60;border-radius:30px;
  background:rgba(255,255,255,.82);backdrop-filter:blur(20px) saturate(1.3);
  opacity:0;border:1.5px solid rgba(255,255,255,.95);
  box-shadow:0 26px 66px rgba(150,90,160,.3);overflow:hidden;will-change:transform,opacity}
.qhd{margin:48px 6% 0;font-weight:800;letter-spacing:.06em;font-size:44px;
  background:linear-gradient(120deg,#F0417C,#9B7BF5);-webkit-background-clip:text;
  background-clip:text;color:transparent}
.qline{height:4px;border-radius:2px;background:linear-gradient(90deg,transparent,#FF6B8A,#FFC94D,transparent);
  width:150px;margin:8px auto 0}
.qrow{margin:10px 6% 0;color:#43304F;font-weight:600;display:flex;gap:12px;opacity:0;will-change:opacity}
.qrow b{color:#E8506E;flex:0 0 auto}
.qgrid{position:absolute;left:0;right:0;display:flex;flex-wrap:wrap;justify-content:center;gap:12px;will-change:opacity}
.qcard{width:132px;height:84px;border-radius:16px;display:flex;align-items:center;justify-content:center;
  background:rgba(255,255,255,.9);border:3px solid #FFC94D;color:#43304F;
  font-family:'JetBrains Mono','DejaVu Sans Mono',monospace;font-weight:800;font-size:44px;
  box-shadow:0 10px 24px rgba(255,158,94,.3);opacity:0;will-change:transform,opacity}
.qnote{position:absolute;left:6%;right:6%;color:rgba(90,60,110,.85);font-weight:600;font-size:32px;
  opacity:0;will-change:opacity}
.qcta{position:absolute;left:0;right:0;text-align:center;color:#FFFFFF;
  background:linear-gradient(120deg,#FF6B8A,#FF9E5E);border-radius:999px;margin:0 10%;
  padding:16px 0;font-weight:800;letter-spacing:.06em;font-size:40px;
  border:2px solid rgba(255,255,255,.55);opacity:0;will-change:transform,opacity;
  box-shadow:0 12px 30px rgba(255,110,120,.4)}
#burst{position:absolute;inset:0;z-index:70;pointer-events:none}
.bp{position:absolute;font-size:44px;opacity:0;will-change:transform,opacity}
.bdot{position:absolute;border-radius:50%;opacity:0;will-change:transform,opacity}
.bsq{position:absolute;border-radius:4px;opacity:0;will-change:transform,opacity}
.rise{position:absolute;font-family:'JetBrains Mono','DejaVu Sans Mono',monospace;font-weight:800;
  color:rgba(240,65,124,.4);opacity:0;will-change:transform,opacity}
/* subtitle + watermark: pil kaca */
body.sceneon #subbar{visibility:hidden}
#subbar{position:absolute;left:50%;transform:translateX(-50%);
  background:rgba(255,255,255,.72);backdrop-filter:blur(16px) saturate(1.2);
  border:1.5px solid rgba(255,255,255,.85);border-radius:22px;padding:14px 34px;text-align:center;
  box-shadow:0 16px 38px rgba(150,90,160,.24);will-change:transform,opacity;z-index:80}
#sub_en{font-size:34px;color:#43304F;font-weight:600;line-height:1.25}
#mark{position:absolute;left:50%;transform:translateX(-50%);background:rgba(255,255,255,.72);
  backdrop-filter:blur(14px);color:#43304F;border:1.5px solid rgba(255,255,255,.9);
  border-radius:999px;padding:8px 28px;font-weight:800;letter-spacing:.18em;font-size:30px;z-index:80;
  box-shadow:0 10px 24px rgba(150,90,160,.24)}
#endcard{position:absolute;opacity:0;z-index:90;will-change:transform,opacity}
#fplate{position:absolute;border-radius:26px;background:rgba(255,255,255,.78);
  backdrop-filter:blur(18px);display:flex;align-items:center;justify-content:center;color:#43304F;
  font-weight:800;letter-spacing:.06em;border:1.5px solid rgba(255,255,255,.95);
  box-shadow:0 22px 54px rgba(150,90,160,.4);z-index:91}
#f_url{font-family:'JetBrains Mono','DejaVu Sans Mono',monospace}
#f_bar{position:absolute;border-radius:5px;background:linear-gradient(90deg,#FF6B8A,#FFC94D,#4DD6A8);

#flashwhite{position:absolute;inset:0;background:#FFF8F0;opacity:0;pointer-events:none;z-index:95}
#fade{position:absolute;inset:0;background:linear-gradient(160deg,#FFEDD9,#E8DCFF);
  opacity:0;pointer-events:none;z-index:100}
/* HERO SCENE sinematik (diisi frag_scene.js): poster materi full-bleed
   dengan Ken Burns + scrim plum + judul display + garis gradien */
#herol{position:absolute;inset:0;z-index:35;pointer-events:none}
.hero{position:absolute;inset:0;opacity:0;will-change:opacity}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;will-change:transform}
.hero .hs{position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(67,48,79,.30) 0%,rgba(67,48,79,.05) 42%,rgba(67,48,79,.58) 100%)}
.hero .ht{position:absolute;left:0;right:0;bottom:14%;text-align:center;color:#FFFFFF;
  font-weight:800;letter-spacing:.08em;padding:0 44px;line-height:1.22;
  text-shadow:0 8px 34px rgba(60,30,80,.7),0 3px 14px rgba(60,30,80,.5);
  will-change:opacity,transform}
.hero .hr{position:absolute;left:50%;bottom:calc(14% - 28px);transform:translateX(-50%);

/* INTRO FILM GLOW: kartu judul full-bleed (hero AI) lalu kartu produksi
   kaca "dipersembahkan akiomida.com" */
#intro1{position:absolute;inset:0;z-index:85;opacity:0;will-change:opacity}
#introimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;will-change:transform}
#introshade{position:absolute;inset:0;

#introtitle{position:absolute;left:0;right:0;bottom:12%;text-align:center;color:#FFFFFF;
  font-weight:800;letter-spacing:.12em;padding:0 34px;line-height:1.2;
  text-shadow:0 8px 36px rgba(60,30,80,.72),0 3px 14px rgba(60,30,80,.5);
  will-change:opacity,transform}
#introrule{position:absolute;left:50%;bottom:calc(12% - 30px);transform:translateX(-50%);
  width:0;height:4px;border-radius:2px;
  background:linear-gradient(90deg,transparent,#FF6B8A,#FFC94D,transparent);will-change:width}
#intro2{position:absolute;inset:0;z-index:85;display:none;flex-direction:column;

#intro2kick{color:rgba(90,60,110,.72);font-weight:700;letter-spacing:.42em;text-indent:.42em;

#intro2name{margin-top:18px;font-weight:800;letter-spacing:.08em;

#intro2line{margin-top:28px;width:0;height:4px;border-radius:2px;

  background:linear-gradient(90deg,transparent,rgba(255,255,255,.5),transparent);

/* DIAGRAM rev24: band kaca + fill gradien */
.rband{position:relative;height:30px;border-radius:10px;
  background:rgba(255,255,255,.62);border:1.5px solid rgba(255,255,255,.9);

.rtick{position:absolute;bottom:0;width:2.5px;border-radius:1px;background:rgba(150,90,160,.22)}
